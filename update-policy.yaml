# Update policy: the ONE update path of every dependency (spec R5).
#
# The four paths:
#   auto-merge       the console merges once the countdown has elapsed AND CI passed
#   batch-approve    collected into one suggested batch PR the operator approves in one click
#   session          an upgrade session (disposable pod, brief, snapshot, verify) does the update
#   operator-runbook the operator runs it by hand; the console only tracks it (Omni)
#
# The console -- NOT Renovate -- is the only merger. Renovate opens PRs with automerge:false
# everywhere (main has no required checks, so Renovate merging on its own would bypass the
# CI hold, R28). renovate.json5 is GENERATED from this file:
#   scripts/life_policy.py --emit-renovate --write
#
# Stateful apps (own a PVC / volumeClaimTemplate, or are the storage layer) and Argo Rollouts
# apps resolve to `session` for EVERY update type -- operator decision. A stateful upgrade
# needs a pre-merge Longhorn snapshot and a rollback path, and a Rollout needs a promote or
# abort decision; neither can happen unattended. scripts/tests/fixtures/life/app-facts.yaml
# (generated by --emit-facts) records which apps are stateful; a test fails when one has no
# unrestricted `session` rule below.
#
# Rules are first-match; `update:` restricts a rule to patch/minor/major. match is one of
# app (cluster/name), image, chart or dep. Anything unmatched takes `defaults`.
version: 1
# CI gate (spec R28). derio-net/frank runs its CI on GitHub-hosted runners and is never mirrored
# to Gitea, so the gate is GitHub check-runs from the GitHub Actions app. Every check named here
# must be `success` on the PR head before the console merges anything. Only workflows with NO
# `paths:` filter on pull_request may be listed: a path-filtered check never runs on a PR that
# touches other files, and the PR would wait forever. (Console contract: ci_source, required_ci_checks.)
ci_source: github-checks
required_ci_checks:
- tripwires
defaults:
  patch: auto-merge
  minor: batch-approve
  major: session

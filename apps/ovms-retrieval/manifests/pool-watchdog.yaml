# Resets the iGPU buffer pool before it can OOM-kill the server.
#
# WHAT IS BEING WATCHED, AND WHY IT IS NOT A LEAK.
# The Intel iGPU has no VRAM, so every GPU allocation OpenVINO makes is a
# shmem-backed host page, PINNED UNEVICTABLE inside this container's cgroup.
# Measured live 2026-09-14 while the server held 5.11 GiB:
#
#   shmem 5.11 GiB | unevictable 5.11 GiB | inactive_file 0 | active_file 0
#   anon 0.55 GiB  | swap.max 0
#
# shmem and unevictable are the same number, there is no page cache to drop,
# and there is no swap. So `limits.memory` on the ovms container is not a
# safety margin around a process — it IS the GPU's memory budget, and when it
# is reached the kernel has nothing it is permitted to reclaim. It kills.
#
# The pool grows toward the largest request shape served (batch x tokens, and
# the token term is close to quadratic — attention is B x heads x T x T on an
# XLM-RoBERTa-large cross-encoder). Verified behaviour:
#
#   * repeating a served shape grows nothing;
#   * a NEW but SMALLER shape grows nothing;
#   * an ASCENDING sequence costs more than the largest shape alone
#     (fresh -> 50x500 tokens = 3.49 GiB, but 20x500 -> 50x500 = 4.13 GiB);
#   * nothing is ever released while the container lives.
#
# That last point is the whole reason this file exists. The graph-level cap
# (max_allowed_chunks / max_position_embeddings, injected into the exported
# graph.pbtxt) bounds what any ONE request can allocate. It cannot bound what
# a long-lived server accumulates across a session, and only a restart returns
# the pool to baseline. A pod restart is therefore not a workaround here, it
# is the designed reset — and it costs 11s (measured: pod created to Ready,
# warm node, seed skipped).
#
# WHY A RESTART AND NOT SCALE-TO-ZERO. Scaling to zero would need an activator
# in the request path to accept a connection at 0 replicas, scale up, wait out
# the cold start and proxy — a permanent new component and ~11s on the first
# request of every burst, to reclaim 2.26 GiB on a 64 GB node and an iGPU that
# nothing else claims (one ResourceClaim exists cluster-wide). Revisit if a
# second consumer appears for the minis' iGPUs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ovms-pool-watchdog
  namespace: retrieval
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ovms-pool-watchdog
  namespace: retrieval
rules:
  # `patch` on deployments covers BOTH actions this job takes: stamping the
  # last-busy annotation, and `rollout restart` (which is a patch of the pod
  # template's restartedAt annotation). No `delete` anywhere — deleting the
  # pod directly would bypass the Recreate strategy the RWO model PVC needs.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  # Reading the pool means reading the container's own cgroup, which is the
  # exact pinned figure. The alternative — querying working_set from
  # VictoriaMetrics — is both less precise and a dependency on the monitoring
  # stack being up at the moment this needs to act.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ovms-pool-watchdog
  namespace: retrieval
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ovms-pool-watchdog
subjects:
  - kind: ServiceAccount
    name: ovms-pool-watchdog
    namespace: retrieval
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ovms-pool-watchdog
  namespace: retrieval
spec:
  # Every 2 minutes, tightened from 5 on 2026-09-14. Test Plan row 10 reached
  # 84.9% of the old 10Gi limit by firing three ascending requests within
  # SECONDS — faster than any tick. No schedule prevents an ascent inside one
  # tick; a shorter one only narrows the window in which the next burst starts
  # from an already-elevated pool.
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: ovms-pool-watchdog
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 5000
            runAsGroup: 5000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              image: bitnamilegacy/kubectl:1.33.4
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
              env:
                # Restart regardless of whether the server looks busy. 60 ->
                # 50 on 2026-09-14, alongside the 16Gi ceiling: the measured
                # worst case is an ASCENDING sequence (8.49 GiB at the old
                # limit), not a single call, so the trigger wants to sit below
                # where an ascent has already committed most of the budget.
                # Above this a further cap-sized request (3.40 GiB measured at
                # 64 documents x 600 tokens) is going to take the process down
                # anyway — and an OOM costs the in-flight request PLUS ~10s of
                # refused connections, which is strictly worse than a
                # controlled 11s restart.
                - name: CRITICAL_PERCENT
                  value: "50"
                # Below this the pool is at or near its post-boot baseline
                # (1.71 GiB of model weights on the GPU) and there is nothing
                # worth reclaiming.
                - name: ELEVATED_BYTES
                  value: "2400000000"
                # A pool above ELEVATED_BYTES is reset once the server has
                # been quiet this long. Long enough that a caller sending a
                # request every few minutes never pays a cold start.
                - name: IDLE_SECONDS
                  value: "1800"
                # There is deliberately NO busy threshold here. Until
                # 2026-09-19 "busy" was a 10-second cpu.stat delta against
                # BUSY_MILLICORES=50, and it restarted a working server five
                # times in sixteen minutes, killing a batch-index job at batch
                # 7 of 40. OpenVINO offloads inference to the iGPU, so those
                # ticks read 5, 29, 41 and 5 millicores while the pool climbed
                # 5.10 -> 7.24 -> 8.31 GiB: no value of that threshold
                # separates "indexing" from "asleep" on this workload. The
                # signal was removed rather than retuned, and busy now comes
                # from the server's own /metrics — see the read below.
              command: ["/bin/bash", "-euo", "pipefail", "-c"]
              args:
                - |
                  NS=retrieval
                  DEPLOY=ovms-retrieval
                  ANNOTATION=retrieval.derio.net/pool-watchdog-last-busy
                  ACTIVITY_ANNOTATION=retrieval.derio.net/pool-watchdog-last-activity

                  pod=$(kubectl -n "$NS" get pods -l app.kubernetes.io/name=ovms-retrieval \
                          --field-selector=status.phase=Running \
                          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                  if [ -z "$pod" ]; then
                    echo "pool-watchdog result: action=none reason=no-running-pod"
                    exit 0
                  fi

                  # ONE exec returns everything this tick decides on, in order:
                  #   line 1   shmem       — the pinned GPU pool, read from the
                  #                          container's own cgroup, which is
                  #                          the exact figure and not a scrape;
                  #   line 2   memory.max  — the ceiling the kernel kills at;
                  #   line 3+  the server's own /metrics, which is where
                  #                          "is it working?" is answered.
                  #
                  # It is one exec on purpose: the pool figure and the activity
                  # figure must describe the same pod at the same instant, or a
                  # restart decision can be taken from a memory reading and an
                  # activity reading that disagree about which process they saw.
                  # If the pod is mid restart this fails and we do nothing.
                  read_state() {
                    kubectl -n "$NS" exec "$pod" -c ovms -- sh -c '
                      grep "^shmem " /sys/fs/cgroup/memory.stat | cut -d" " -f2
                      cat /sys/fs/cgroup/memory.max
                      curl -s -m 5 http://127.0.0.1:8000/metrics
                    ' 2>/dev/null
                  }
                  state=$(read_state) || true
                  if [ -z "${state:-}" ]; then
                    echo "pool-watchdog result: action=none reason=unreadable-cgroup"
                    exit 0
                  fi

                  shmem=$(echo "$state" | sed -n 1p)
                  limit=$(echo "$state" | sed -n 2p)
                  metrics=$(echo "$state" | tail -n +3)

                  # `curl` shares the exec with the two cgroup reads above, so
                  # it can fail WITHOUT the exec itself failing — the shmem
                  # and memory.max lines still come back and `state` is still
                  # non-empty. Left unguarded, that tick would silently carry
                  # in_flight=0, activity=0 into the busy determination below,
                  # which is indistinguishable from "confirmed idle" and
                  # reopens root cause A through a different door. Caught
                  # here, before anything downstream trusts an activity
                  # figure that was never actually read.
                  metrics_unreadable=no
                  if [ -z "$metrics" ]; then metrics_unreadable=yes; fi

                  # Sum every sample of one Prometheus metric, across all its
                  # label sets.
                  #
                  # The match is anchored on the metric name AND the character
                  # that must follow it — `{` when the sample carries labels, a
                  # space when it does not, which the exposition format
                  # guarantees. A bare prefix match would also be anchored and
                  # would also skip the `# HELP` / `# TYPE` lines, but it would
                  # fold in any FUTURE series whose name merely starts with this
                  # one. That is not a hypothetical worry: this same endpoint
                  # already ships ovms_graph_processing_time_us_bucket/_count/
                  # _sum, so suffixing a base name is the habit of the source.
                  # Counting a stray series here fails quietly — the watchdog
                  # reads busy forever and stops reclaiming, with nothing to
                  # show for it until the ceiling.
                  #
                  # `print s+0` is load-bearing too: a name that matches nothing
                  # must yield 0, not the empty string, or the integer
                  # comparisons below abort the script under `set -e`.
                  sum_series() {
                    echo "$metrics" | awk -v name="$1" '
                      index($0, name "{") == 1 || index($0, name " ") == 1 {s += $NF}
                      END {print s+0}'
                  }
                  in_flight=$(sum_series ovms_current_graphs)
                  activity=$(( $(sum_series ovms_requests_accepted) + $(sum_series ovms_requests_rejected) ))

                  # `memory.max` reads "max" when unlimited; treat that as
                  # "no critical threshold" rather than dividing by a word.
                  if [ "$limit" = "max" ]; then limit=0; fi

                  now=$(date -u +%s)

                  # Is the server working? Two terms, because one instant and
                  # one interval are different questions:
                  #
                  #   in_flight  — the gauge, true only for the moment sampled;
                  #   activity   — the counter, so a request that arrived at ANY
                  #                point since the previous tick still counts.
                  #
                  # The counter term is the important half: a batch job with
                  # gaps between its batches is idle at most instants, and that
                  # shape is precisely what the old 10-second CPU sample missed.
                  last_activity=$(kubectl -n "$NS" get "deployment/$DEPLOY" \
                                    -o "jsonpath={.metadata.annotations.retrieval\.derio\.net/pool-watchdog-last-activity}" 2>/dev/null || true)
                  # First tick against this Deployment: no delta is knowable,
                  # so claim none rather than inventing one.
                  if [ -z "${last_activity:-}" ]; then last_activity=$activity; fi

                  busy=no
                  activity_reset=0
                  if [ "$metrics_unreadable" = no ]; then
                    if [ "$in_flight" -gt 0 ]; then busy=yes; fi
                    if [ "$activity" -gt "$last_activity" ]; then busy=yes; fi
                    # A restarted pod serves this counter from zero, since
                    # OVMS counters start fresh on every process — a DROP is
                    # a counter reset, not idleness. Without this, the first
                    # requests after every restart would read as idle, which
                    # reintroduces root cause A (a working server misread as
                    # asleep) through the back door of the very mechanism
                    # meant to close it.
                    if [ "$activity" -lt "$last_activity" ]; then
                      busy=yes
                      activity_reset=1
                    fi
                  fi

                  # A restart invalidates every prior observation of the last
                  # -busy clock — the process it was measuring no longer
                  # exists. `rollout restart` does not touch the annotation
                  # itself, and until this stamp the clock stayed frozen at
                  # its pre-restart value: 2026-09-19 restarted a working
                  # server four times in six minutes, one per tick, because
                  # every subsequent tick still saw the SAME stale idle_for.
                  # Stamping here bounds the worst case to one hygiene
                  # restart per IDLE_SECONDS, whatever the activity signal
                  # does on the next tick.
                  restart() {
                    kubectl -n "$NS" rollout restart "deployment/$DEPLOY"
                    # The result line comes BEFORE the stamp, not after. Under
                    # `set -e` a non-zero kubectl aborts the script, so a
                    # transient failure on the stamp would otherwise swallow
                    # the only record that this restart ever happened — and
                    # that record is what the ovms-pool-watchdog-restart-loop
                    # alert counts. A failed stamp still aborts the tick, which
                    # is right: the Job fails visibly rather than quietly
                    # accepting a clock it could not advance.
                    echo "pool-watchdog result: action=restart reason=$1 shmem=$shmem limit=$limit in_flight=$in_flight activity=$activity"
                    kubectl -n "$NS" annotate "deployment/$DEPLOY" "$ANNOTATION=$now" --overwrite >/dev/null
                  }

                  # Stamped on EVERY tick with a real reading, busy or not.
                  # The last-busy clock advances only on busy ticks by
                  # design — this one is a counter reading, and a reading
                  # skipped is a delta silently attributed to the wrong
                  # interval. Skipped entirely when metrics are unreadable:
                  # $activity is a placeholder 0 in that case, and stamping
                  # it would poison the NEXT tick's baseline into reading a
                  # real count as a rise.
                  if [ "$metrics_unreadable" = no ]; then
                    kubectl -n "$NS" annotate "deployment/$DEPLOY" "$ACTIVITY_ANNOTATION=$activity" --overwrite >/dev/null

                    if [ "$busy" = yes ]; then
                      kubectl -n "$NS" annotate "deployment/$DEPLOY" "$ANNOTATION=$now" --overwrite >/dev/null
                    fi
                  fi

                  # Rule 1 — safety. Ignores idleness on purpose: see
                  # CRITICAL_PERCENT above.
                  if [ "$limit" -gt 0 ]; then
                    # Integer math on purpose: percent-of-limit is exact
                    # enough for a threshold whose job is to be crossed early,
                    # and it keeps this script to bash + kubectl, matching the
                    # pipelinerun-ttl-gc CronJob's stated constraint.
                    critical=$(( limit / 100 * CRITICAL_PERCENT ))
                    if [ "$shmem" -ge "$critical" ]; then
                      restart critical-pool
                      exit 0
                    fi
                  fi

                  # Rule 1 above does not consult `busy` and stays fully
                  # armed even here — an unreadable scrape must not disarm
                  # the OOM-avoiding restart. Past this point every decision
                  # DOES depend on a real activity reading, so refuse to take
                  # hygiene action rather than act on a placeholder. The cost
                  # of failing this way is an elevated pool that goes
                  # unreclaimed for one tick, which is strictly the lesser
                  # harm next to restarting (or not restarting) on a made-up
                  # zero.
                  if [ "$metrics_unreadable" = yes ]; then
                    echo "pool-watchdog result: action=none reason=metrics-unreadable shmem=$shmem limit=$limit"
                    exit 0
                  fi

                  if [ "$busy" = yes ]; then
                    echo "pool-watchdog result: action=none reason=busy shmem=$shmem in_flight=$in_flight activity=$activity activity_reset=$activity_reset"
                    exit 0
                  fi

                  # Rule 2 — hygiene. An elevated pool that nobody is using is
                  # headroom the next session will not have.
                  if [ "$shmem" -lt "$ELEVATED_BYTES" ]; then
                    echo "pool-watchdog result: action=none reason=pool-at-baseline shmem=$shmem in_flight=$in_flight activity=$activity"
                    exit 0
                  fi

                  last=$(kubectl -n "$NS" get "deployment/$DEPLOY" \
                           -o "jsonpath={.metadata.annotations.retrieval\.derio\.net/pool-watchdog-last-busy}" 2>/dev/null || true)
                  if [ -z "${last:-}" ]; then
                    # Never seen busy. Stamp now so the idle clock starts from
                    # an observation rather than from pod age, and wait.
                    kubectl -n "$NS" annotate "deployment/$DEPLOY" "$ANNOTATION=$now" --overwrite >/dev/null
                    echo "pool-watchdog result: action=none reason=no-baseline-yet shmem=$shmem in_flight=$in_flight activity=$activity"
                    exit 0
                  fi

                  idle_for=$(( now - last ))
                  if [ "$idle_for" -ge "$IDLE_SECONDS" ]; then
                    restart idle-with-elevated-pool
                    exit 0
                  fi

                  echo "pool-watchdog result: action=none reason=idle-too-recent shmem=$shmem idle_for=$idle_for in_flight=$in_flight activity=$activity"

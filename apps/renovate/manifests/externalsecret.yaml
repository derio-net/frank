# Materialises the ~1h GitHub App installation token the Renovate CronJob reads as
# RENOVATE_TOKEN. refreshInterval + the job deadline stay under the 1h token TTL. The PEM Secret
# (github-app-renovate-key) must exist in THIS namespace -- see clustergenerator.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-token
  namespace: renovate
  annotations:
    # Dormant until phase 7: the PEM Secret and the real appID/installID do not exist yet, so this
    # sits in SecretSyncedError and Argo CD rolls that up as the whole app being Degraded, although
    # the CronJob is deliberately suspended. Skip THIS resource's health, only while that holds:
    # phase 7 sets the CronJob `suspend: false` and must delete this annotation in the same commit
    # (scripts/tests/test_life_pre_phase7_quiet.py pins both directions), so a token that cannot be
    # minted degrades the app again the moment it matters.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  refreshInterval: 20m
  target:
    name: renovate-github-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        token: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: github-app-renovate

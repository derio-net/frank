driver:
  enabled: false

toolkit:
  enabled: false

operator:
  defaultRuntime: containerd

# Talos installs NVIDIA driver/toolkit via system extensions.
# The driver binaries are at /usr/local/bin and libraries at
# /usr/local/glibc/usr/lib64.  driverInstallDir tells the operator
# where to mount the driver root into its pods.
hostPaths:
  driverInstallDir: /usr/local

# Disable CDI — Talos's nvidia-container-toolkit extension already
# configures containerd with the nvidia runtime hook.  CDI mode fails
# because the device plugin can't locate libcuda.so at the non-standard
# Talos path (/usr/local/glibc/usr/lib64).
cdi:
  enabled: false
  default: false

# GPU time-slicing: gpu-1 advertises nvidia.com/gpu x2 so Ollama and the speech
# service can both hold a GPU request. This is NOT isolation (no VRAM or
# fault separation); gpu-switcher keeps ComfyUI away and the VRAM budget guard
# (apps/speech/manifests/files/vram-budget.yaml) bounds the pair. Config lives
# in apps/gpu-operator-extras/manifests/time-slicing-config.yaml.
# INSTALL-TIME ONLY: the gpu-operator Application ignores the ClusterPolicy
# /spec (apps/root/templates/gpu-operator.yaml), so ArgoCD never applies a
# change here to the live cluster. The live value is set by the fr op
# postmerge-timeslice-allocatable (speech plan ops.yaml), whose patch
# scripts/tests/test_speech_ops.py pins to this block. Change both together.
devicePlugin:
  config:
    name: time-slicing-config
    default: any

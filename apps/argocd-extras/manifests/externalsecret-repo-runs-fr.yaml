# ArgoCD repository credential for the PRIVATE github.com/derio-net/runs-fr
# chart repo (Phase 7, plan 2026-06-15-staging-vcluster-gate). Every other
# Application in this repo sources the public derio-net/frank repo, so no
# ArgoCD repo credential existed for any github.com/derio-net repo before this
# (verified live 2026-09-14: `argocd repo list` has no runs-fr entry). The
# `argocd.argoproj.io/secret-type: repository` label on the target template is
# what makes ArgoCD register it — same pattern as repo-stoa-companies above.
#
# Reuses the existing github-app-derio ClusterGenerator (apps/secure-agent-pod/
# manifests/clustergenerator-github-app.yaml) — that App installation covers
# ALL derio-net repos, including runs-fr, so no new generator is needed.
#
# NOTE: ESO resolves this generator's privateKey.secretRef (github-app-derio-key)
# in the CONSUMING ExternalSecret's namespace, i.e. `argocd`, NOT the namespace
# the generator was first created for (secure-agent-pod) — see the
# frank-gitops-push incident in frank-gotchas.md. The PEM must therefore ALSO
# exist as Secret `github-app-derio-key` in namespace `argocd`, applied
# out-of-band. Manual op: cicd-staging-gate-argocd-runs-fr-repo-key.
#
# Consumed by the runs-fr-staging Application (apps/root/templates/), which
# pulls the runs-fr Helm chart from this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-runs-fr
  namespace: argocd
spec:
  # Under the ~1h installation-token TTL (same as frank-gitops-push).
  refreshInterval: 45m
  target:
    name: repo-runs-fr
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        name: runs-fr
        url: https://github.com/derio-net/runs-fr.git
        username: x-access-token
        password: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: github-app-derio

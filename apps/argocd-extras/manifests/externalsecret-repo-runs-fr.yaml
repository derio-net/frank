# ArgoCD repository credential for the PRIVATE github.com/derio-net/runs-fr
# chart repo, consumed by the runs-fr-staging Application (plan
# 2026-06-15-staging-vcluster-gate, phase 7). The
# `argocd.argoproj.io/secret-type: repository` label on the target template is
# what makes ArgoCD register it; the shape follows
# externalsecret-repo-stoa-companies.yaml in this directory.
#
# The token comes from the SCOPED generator github-app-derio-argocd-read
# (contents:read on the gated repos only), never from the unscoped
# github-app-derio that secure-agent-pod and tekton use. It is a ~1h
# installation token, so refreshInterval stays under the TTL.
#
# NOTE: ESO resolves the generator's privateKey.secretRef in THIS ExternalSecret's
# namespace, argocd. Secret github-app-derio-key must therefore exist in argocd,
# applied out-of-band from secrets/github-app/github-app-derio-key-argocd.yaml by
# manual op cicd-staging-gate-argocd-runs-fr-repo-key. Without it this
# ExternalSecret sits in SecretSyncedError while ArgoCD stays green (the
# frank-gitops-push failure mode).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-runs-fr
  namespace: argocd
spec:
  refreshInterval: 45m
  target:
    name: repo-runs-fr
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        name: runs-fr
        url: https://github.com/derio-net/runs-fr.git
        username: x-access-token
        password: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: github-app-derio-argocd-read

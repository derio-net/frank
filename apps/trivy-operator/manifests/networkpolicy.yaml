# Trivy client/server has no authentication beyond a shared token, so the server only
# accepts connections from the operator, its scan jobs and the hop-scan namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-server-ingress
  namespace: trivy-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              trivy-operator.scan-job: "true"
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trivy-operator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hop-scan
      ports:
        - { protocol: TCP, port: 4954 }

# Disable alerting — Phase 9+
vmalert:
  enabled: false
alertmanager:
  enabled: false

# Disable kube-controller-manager scraping — service name exceeds 63 chars with this release name
kubeControllerManager:
  enabled: false

# VMSingle — single-node metrics storage
vmsingle:
  spec:
    retentionPeriod: "1"   # 1 month
    storage:
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi

# vmagent — raise the per-scrape response cap.
#
# The kube-state-metrics scrape response outgrew VictoriaMetrics' default
# -promscrape.maxScrapeSize (16MiB) and vmagent DISCARDED THE WHOLE RESPONSE,
# marking the target down with:
#
#   the response from "http://<ksm>:8080/metrics" exceeds
#   -promscrape.maxScrapeSize or max_scrape_size in the scrape
#
# Measured 2026-07-27: KSM /metrics = 21.6 MiB. The effect is total, not
# partial — EVERY kube_* series vanished from VMSingle, and the 25 references
# to kube_* across apps/grafana-alerting/manifests/alert-rules-cm.yaml were
# evaluating against no data. Two of those references are
# kube_cronjob_status_last_successful_time, so the rule that would report a
# CronJob no longer succeeding was itself among the blinded. Nothing paged:
# health-bridge deliberately caps synthetic DatasourceError/NoData at
# `degraded`, so blindness is never mistaken for death.
#
# What drives the size is POD series: 108,460 of ~120,000, and 1932 of Frank's
# 2124 pods are completed/errored Tekton pods. That is the DESIGNED 7-day
# PipelineRun retention at current CI volume (~260 runs/day since the Gitea
# Actions migration), not a backlog — the concurrent GC outage accounted for
# only ~76 extra runs. So this cap and the GC's memory limit are two
# independent limits crossed by one growth curve, not cause and effect.
# Shortening the retention TTL would roughly halve this payload and is worth
# considering separately; raising the cap is what restores alerting now.
#
# Note promscrape.streamParse is already on (a chart default, kept explicitly
# below) — streaming does NOT exempt a response from maxScrapeSize; the cap is
# enforced regardless. Same silent-drop family as the maxLabelsPerTimeseries
# note on the kubelet scrape below: a limit is exceeded, data is dropped whole,
# and the only symptom is an absence.
#
# extraArgs is restated in full rather than adding one key, so a values merge
# can never silently drop the two chart defaults.
vmagent:
  spec:
    extraArgs:
      promscrape.dropOriginalLabels: "true"
      promscrape.streamParse: "true"
      promscrape.maxScrapeSize: "32MB"

# Kubelet scrape (cadvisor + resources + probes + kubelet) — drop high-cardinality
# node-meta labels. The chart's default relabelConfigs labelmap every
# `__meta_kubernetes_node_label_*` onto every metric. On Frank's amd64 nodes
# (NFD CPU features, Talos extensions, NVIDIA driver labels) this puts each
# series at 60–135 labels, exceeding VictoriaMetrics' default
# -maxLabelsPerTimeseries=40, so vmsingle silently drops them — that is the
# cause of the cadvisor metric gap on the 5 amd64 nodes (mini-1/2/3, gpu-1,
# pc-1). raspi nodes carry ~33 labels and pass under the limit. Adding a
# labeldrop after the chart's default keeps the useful node labels (tier,
# zone, kubernetes_io_arch, node, instance, accelerator, igpu) and trims the
# pure metadata noise.
kubelet:
  vmScrape:
    spec:
      metricRelabelConfigs:
        - action: labeldrop
          regex: (uid)
        - action: labeldrop
          regex: (id|name)
        - action: drop
          source_labels: [__name__]
          regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
        - action: labeldrop
          regex: (feature_node_kubernetes_io_.*|extensions_talos_dev_.*|nvidia_com_.*|beta_kubernetes_io_.*)

# Grafana — exposed via Cilium L2 LoadBalancer
grafana:
  enabled: true
  # RWO Longhorn PVC + single replica → must use Recreate, not RollingUpdate (frank-gotchas.md)
  deploymentStrategy:
    type: Recreate
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.55.203
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 1Gi
  # Install VictoriaLogs datasource plugin (pre-installs on pod start)
  plugins:
    - victoriametrics-logs-datasource
    - yesoreyeram-infinity-datasource
  # VictoriaLogs datasource is provisioned declaratively via grafana-victorialogs-ds ConfigMap.
  # extraConfigmapMounts mounts it into /etc/grafana/provisioning/datasources/.
  extraConfigmapMounts:
    - name: victorialogs-datasource
      mountPath: /etc/grafana/provisioning/datasources/victorialogs.yaml
      subPath: victorialogs-datasource.yaml
      configMap: grafana-victorialogs-datasource
      readOnly: true
    # GoatCounter analytics datasource (Infinity HTTP plugin), obs layer
    - name: goatcounter-datasource
      mountPath: /etc/grafana/provisioning/datasources/goatcounter.yaml
      subPath: goatcounter-datasource.yaml
      configMap: grafana-goatcounter-datasource
      readOnly: true
    # --- Alerting provisioning (rules, contact points, notification policy) ---
    - name: alerting-rules
      mountPath: /etc/grafana/provisioning/alerting/alert-rules.yaml
      subPath: alert-rules.yaml
      configMap: grafana-alerting-rules
      readOnly: true
    - name: alerting-contact-points
      mountPath: /etc/grafana/provisioning/alerting/contact-points.yaml
      subPath: contact-points.yaml
      configMap: grafana-alerting-contact-points
      readOnly: true
    - name: alerting-notification-policy
      mountPath: /etc/grafana/provisioning/alerting/notification-policy.yaml
      subPath: notification-policy.yaml
      configMap: grafana-alerting-notification-policy
      readOnly: true
    # --- Dashboard provisioning (provider config + JSON) ---
    - name: dashboard-provider
      mountPath: /etc/grafana/provisioning/dashboards/feature-health-provider.yaml
      subPath: feature-health-provider.yaml
      configMap: grafana-alerting-dashboard
      readOnly: true
    - name: dashboard-json
      mountPath: /var/lib/grafana/dashboards/feature-health/feature-health.json
      subPath: feature-health.json
      configMap: grafana-alerting-dashboard
      readOnly: true
    # secure-agent-pod operating dashboard (Phase 5 soak readings)
    - name: sap-dashboard-provider
      mountPath: /etc/grafana/provisioning/dashboards/secure-agent-pod-provider.yaml
      subPath: secure-agent-pod-provider.yaml
      configMap: grafana-secure-agent-pod-dashboard
      readOnly: true
    # Blog Edge dashboards — obs layer phase 2
    - name: blog-edge-dashboard-provider
      mountPath: /etc/grafana/provisioning/dashboards/blog-edge-provider.yaml
      subPath: blog-edge-provider.yaml
      configMap: grafana-blog-edge-dashboard
      readOnly: true
    - name: blog-edge-dashboard-json
      mountPath: /var/lib/grafana/dashboards/blog-edge/blog-overview.json
      subPath: blog-overview.json
      configMap: grafana-blog-edge-dashboard
      readOnly: true
    - name: blog-edge-security-dashboard-json
      mountPath: /var/lib/grafana/dashboards/blog-edge/security-events.json
      subPath: security-events.json
      configMap: grafana-blog-edge-dashboard
      readOnly: true
    - name: sap-dashboard-json
      mountPath: /var/lib/grafana/dashboards/secure-agent-pod/secure-agent-pod.json
      subPath: secure-agent-pod.json
      configMap: grafana-secure-agent-pod-dashboard
      readOnly: true
  # Authentik OIDC SSO (Phase 13) + Alerting secrets (Telegram, Health Bridge)
  envFromSecrets:
    - name: grafana-oidc-secret
      optional: false
    - name: grafana-alerting-secrets
      optional: true
    - name: grafana-goatcounter-token
      optional: true
  grafana.ini:
    server:
      root_url: https://grafana.cluster.derio.net
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: grafana
      client_secret: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email groups offline_access
      auth_url: https://auth.cluster.derio.net/application/o/authorize/
      token_url: https://auth.cluster.derio.net/application/o/token/
      api_url: https://auth.cluster.derio.net/application/o/userinfo/
      role_attribute_path: "contains(groups[*], 'root-admins') && 'Admin' || contains(groups[*], 'root-devops') && 'Editor' || 'Viewer'"
      allow_assign_grafana_admin: true

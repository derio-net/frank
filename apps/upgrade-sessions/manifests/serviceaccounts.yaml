# One ServiceAccount per in-cluster upgrade type (console contract: upgrade-session-<type>).
# hop-os acts on Hop only, through its own talosconfig/kubeconfig, and gets no Frank token.
# automountServiceAccountToken is false here; the console's pod sets it true explicitly and the
# admission policy upgrade-session-pods requires exactly that, so no other pod gets these tokens.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: upgrade-session-chart-major
  namespace: upgrade-sessions
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: upgrade-session-stateful
  namespace: upgrade-sessions
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: upgrade-session-rollouts
  namespace: upgrade-sessions
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: upgrade-session-frank-os
  namespace: upgrade-sessions
automountServiceAccountToken: false

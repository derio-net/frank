# Traefik Middleware CRDs for *.cluster.derio.net
# Spec: docs/superpowers/specs/2026-03-29--net--in-cluster-ingress-design.md
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik-system
spec:
  headers:
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 15552000
    customFrameOptionsValue: SAMEORIGIN
    referrerPolicy: strict-origin-when-cross-origin
    customRequestHeaders:
      X-Forwarded-Proto: https
    customResponseHeaders:
      X-Robots-Tag: none
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ip-allowlist
  namespace: traefik-system
spec:
  ipAllowList:
    sourceRange:
      - "10.0.0.0/8"
      - "192.168.0.0/16"
      - "172.16.0.0/12"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: traefik-system
spec:
  forwardAuth:
    address: "http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik"
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
# Upload cap for the speech API: 2.5 h of 16 kHz mono 16-bit WAV is ~290 MB;
# 2 GiB leaves headroom for stereo/higher-rate sources. Bodies above 32 MiB
# spill to the proxy's temp dir while buffering.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: speech-upload-limit
  namespace: traefik-system
spec:
  buffering:
    maxRequestBodyBytes: 2147483648
    memRequestBodyBytes: 33554432
---
# Transcription is not streamed: response headers arrive only when the whole
# recording is done, so the backend response timeout must cover a 2.5 h file.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: speech-long-requests
  namespace: traefik-system
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 3h
    idleConnTimeout: 90s

# Two SEPARATE GitHub Apps (plan 2026-10-31--life--update-security-lifecycle, phase 4):
#   console   merges, retries CI, manages webhooks, posts statuses; its token never leaves the
#             console pod.
#   session   what an upgrade-session pod gets. It can push branches and open PRs on frank. It
#             holds contents:write, so on its own it COULD push or merge to main. What stops
#             that is a GitHub ruleset on main (manual operation life-main-ruleset, phase 7,
#             NOT code in this repo): PR required, required check `cluster-update/approved`
#             whose only source is the console App, bypass limited to the operator and the
#             console App, no force-push or deletion. Until that ruleset exists the session
#             App must not be installed.
# Both tokens are scoped at mint time to derio-net/frank. ESO resolves privateKey.secretRef in
# the CONSUMING ExternalSecret's namespace, so BOTH PEM Secrets live in cluster-update-fr
# (applied out-of-band, phase 7). appID/installID are placeholders that make the generator fail
# loudly rather than mint a wrong token; phase 7 fills them.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: github-app-cluster-update-console
spec:
  kind: GithubAccessToken
  generator:
    githubAccessTokenSpec:
      appID: "PENDING-MANUAL-PHASE"
      installID: "PENDING-MANUAL-PHASE"
      repositories:
        - frank
      permissions:
        contents: write
        pull_requests: write
        statuses: write
        issues: write
        repository_hooks: write
        checks: read
        actions: write   # includes read; a key cannot be listed twice
        metadata: read
      auth:
        privateKey:
          secretRef:
            name: github-app-cluster-update-console-key
            key: key
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: github-app-cluster-update-session
spec:
  kind: GithubAccessToken
  generator:
    githubAccessTokenSpec:
      appID: "PENDING-MANUAL-PHASE"
      installID: "PENDING-MANUAL-PHASE"
      repositories:
        - frank
      permissions:
        contents: write
        pull_requests: write
        metadata: read
      auth:
        privateKey:
          secretRef:
            name: github-app-cluster-update-session-key
            key: key

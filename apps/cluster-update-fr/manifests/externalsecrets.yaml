# Every Secret the console reads is optional in the pod, so the app is healthy (and the console
# degrades to read-only, alarm-less) before the manual phase creates the Apps and the keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-update-fr-github
  namespace: cluster-update-fr
spec:
  refreshInterval: 20m
  target:
    name: cluster-update-fr-github
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        token: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: github-app-cluster-update-console
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-update-fr-session-github
  namespace: cluster-update-fr
spec:
  refreshInterval: 20m
  target:
    name: cluster-update-fr-session-github
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        token: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: github-app-cluster-update-session
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-update-fr-gitea
  namespace: cluster-update-fr
spec:
  # Read access to the Gitea mirror of frank, for CI diagnosis. The Infisical key is seeded by
  # the phase 7 manual operation; until then this ExternalSecret reports SecretSyncedError and
  # the pod (optional: true) runs without it.
  refreshInterval: 5m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cluster-update-fr-gitea
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: FRANK_UPDATER_GITEA_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-update-fr-telegram
  namespace: cluster-update-fr
spec:
  # The derio.net group's #security topic. Seeded by the phase 7 manual operation.
  refreshInterval: 5m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cluster-update-fr-telegram
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: bot-token
      remoteRef:
        key: FRANK_UPDATER_TELEGRAM_BOT_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: chat-id
      remoteRef:
        key: FRANK_UPDATER_TELEGRAM_CHAT_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: security-thread-id
      remoteRef:
        key: FRANK_UPDATER_TELEGRAM_SECURITY_THREAD_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

# Curated etcd dashboard — Layer 2, obs layer plan
# docs/superpowers/specs/2026-08-03--obs--etcd-scrape-control-plane-design.md
#
# THIS IS THE ONLY etcd DASHBOARD FRANK SHOULD HAVE. Until 2026-09 the chart
# victoria-metrics-k8s-stack also rendered an upstream board: a ConfigMap
# (victoria-metrics-victoria-metrics-k8s-stack-etcd) carrying a dashboard titled
# "etcd" with a chart-generated uid, labelled grafana_dashboard: "1" for the
# grafana-sc-dashboard sidecar. That board has no toggle of its own
# (defaultDashboards.dashboards exposes only victoriametrics-vmalert,
# victoriametrics-operator and node-exporter-full). It follows kubeEtcd.enabled,
# which is why #762 first shipped with two etcd dashboards.
#
# The etcd scrape has since moved off the chart's kubeEtcd block onto
# apps/victoria-metrics/manifests/vmstaticscrape-kube-etcd.yaml, because ArgoCD
# never applies the static Endpoints object that block renders (Endpoints is in
# resource.exclusions). kubeEtcd.enabled is now false, so the chart no longer
# renders the upstream board either. The victoria-metrics Application is
# prune: false, so its live ConfigMap had to be deleted by hand. If a board
# titled "etcd" ever reappears in Grafana, it is that orphan, not a second source.
#
# THIS board, title "Frank Layer 2 — etcd (curated)" and uid "frank-l2-etcd", is
# where the acceptance re-run's before/under-load evidence lives (the spec's
# Half 2c), and the one the gotchas and runbook entries reference. Do not delete
# it believing it to be the redundant copy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-etcd-dashboard
  namespace: monitoring
data:
  etcd-dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: etcd
        folder: etcd
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/etcd
  etcd-dashboard.json: |
    {
      "uid": "frank-l2-etcd",
      "title": "Frank Layer 2 — etcd (curated)",
      "tags": ["etcd", "layer-2", "obs"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "etcd quorum has-leader, per node",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
          "datasource": { "uid": "P4169E866C3094E38", "type": "prometheus" },
          "targets": [
            {
              "datasource": { "uid": "P4169E866C3094E38", "type": "prometheus" },
              "expr": "etcd_server_has_leader",
              "legendFormat": "{{instance}}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                { "type": "value", "options": { "0": { "text": "NO LEADER", "color": "red" }, "1": { "text": "leader ok", "color": "green" } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "etcd leader changes (1h window)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "datasource": { "uid": "P4169E866C3094E38", "type": "prometheus" },
          "targets": [
            {
              "datasource": { "uid": "P4169E866C3094E38", "type": "prometheus" },
              "expr": "increase(etcd_server_leader_changes_seen_total[1h])",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["last", "max"] }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "etcd WAL fsync p99",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "datasource": { "uid": "P4169E866C3094E38", "type": "prometheus" },
          "targets": [
            {
              "datasource": { "uid": "P4169E866C3094E38", "type": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by (le, instance) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])))",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.05 },
                  { "color": "red", "value": 0.1 }
                ]
              }
            }
          },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["last", "max"] }
          }
        },
        {
          "id": 4,
          "type": "gauge",
          "title": "etcd DB size vs backend quota",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "datasource": { "uid": "P4169E866C3094E38", "type": "prometheus" },
          "targets": [
            {
              "datasource": { "uid": "P4169E866C3094E38", "type": "prometheus" },
              "expr": "etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes",
              "legendFormat": "{{instance}}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.95 }
                ]
              }
            }
          },
          "options": {
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "etcd peer round-trip p99",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "datasource": { "uid": "P4169E866C3094E38", "type": "prometheus" },
          "targets": [
            {
              "datasource": { "uid": "P4169E866C3094E38", "type": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by (le, instance, To) (rate(etcd_network_peer_round_trip_time_seconds_bucket[5m])))",
              "legendFormat": "{{instance}} -> {{To}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              }
            }
          },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["last", "max"] }
          }
        }
      ]
    }

                    label_replace(
                      label_replace(
                        kube_deployment_status_replicas_unavailable{namespace=~"gpu-operator|intel-gpu-resource-driver"},
                        "workload", "$1", "deployment", "(.*)"),
                      "kind", "deployment", "", "")
                    or
                    label_replace(
                      label_replace(
                        kube_daemonset_status_number_unavailable{namespace=~"gpu-operator|intel-gpu-resource-driver"},
                        "workload", "$1", "daemonset", "(.*)"),
                      "kind", "daemonset", "", "")
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold

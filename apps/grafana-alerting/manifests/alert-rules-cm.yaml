              severity: warning
              github_issue: "frank-ops#5"
            annotations:
              summary: "L5 GPU: {{ $labels.namespace }}/{{ $labels.kind }}/{{ $labels.workload }} has {{ $values.B.Value | printf \"%.0f\" }} replica(s) unavailable"
              runbook: "kubectl -n {{ $labels.namespace }} rollout status {{ $labels.kind }}/{{ $labels.workload }}; kubectl -n {{ $labels.namespace }} describe {{ $labels.kind }}/{{ $labels.workload }}"

      # --- Layer 6 — GitOps / ArgoCD (frank-ops#6) ---
      # DEFERRED: original plan included an "app unhealthy" sub-rule using
      # argocd_app_info, but ArgoCD app metrics aren't scraped yet.
      # Follow-up: add argocd metrics ServiceMonitor/VMServiceScrape to
      # restore per-app health signal.
      #
      # Query rewrite 2026-08-02: per-pod kube_pod_status_ready -> per-workload
      # availability, the same move layer-25-cicd-down made in 2026-05 and for
      # the same reason. A terminal pod (Succeeded/Failed) can never become
      # Ready and Kubernetes does not GC it below --terminated-pod-gc-threshold
      # (default 12500), so kube-state-metrics exports its NotReady series
      # forever: the 2026-08-02 control-plane roll left 47 NodeShutdown
      # tombstones behind and produced 48 firing alerts against a completely
      # healthy cluster. A tombstone is not a replica, so counting unavailable
      # replicas simply cannot see them. Note the threshold INVERTS with the
      # metric: lt 1 on a readiness gauge becomes gt 0 on an unavailability
      # counter. label_replace folds `deployment`/`statefulset` into one
      # `workload` label plus a lowercase `kind`, so the summary can still name
      # what broke and the runbook is a paste-able kubectl path. ArgoCD's
      # application-controller is a StatefulSet, which has no _unavailable
      # counter — hence the replicas-minus-ready difference.
      - orgId: 1
        name: layer-6-gitops-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-6-gitops-down
            title: Layer 6 ArgoCD Pod Down
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: |
                    label_replace(
                      label_replace(
                        kube_deployment_status_replicas_unavailable{namespace="argocd"},
                        "workload", "$1", "deployment", "(.*)"),
                      "kind", "deployment", "", "")
                    or
                    label_replace(
                      label_replace(
                        kube_statefulset_status_replicas{namespace="argocd"} - kube_statefulset_status_replicas_ready{namespace="argocd"},
                        "workload", "$1", "statefulset", "(.*)"),
                      "kind", "statefulset", "", "")
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: critical
              github_issue: "frank-ops#6"
            annotations:
              summary: "L6 ArgoCD: {{ $labels.kind }}/{{ $labels.workload }} has {{ $values.B.Value | printf \"%.0f\" }} replica(s) unavailable — cluster GitOps impaired"
              runbook: "kubectl -n argocd rollout status {{ $labels.kind }}/{{ $labels.workload }}; kubectl -n argocd describe {{ $labels.kind }}/{{ $labels.workload }}"

      # --- Layer 9 — Backup & DR (frank-ops#9) ---
      # Per-cronjob: one alert per backup CronJob whose last successful run is
      # stale. DEFERRED: the original plan targeted longhorn_backup_* metrics
      # for per-volume backup age — those aren't scraped. Using kube_cronjob
      # last-success as a proxy for now.
      - orgId: 1
        name: layer-9-backup-stale
        folder: feature-health
        interval: 5m
        rules:
          - uid: layer-9-backup-stale
            title: Layer 9 Backup CronJob Stale
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  # Per-cronjob: fire if last success was more than the CronJob's
                  # expected cadence plus slack. daily-nas: >48h; weekly-r2: >10d.
                  expr: |
                    (time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system",cronjob="daily-nas"} > bool 172800)
                    or (time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system",cronjob="weekly-r2"} > bool 864000)
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 30m
            labels:
              severity: warning
              github_issue: "frank-ops#9"
            annotations:
              summary: "L9 Backup: {{ $labels.cronjob }} CronJob last-success exceeded cadence threshold"
              runbook: "kubectl -n longhorn-system get cronjob {{ $labels.cronjob }}; kubectl -n longhorn-system get jobs --sort-by=.status.startTime | tail -5"

      # --- Layer 10 — Secrets (frank-ops#10) ---
      # Per-workload: one alert per under-replicated Infisical or ESO workload.
      # Query rewrite 2026-08-02 (see layer-6 for the full rationale): per-pod
      # kube_pod_status_ready fires forever on terminal-pod tombstones, which a
      # replica count cannot see. Threshold inverts lt 1 -> gt 0. Infisical's
      # postgresql and redis-master are StatefulSets, which have no
      # _unavailable counter, so they are the replicas-minus-ready difference.
      - orgId: 1
        name: layer-10-secrets-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-10-secrets-down
            title: Layer 10 Secrets Degraded
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: |
                    label_replace(
                      label_replace(
                        kube_deployment_status_replicas_unavailable{namespace=~"infisical|external-secrets"},
                        "workload", "$1", "deployment", "(.*)"),
                      "kind", "deployment", "", "")
                    or
                    label_replace(
                      label_replace(
                        kube_statefulset_status_replicas{namespace=~"infisical|external-secrets"} - kube_statefulset_status_replicas_ready{namespace=~"infisical|external-secrets"},
                        "workload", "$1", "statefulset", "(.*)"),
                      "kind", "statefulset", "", "")
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: warning
              github_issue: "frank-ops#10"
            annotations:
              summary: "L10 Secrets: {{ $labels.namespace }}/{{ $labels.kind }}/{{ $labels.workload }} has {{ $values.B.Value | printf \"%.0f\" }} replica(s) unavailable"
              runbook: "kubectl -n {{ $labels.namespace }} rollout status {{ $labels.kind }}/{{ $labels.workload }}; kubectl -n {{ $labels.namespace }} describe {{ $labels.kind }}/{{ $labels.workload }}"

      # --- Layer 11 — Local Inference (frank-ops#11) ---
      # End-to-end: probe_success{layer="11"} comes from the blackbox litellm_chat
      # VMProbe — a REAL chat completion through LiteLLM. The old per-pod query
      # (kube_pod_status_ready) was blind to scale-to-0: when the gpu-switcher
      # hands gpu-1 to ComfyUI, Ollama has 0 pods => 0 series => the rule could
      # never fire while every local model returned 500. gpu_timeshare="true"
      # routes this to health-bridge ONLY (degraded tile, no Telegram) — one of
      # inference/media is always down by design; gpu-node-both-down is the pager.
      - orgId: 1
        name: layer-11-inference-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-11-inference-down
            title: Layer 11 Local Inference Degraded
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'probe_success{layer="11"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: lt, params: [1] }
            # Alerting (not OK): a vanished probe series means the probe is broken,
            # which is NOT healthy — the inverse of the old silent noDataState:OK.
            noDataState: Alerting
            execErrState: Error
            for: 5m
            labels:
              severity: warning
              gpu_timeshare: "true"
              github_issue: "frank-ops#11"
            annotations:
              summary: "L11 Inference: LiteLLM chat-completion probe failing (Ollama-backed models unreachable)"
              runbook: "Check which workload holds gpu-1; probe_success{layer=11} in VMUI; kubectl -n ollama get deploy ollama"

      # --- Layer 12 — Agentic Control Plane (frank-ops#12) ---
      # Restricted to the Sympozium control-plane workloads. Sympozium also
      # spawns developer-team-* Job pods that naturally end in NotReady
      # (Completed) state — those are NOT a Layer 12 health signal.
      # Query rewrite 2026-08-02 (see layer-6 for the full rationale): per-pod
      # kube_pod_status_ready fires forever on terminal-pod tombstones, of
      # which this namespace is the repo's most prolific producer. Job pods are
      # not owned by a Deployment, so they are now excluded by construction
      # rather than by the pod-name regex. Threshold inverts lt 1 -> gt 0.
      # Every workload here is a Deployment (`nats` included — it is not a
      # StatefulSet on Frank), so there is no StatefulSet clause.
      - orgId: 1
        name: layer-12-agents-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-12-agents-down
            title: Layer 12 Sympozium Down

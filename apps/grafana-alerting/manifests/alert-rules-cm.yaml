              - refId: C
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: lt, params: [604800] }
            noDataState: OK
            execErrState: Error
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: "TLS cert for {{ $labels.instance }} expires in <7 days ({{ humanizeDuration $value }} remaining)"
              runbook: "See docs/investigations/2026-05-11--omni--cert-expiry-incident.md for renewal procedure."

          # Watchdog for the expired-cert canary (issue #251): the canary's
          # perpetually-firing alert instances are the heartbeat for the two
          # rules above; this rule notices when the heartbeat metric itself
          # disappears (badssl unreachable, module broken, VMProbe deleted).
          # absent() returns EMPTY when the metric exists → noData is the
          # HEALTHY path here (inverted vs the rules above). severity=critical
          # + github_issue drive health-bridge's dead→bug-issue lifecycle
          # (auto-closed on heal); canary_watchdog="true" is caught by the
          # first-position notification-policy route so critical never reaches
          # Telegram. Spec:
          # docs/superpowers/specs/2026-06-07--obs--cert-expiry-canary-design.md
          - uid: tls-cert-canary-absent
            title: TLS cert-expiry canary absent
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'absent(probe_ssl_earliest_cert_expiry{canary="true"})'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 3h
            labels:
              severity: critical
              github_issue: "frank-ops#8"
              canary_watchdog: "true"
            annotations:
              summary: "Cert-expiry canary heartbeat lost: probe_ssl_earliest_cert_expiry{canary=\"true\"} absent >3h"
              runbook: "Check https://expired.badssl.com/ reachability, the blackbox-exporter http_2xx_insecure_tls module, and VMProbe expired-cert-canary. Spec: docs/superpowers/specs/2026-06-07--obs--cert-expiry-canary-design.md"

      # Dead-man's switch for the alert-agent Claude-credential expiry check. A
      # daily cron in the alert-agent `agent` container emits a
      # "cred-expiry-check days_left=... tier=..." heartbeat to stdout ->
      # supercronic -> fluent-bit -> VictoriaLogs. The "expiring soon" warning is
      # sent by that script directly (tg_send); THIS rule is the checker-died
      # backstop — if the heartbeat stops (cron broke / pod down / container
      # wedged) it fires. `stats count() as value` without `by()` returns a single
      # 0-row when nothing matches -> threshold lt 1 fires; a VictoriaLogs outage
      # yields noData -> OK (blindness != death). NOTE: Frank's VictoriaLogs message
      # field is `_msg` (the Hop crowdsec rule uses `log:` because Hop's fluent-bit
      # maps differently — verified live: `_msg:"..."` matches, `log:"..."` -> 0).
      # telegram_direct pages Telegram DIRECTLY (bypassing the LLM agent — the
      # warner is down, so it can't be trusted to triage its own outage), via the
      # top-of-policy route (notification-policy-cm.yaml:57-60, folder-independent).
      # Spec: docs/superpowers/specs/2026-07-22--obs--cred-expiry-alert-design.md
      - orgId: 1
        name: alert-agent-cred-expiry
        folder: feature-health
        interval: 1h
        rules:
          - uid: alert-agent-cred-expiry-heartbeat-stale
            title: alert-agent credential-expiry heartbeat stale
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 108000, to: 0 }
                datasourceUid: affdoo4s9258gc
                model:
                  refId: A
                  queryType: stats
                  expr: 'kubernetes.namespace_name:alert-agent AND _msg:"cred-expiry-check" | stats count() as value'
              - refId: B
                relativeTimeRange: { from: 108000, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 108000, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: lt, params: [1] }
            noDataState: OK
            execErrState: Error
            for: 2h
            labels:
              severity: critical
              telegram_direct: "true"
            annotations:
              summary: "alert-agent credential-expiry check heartbeat stale: no cred-expiry-check line in namespace alert-agent for 30h. The daily check is dead (cron broke / pod down) so the Claude token could expire unnoticed — the exact 3-day silent outage this alert exists to prevent."
              runbook: "Check the alert-agent pod + its supercronic cron: kubectl -n alert-agent get pods; kubectl -n alert-agent exec deploy/alert-agent -c agent -- /opt/alert-agent-bin/cred-expiry-check (should print a cred-expiry-check heartbeat). Spec: docs/superpowers/specs/2026-07-22--obs--cred-expiry-alert-design.md"

      # Headscale API keys expire silently: Headplane stays Running and logs no
      # authentication error. An hourly Hop CronJob checks both expected consumer
      # keys through the real API and emits one structured heartbeat. The first
      # rule pages for expiry within 30 days, a missing key, or an API failure;
      # the second pages if the checker itself stops. Hop logs use `log`, not
      # Frank's `_msg` field.
      - orgId: 1
        name: headscale-api-key-expiry
        folder: feature-health
        interval: 1h
        rules:
          - uid: headscale-api-key-expiry-warning
            title: Headscale API key expiry warning
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 7200, to: 0 }
                datasourceUid: affdoo4s9258gc
                model:
                  refId: A
                  queryType: stats
                  expr: 'kubernetes.namespace_name:headscale-system AND log:"headscale-api-key-expiry-check" AND log:"alert=true" | stats count() as value'
              - refId: B
                relativeTimeRange: { from: 7200, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 7200, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 0s
            labels:
              severity: critical
              telegram_direct: "true"
            annotations:
              summary: "Headscale API-key expiry checker reports an expiring, missing, or unreadable consumer key. Headplane can remain Running and ArgoCD green while login is broken."
              runbook: "On Hop, inspect the latest headscale-api-key-expiry Job logs and list keys: kubectl -n headscale-system logs job/<latest-job>; kubectl -n headscale-system exec deploy/headscale -- headscale apikeys list. Rotate per edge-hop-headscale-api-key-rotation."

          - uid: headscale-api-key-expiry-heartbeat-stale
            title: Headscale API key expiry heartbeat stale
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 10800, to: 0 }
                datasourceUid: affdoo4s9258gc
                model:
                  refId: A
                  queryType: stats
                  expr: 'kubernetes.namespace_name:headscale-system AND log:"headscale-api-key-expiry-check" | stats count() as value'
              - refId: B
                relativeTimeRange: { from: 10800, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 10800, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: lt, params: [1] }
            noDataState: OK
            execErrState: Error
            for: 1h
            labels:
              severity: critical
              telegram_direct: "true"
            annotations:
              summary: "Headscale API-key expiry heartbeat stale: no checker result from Hop in 3h, so silent credential expiry is unmonitored."
              runbook: "On Hop, check kubectl -n headscale-system get cronjob,jobs,pods -l app.kubernetes.io/name=headscale-api-key-expiry and inspect the latest Job logs."

      # =====================================================================
      # blog-edge folder rules (obs layer phase 3+5) — fired alerts route to
      # the AI Helper Webhook (added in phase 5). For now they route through
      # the default Telegram contact point.
      # =====================================================================

      - orgId: 1
        name: blog-edge-security
        folder: blog-edge
        interval: 1m
        rules:
          # queryType: stats hits /select/logsql/stats_query which returns
          # a Prometheus-style instant vector (wide series). Without it the
          # default queryType uses /select/logsql/query which returns a
          # *long* series of log lines, and Grafana's SSE reduce step
          # rejects it with "input data must be a wide series but got
          # type long".
          - uid: crowdsec-decision-burst
            title: CrowdSec decision burst
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: affdoo4s9258gc
                model:
                  refId: A
                  queryType: stats
                  expr: 'kubernetes.namespace_name:crowdsec-system AND log:Adding AND log:decisions | stats count() as value'
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [10] }
            noDataState: OK
            execErrState: Error
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: ">10 CrowdSec ban decisions in last 5m"
              runbook: "blog-edge-security dashboard — investigate by source IP."

          - uid: falco-critical-event
            title: Falco critical event
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: affdoo4s9258gc
                model:
                  refId: A
                  queryType: stats
                  expr: 'priority:Critical | stats count() as value'
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 0s
            labels:
              severity: critical
            annotations:
              summary: "Falco fired a critical-severity event"
              runbook: "blog-edge-security dashboard — inspect rule + container."

          # Dead-man's switch for the CrowdSec ban-pipeline canary. The in-cluster Hop
          # CronJob emits a "crowdsec-ban-canary verdict=..." heartbeat to stdout every
          # run (*/5) -> fluent-bit -> VictoriaLogs. If the heartbeat goes stale (canary
          # crashed / suspended / image broken) NOTHING watches the ban pipeline, so this
          # fires. `stats count() as value` WITHOUT a `by()` returns a guaranteed single
          # 0-row when no heartbeat matches -> threshold lt 1 fires; a VictoriaLogs outage
          # yields noData -> OK (blindness != death). Mirrors the cert-expiry watchdog
          # (#251) but pages Telegram (NO canary_watchdog label — silence is the enemy
          # here). Spec: docs/superpowers/specs/2026-06-21--obs--crowdsec-ban-pipeline-canary-design.md
          - uid: crowdsec-canary-heartbeat-stale
            title: CrowdSec ban-pipeline canary heartbeat stale
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 1200, to: 0 }
                datasourceUid: affdoo4s9258gc
                model:
                  refId: A
                  queryType: stats
                  expr: 'kubernetes.namespace_name:crowdsec-system AND log:"crowdsec-ban-canary verdict" | stats count() as value'
              - refId: B
                relativeTimeRange: { from: 1200, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 1200, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: lt, params: [1] }
            noDataState: OK
            execErrState: Error
            for: 1m
            labels:
              severity: critical
              # This rule lives in the blog-edge folder, whose notification policy
              # routes EXCLUSIVELY to the AI Helper Webhook (continue:false). A
              # dead-man's switch must NOT be mediated by the LLM agent (it can give
              # stale/wrong triage — proven 2026-06-21: it reported the resolved #594
              # incident as current). This label hits a dedicated top-of-policy route
              # that pages Telegram DIRECTLY, bypassing the agent.
              telegram_direct: "true"
            annotations:
              summary: "CrowdSec ban-pipeline canary heartbeat stale: no verdict line in crowdsec-system for 20m. The canary is dead/suspended and the Hop ban pipeline is unwatched."
              runbook: "Check the canary CronJob on Hop: kubectl -n crowdsec-system get cronjob,jobs,pods -l app=crowdsec-ban-canary; unsuspend if suspended; inspect the last Job pod logs. Spec: docs/superpowers/specs/2026-06-21--obs--crowdsec-ban-pipeline-canary-design.md"

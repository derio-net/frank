apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-rules
  namespace: monitoring
data:
  alert-rules.yaml: |
    apiVersion: 1
    groups:
      # =====================================================================
      # FEATURE-LEVEL ALERTS (bugs in specific willikins crons / endpoints)
      # Labels: severity + github_issue=willikins#<N>
      # These fire independently of the Layer trackers below; the Layer
      # rules aggregate them into a single "is this Layer up" signal.
      # =====================================================================

      # --- Heartbeat-stale: exercise reminder (eval every 5m) ---
      - orgId: 1
        name: heartbeat-stale-5m
        folder: feature-health
        interval: 5m
        rules:
          - uid: exercise-reminder-stale
            title: Exercise Reminder Stale
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'time() - willikins_heartbeat_last_success_timestamp{job="exercise_reminder"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 10800
            noDataState: OK
            execErrState: Error
            for: 1m
            labels:
              severity: critical
              github_issue: "willikins#11"
            annotations:
              summary: Exercise reminder cron heartbeat is stale (>3h since last success)

      # --- Heartbeat-stale: session manager (eval every 1m) ---
      - orgId: 1
        name: heartbeat-stale-1m
        folder: feature-health
        interval: 1m
        rules:
          - uid: session-manager-stale
            title: Session Manager Stale
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'time() - willikins_heartbeat_last_success_timestamp{job="session_manager"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 600
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: critical
              github_issue: "willikins#13"
            annotations:
              summary: Session manager cron heartbeat is stale (>10m since last success)

      # --- Heartbeat-stale: audit digest (eval every 30m) ---
      - orgId: 1
        name: heartbeat-stale-30m
        folder: feature-health
        interval: 30m
        rules:
          - uid: audit-digest-stale
            title: Audit Digest Stale
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'time() - willikins_heartbeat_last_success_timestamp{job="audit_digest"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 93600
            noDataState: OK
            execErrState: Error
            for: 1h
            labels:
              severity: warning
              github_issue: "willikins#12"
            annotations:
              summary: Audit digest cron heartbeat is stale (>26h since last success)

      # --- Heartbeat-stale: VK Issue Bridge (eval every 2m) ---
      - orgId: 1
        name: heartbeat-stale-2m
        folder: feature-health
        interval: 2m
        rules:
          - uid: vk-bridge-stale
            title: VK Issue Bridge Stale
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'time() - willikins_heartbeat_last_success_timestamp{job="vk_issue_bridge"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 600
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: VK Issue Bridge has not pushed a heartbeat in over 10 minutes — supercronic may be down or the bridge is failing

      # --- VK Issue Bridge failures (eval every 5m) ---
      - orgId: 1
        name: vk-bridge-failures
        folder: feature-health
        interval: 5m
        rules:
          - uid: vk-bridge-failures
            title: VK Issue Bridge Failures
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  # Preserve `reason` and `issue` labels through the aggregation
                  # so the annotation template can name the specific failure.
                  expr: 'sum by (reason, issue) (increase(willikins_vk_bridge_failure_total[15m]))'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "VK Issue Bridge: {{ $values.B.Value | printf \"%.0f\" }} failure(s) reason={{ $labels.reason }} issue=#{{ $labels.issue }} in last 15m"
              description: "Check /home/claude/.willikins-agent/vk-bridge.log for the failing payload"

      # --- Endpoint-down (eval every 1m) ---
      - orgId: 1
        name: endpoint-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: endpoint-down
            title: Endpoint Down
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'probe_success{probe_group="feature_health"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params:
                          - 1
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Endpoint probe failing: {{ $labels.instance }}"

      # --- Pod-not-running (eval every 1m) ---
      - orgId: 1
        name: pod-not-running
        folder: feature-health
        interval: 1m
        rules:
          - uid: agent-pod-not-running
            title: Agent Pod Not Running
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'kube_pod_status_phase{namespace="secure-agent-pod", phase="Running"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params:
                          - 1
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: critical
              github_issue: "frank-ops#18"
            annotations:
              summary: "Secure agent pod {{ $labels.pod }} not in Running phase"

      # --- VK executor pool wedged (eval every 5m) ---
      # Detects the leaked-permit wedge (2026-07-24 incident, frank#692): a
      # 30s-timeout MCP client abandons a spawn, vk-local's Child::wait() is
      # cancelled, the child dies unreaped, and its concurrency permit is never
      # released. Leaks accumulate to VK_MAX_CONCURRENT_EXECUTIONS and every
      # later dispatch queues forever — pod 2/2 Running, ArgoCD green, agents
      # silently hang. Signature: active pinned at max with a non-draining
      # queue. `for: 1h` clears the worst legitimate case (a mass dispatch of
      # long coding runs saturating 8 slots drains its queue well inside an
      # hour); a wedge holds the state indefinitely. The bool-product expr
      # always returns 0/1 while the scrape is alive, so NoData really means
      # "scrape dead" → noDataState: Alerting surfaces it as DatasourceNoData,
      # which health-bridge caps at degraded (blindness ≠ death). Routed via
      # health_bridge_only="true": severity=critical drives the dead→bug-issue
      # lifecycle but never pages Telegram. Root-cause fix: super-fr#404.
      # Recovery + full prose: docs/runbooks/frank-gotchas/agent-shells.md.
      - orgId: 1
        name: vk-executor-pool
        folder: feature-health
        interval: 5m
        rules:
          - uid: vk-executor-pool-wedged
            title: VK Executor Pool Wedged
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: '(vibekanban_active_executions >= bool vibekanban_max_executions) * (vibekanban_queued_executions >= bool 1)'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0.5] }
            noDataState: Alerting
            execErrState: Error
            for: 1h
            labels:
              severity: critical
              health_bridge_only: "true"
              github_issue: "frank-ops#18"
            annotations:
              summary: "VK executor pool wedged: active executions pinned at the cap with a non-draining queue for 1h - leaked permits from dead executors likely hold every slot; newly dispatched agents hang silently"
              runbook: "Recovery: kubectl -n secure-agent-pod exec deploy/secure-agent-pod -c vk-local -- kill -TERM 1 (restart runs orphan-cleanup, frees permits). Check vibekanban_active/queued/max_executions in VMUI and defunct sh children in the container. Full prose: docs/runbooks/frank-gotchas/agent-shells.md"

      # =====================================================================
      # LAYER TRACKERS (Derio Ops board, derio-net/frank-ops — private)
      # Labels: severity + github_issue=frank-ops#<LAYER>
      # One rule per Layer. Use aggregation to keep the signal single.
      # Added in Pass 3 — see docs/superpowers/specs/2026-04-16--platform--derio-ops-layers-restoration-design.md
      # =====================================================================

      # --- Layer 8 — Observability (frank-ops#8) ---
      # Per-instance: one alert per under-replicated monitoring workload, plus
      # one if the health-bridge self-probe fails. Uses label_replace to inject
      # a `component` label that normalises across both signals for templating.
      #
      # Query rewrite 2026-08-02: per-pod kube_pod_status_ready -> per-workload
      # availability, finishing the migration the other eleven layer trackers
      # went through. This rule was the least-broken of the twelve — it already
      # filtered tombstones inside the query with an
      # `unless on(namespace,pod) kube_pod_status_phase{phase=~"Succeeded|Failed"}`
      # join, which is why it did NOT fire during the 2026-08-02 flood. It is
      # migrated anyway: a second pattern for the same question in one folder is
      # how the next person gets confused, and the join doubles the series
      # joined on every evaluation. The join is DELETED rather than ported —
      # an unavailable-replica count contains no terminal pods to subtract.
      #
      # DaemonSets are EXCLUDED, deliberately. `monitoring` runs two —
      # fluent-bit and victoria-metrics-prometheus-node-exporter — and both are
      # node-level collectors whose unavailability during a node drain is
      # exactly the noise this change removes.
      #
      # Be precise about what that costs, because the design spec was not: it
      # claimed "their real coverage is the Layer 1/2 node alerts", and that is
      # not accurate. layer-1-hardware-down and layer-2-os-down both key on
      # kube_node_status_condition{condition="Ready",status="false"}, so they
      # see a dead NODE and are blind to a collector failing on a healthy one.
      # What indirectly touches them is partial, not equivalent: node-exporter
      # feeds layer-1-node-memory-headroom and layer-1-nic-link-flap, and
      # fluent-bit carries the crowdsec-canary and alert-agent cred-expiry
      # heartbeats into VictoriaLogs where dead-man rules watch them — both
      # fleet-wide-only and late.
      #
      # That gap is CLOSED by layer-8-observability-collectors-down, defined
      # immediately below, which watches
      # kube_daemonset_status_number_unavailable{namespace="monitoring"} at
      # warning/15m. The exclusion here is therefore a routing decision between
      # two rules, not a hole: the collectors get the drain-tolerant window they
      # need without dragging THIS rule — the alerting stack's own critical
      # signal — from 5m to 15m.
      #
      # The observability control plane proper is Deployments
      # (grafana, vmagent, vmsingle, kube-state-metrics, health-bridge,
      # blackbox-exporter, pushgateway, the VM operator) plus one StatefulSet
      # (victoria-logs). StatefulSets have no _unavailable counter, hence the
      # replicas-minus-ready difference.
      #
      # for: 5m — this rule does NOT follow the 15m DaemonSet policy its
      # layer-3/4/5 siblings adopted, because excluding the DaemonSets already
      # removes the drain noise that motivated the longer window. It is
      # severity: critical and covers the alerting stack every other rule in
      # this folder depends on, so blunting detection to 15m would be a real
      # loss for no gain.
      #
      # The probe_success clause keeps its instance selector verbatim but its
      # POLARITY IS INVERTED with `== bool 0`. probe_success is 1 on success,
      # and the old rule read it under `lt 1`. The threshold is now `gt 0`
      # (the workload branches count UNAVAILABLE replicas), so a verbatim
      # probe_success would fire continuously while health-bridge is healthy
      # and fall silent the moment it dies — backwards, on the sharpest signal
      # in the folder. `== bool 0` maps success->0 / failure->1, matching the
      # replica counts it is OR'd with.
      - orgId: 1
        name: layer-8-observability-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-8-observability-down
            title: Layer 8 Observability Degraded
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  # Unavailable-replica counts per workload, plus the inverted
                  # health-bridge self-probe, all normalised onto one
                  # `component` label (`<kind>/<name>`, or
                  # `probe/health-bridge-healthz`) so a single summary template
                  # reads naturally across three unlike branches. Threshold
                  # `gt 0` fires per-series on any non-zero value.
                  expr: |
                    label_replace(
                      kube_deployment_status_replicas_unavailable{namespace="monitoring"},
                      "component", "deployment/$1", "deployment", "(.+)"
                    )
                    or
                    label_replace(
                      kube_statefulset_status_replicas{namespace="monitoring"} - kube_statefulset_status_replicas_ready{namespace="monitoring"},
                      "component", "statefulset/$1", "statefulset", "(.+)"
                    )
                    or
                    label_replace(
                      probe_success{instance="http://health-bridge.monitoring.svc.cluster.local:8080/healthz"} == bool 0,
                      "component", "probe/health-bridge-healthz", "", ""
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: critical
              github_issue: "frank-ops#8"
            annotations:
              # No {{ $labels.component }} in the runbook on purpose: for the
              # probe branch it renders `probe/health-bridge-healthz`, which is
              # not a kubectl resource path. The summary names the failing
              # component; the runbook stays valid for all three branches.
              summary: "L8 Observability: {{ $labels.component }} failing"
              runbook: "kubectl -n monitoring get deploy,statefulset; kubectl -n monitoring logs deploy/health-bridge --tail=50; kubectl -n monitoring get probe feature-health-probes -o yaml"

      # --- Layer 8 — Observability collectors (frank-ops#8) ---
      # Restores coverage that the 2026-08-02 workload-metrics migration
      # removed. The pre-migration layer-8 query matched EVERY pod in
      # `monitoring`, which included the pods of both DaemonSets there:
      # fluent-bit and victoria-metrics-prometheus-node-exporter. Migrating
      # layer-8 to Deployments + StatefulSets dropped them.
      #
      # The design spec justified that drop by claiming their "real coverage is
      # the Layer 1/2 node alerts". It is not: layer-1-hardware-down and
      # layer-2-os-down both key on
      # kube_node_status_condition{condition="Ready",status="false"}, so they
      # fire on a dead NODE and are blind to a collector crashlooping on a
      # healthy one. Grepping this whole file for `fluent-bit` and
      # `node-exporter` turns up only comments and `job=` selectors — before
      # this rule, nothing anywhere watched either DaemonSet's health.
      #
      # SEPARATE rule rather than folded back into layer-8, deliberately. The
      # folder policy (guarded in scripts/tests/test_feature_health_workload_
      # metrics.py) is that any rule querying a DaemonSet metric waits 15m for
      # a node drain. Folding these two back into layer-8 would therefore drag
      # that rule from 5m to 15m and slow detection of the ALERTING STACK's own
      # failure — trading a critical-path regression for the fix to a
      # warning-level one.
      #
      # severity: warning, not critical. Losing fluent-bit stops log shipping
      # and losing node-exporter stops node metrics, both real degradations,
      # but vmagent / vmsingle / grafana are Deployments still covered at
      # critical/5m by layer-8 proper, so the alerting stack is not blind.
      #
      # Scoped to the namespace with no name selector, unlike the layer
      # trackers: every DaemonSet in `monitoring` is a collector, so a third one
      # added later is covered without anyone remembering to extend a regex.
      - orgId: 1
        name: layer-8-observability-collectors-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-8-observability-collectors-down
            title: Layer 8 Observability Collectors Degraded
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: |
                    label_replace(
                      label_replace(
                        kube_daemonset_status_number_unavailable{namespace="monitoring"},
                        "workload", "$1", "daemonset", "(.*)"),
                      "kind", "daemonset", "", "")
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 15m
            labels:
              severity: warning
              github_issue: "frank-ops#8"
            annotations:
              summary: "L8 Observability collector: {{ $labels.kind }}/{{ $labels.workload }} has {{ $values.B.Value | printf \"%.0f\" }} replica(s) unavailable"
              runbook: "kubectl -n monitoring get daemonset; kubectl -n monitoring rollout status {{ $labels.kind }}/{{ $labels.workload }}; kubectl -n monitoring describe {{ $labels.kind }}/{{ $labels.workload }}"

      # --- Unexpected scale-to-0 (frank-ops#8) ---
      # The inverse question to every other rule in this folder. They all count
      # UNAVAILABLE replicas, and a Deployment scaled to 0 has none by
      # definition — so a service someone scaled down by accident, or that a
      # controller parked and never restored, reads as perfectly healthy
      # everywhere else. This is the only rule that watches what a Deployment
      # ASKS for rather than what it has.
      #
      # One rule, not twelve: the condition is workload-shaped, not
      # layer-shaped. github_issue frank-ops#8 because it is observability's
      # own rule (layer 8 is `obs` per docs/layers.yaml).
      #
      # EXCLUSIONS. Two Deployments sit at 0 replicas on Frank BY DESIGN and
      # both are healthy, so a naive `spec_replicas == 0` pages on day one.
      # Each exclusion traces to a declarative source in this repo, and
      # scripts/tests/test_feature_health_workload_metrics.py DERIVES the
      # expected set from those sources rather than restating it — so adding a
      # third timeshared workload, or flipping a second Rollout to
      # `scaleDown: onsuccess`, fails CI instead of paging at 03:00:
      #
      #   namespace!~"ollama|comfyui"
      #     gpu-switcher's WORKLOADS env var
      #     (apps/gpu-switcher/manifests/deployment.yaml), which parks whichever
      #     GPU workload is not currently holding gpu-1. NOT clusterrole.yaml —
      #     a ClusterRole carries no namespace information at all, despite its
      #     leading comment; an earlier draft of the design spec read the set
      #     from there and got it wrong.
      #
      #   deployment!~"litellm"
      #     apps/litellm/manifests/rollout.yaml has
      #     `workloadRef.scaleDown: onsuccess`, so Argo Rollouts scales the
      #     Deployment to 0 the moment the Rollout goes Healthy and serves
      #     traffic from its own ReplicaSet. Measured live: Deployment 0
      #     replicas, Rollout 5/5 ready. Excluded by DEPLOYMENT NAME rather than
      #     namespace on purpose, so an unrelated Deployment scaled to 0 in the
      #     litellm namespace is still caught.
      #     (sympozium-apiserver's Rollout leaves scaleDown at the default
      #     `never`, so its Deployment stays up and needs no exclusion — the
      #     comment at the top of that file claiming otherwise is stale.)
      #
      # Coverage is not lost for the excluded three: ollama/comfyui are probed
      # end-to-end by the L11 litellm_chat and L16 comfyui_object_info blackbox
      # probes with gpu-node-both-down as the real pager, and litellm's actual
      # health is the Rollout's, which layer-11-inference-down probes.
      #
      # THRESHOLD IS `lt 1`, NOT `gt 0`, and that is not an oversight. In PromQL
      # `metric == 0` is a FILTER, not a comparison — it returns the matching
      # series carrying their ORIGINAL value, which here is always 0. The `gt 0`
      # convention the rest of this folder uses (correct there: those metrics
      # COUNT unavailable replicas) would make this rule structurally incapable
      # of firing while looking entirely conventional. The presence of a series
      # IS the alert condition; noDataState: OK keeps the healthy case (no
      # series at all) quiet. Guarded, with the `== 0`/`lt 1` pairing asserted
      # together so neither half can be "tidied" alone.
      #
      # for: 15m — a Recreate-strategy Deployment passes through 0 replicas on
      # every ordinary rollout (kubernetes tears the old pod down before
      # creating the new one), and several Frank apps are on Recreate precisely
      # because their PVC is RWO. A short window would page on routine deploys
      # of exactly the apps most likely to be deployed by hand. This is the one
      # rule in the folder at 15m WITHOUT querying a DaemonSet metric; it holds
      # a written exemption in FIFTEEN_MINUTE_EXEMPTIONS rather than a silent
      # pass.
      #
      # Deployments only. StatefulSets and DaemonSets are not scaled to 0 as an
      # operational pattern on Frank, and including them would mean chasing
      # every vCluster's lifecycle.
      - orgId: 1
        name: workload-unexpectedly-scaled-to-zero
        folder: feature-health
        interval: 1m
        rules:
          - uid: workload-unexpectedly-scaled-to-zero
            title: Workload Unexpectedly Scaled To Zero
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: |
                    kube_deployment_spec_replicas{namespace!~"ollama|comfyui",deployment!~"litellm"} == 0
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: lt, params: [1] }
            noDataState: OK
            execErrState: Error
            for: 15m
            labels:
              severity: warning
              github_issue: "frank-ops#8"
              # Health Bridge ONLY — deliberately not a Telegram pager.
              #
              # Without this label a severity=warning alert matches the
              # `severity=warning -> Telegram (continue:true)` route in
              # notification-policy-cm.yaml, which sits ABOVE the
              # feature-health -> Health Bridge route. This rule watches all ~73
              # non-excluded Deployments cluster-wide, and two procedures this
              # repo documents park a Deployment at 0 for far longer than 15m:
              # the Longhorn instance-manager retirement in
              # storage-secrets-ssa.md ("scale workloads to 0 and wait for
              # natural detach") and the durable scale-to-0 recipe in
              # frank-argocd.md. Both are correct operator actions, and neither
              # should buzz a phone at 03:00.
              #
              # "Someone left a Deployment at 0" is a dashboard fact, not a
              # page. health_bridge_only is the documented escape hatch for
              # exactly that (its route precedes the severity routes, same
              # mechanism gpu_timeshare uses for the by-design GPU switch).
              health_bridge_only: "true"
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.deployment }} is scaled to 0 replicas and is not a known scale-to-0 workload"
              runbook: "kubectl -n {{ $labels.namespace }} get deploy {{ $labels.deployment }} -o yaml; check for an Argo Rollout owning it: kubectl -n {{ $labels.namespace }} get rollouts.argoproj.io. If this is a deliberate scale-down (Longhorn IM retirement, ArgoCD scale-to-0), it is expected and will resolve when replicas return."

      # --- Layer 18 — Persistent Agent (frank-ops#18) ---
      # Per-job heartbeat check — fires ONE alert instance per stale cron, all
      # labelled github_issue=frank-ops#18 so they roll up to the Layer tracker.
      # Bridge lastState-dedup ensures only one Lifecycle transition per fire-bundle;
      # the first instance's annotation (with specific job name) lands in the comment.
      # Pod-level critical failures are covered by agent-pod-not-running
      # (labels.github_issue=frank-ops#18, severity=critical) — leave that rule intact.
      - orgId: 1
        name: layer-18-persistent-agent-degraded
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-18-persistent-agent-degraded
            title: Layer 18 Persistent Agent Heartbeat Stale
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  # Each clause returns a 0/1 series WITH the source metric's labels
                  # (notably `job`). `or` stacks them into a multi-dimensional
                  # series — one element per currently-stale job.
                  expr: |
                    (time() - willikins_heartbeat_last_success_timestamp{job="exercise_reminder"} > bool 10800)
                    or (time() - willikins_heartbeat_last_success_timestamp{job="session_manager"} > bool 600)
                    or (time() - willikins_heartbeat_last_success_timestamp{job="audit_digest"} > bool 93600)
                    or (time() - willikins_heartbeat_last_success_timestamp{job="vk_issue_bridge"} > bool 600)
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  expression: A
                  reducer: last
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: warning
              github_issue: "frank-ops#18"
            annotations:
              summary: "Layer 18 (Persistent Agent) — {{ $labels.job }} cron heartbeat stale. See willikins#11/#12/#13 for per-cron triage."
              runbook: "kubectl logs -n secure-agent-pod -l app=secure-agent-pod --tail=50 | grep -i {{ $labels.job }}"

      # --- Layer 1 — Hardware & Nodes (frank-ops#1) ---
      # Per-node: one alert instance per NotReady node.
      - orgId: 1
        name: layer-1-hardware-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-1-hardware-down
            title: Layer 1 Hardware Node NotReady
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  # status="false" series are 1 when node is NotReady, 0 otherwise.
                  expr: 'kube_node_status_condition{condition="Ready",status="false"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 5m
            labels:
              severity: warning
              github_issue: "frank-ops#1"
            annotations:
              summary: "L1 Hardware: node {{ $labels.node }} NotReady"
              runbook: "kubectl describe node {{ $labels.node }}; talosctl -n {{ $labels.node }} health"

      # --- Layer 1 — Node memory headroom (frank-ops#1) ---
      # Absolute floor, NOT a ratio: 6% of 64GB (mini) is ~4GB and healthy,
      # while 9% of 4GB (Pi) is ~355MB and one slow leak away from a
      # reclaim-thrash wedge (anonymous heap exhaustion, kubelet unresponsive,
      # no OOM kill — 2026-06-04 raspi-1 incident, Longhorn IM leak
      # longhorn#12575). 1GiB catches the wedge days-to-weeks early.
      - orgId: 1
        name: layer-1-node-memory-headroom
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-1-node-memory-headroom
            title: Layer 1 Hardware Node Memory Headroom Low
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  # MemAvailable in bytes, per node-exporter instance.
                  expr: 'node_memory_MemAvailable_bytes{job="node-exporter"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: lt, params: [1073741824] }
            noDataState: OK
            execErrState: Error
            for: 30m
            labels:
              severity: warning
              github_issue: "frank-ops#1"
            annotations:
              summary: "L1 Hardware: node {{ $labels.instance }} has <1GiB memory available for 30m — reclaim-thrash wedge risk (see 2026-06-04 raspi-1 incident)"
              runbook: "talosctl -n <node-ip> memory; check Longhorn instance-manager working set: container_memory_working_set_bytes{pod=~\"instance-manager.*\"}; docs/investigations/2026-06-04--stor--raspi-1-memory-wedge-incident.md"

      # --- Layer 1 — NIC link flap (frank-ops#1) ---
      # Carrier-change RATE, not a down-state: a flapping NIC is up-on-average
      # and never sustains a `for: 5m` down window, so the NotReady / Cilium-Down
      # rules miss it by construction (2026-06-08 gpu-1 enp3s0 incident — 76
      # carrier changes, 0 alerts, ~8h blind). Counter is reset-safe: a reboot
      # zeroes it (node-exporter restart) and increase() accounts for the reset,
      # so reboots (~1 change) and cable replugs (<=2) stay under the >6/30m
      # threshold. See docs/runbooks/frank-gotchas/networking.md.
      - orgId: 1
        name: layer-1-nic-link-flap
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-1-nic-link-flap
            title: Layer 1 Hardware NIC Link Flapping
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  # carrier-change counter increase over 30m, physical NICs only
                  # (en*/eth*); excludes cilium_*, lxc*, veth*, lo.
                  expr: 'increase(node_network_carrier_changes_total{device=~"en.*|eth.*"}[30m])'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [6] }
            noDataState: OK
            execErrState: Error
            for: 0m
            labels:
              severity: warning
              github_issue: "frank-ops#1"
            annotations:
              # NOTE: no < > & in annotations — Grafana's Telegram contact point
              # sends HTML parse_mode, so '<node-ip>' / bare '>' render as invalid
              # HTML tags and Telegram rejects the message with 400 Bad Request
              # (silent non-delivery; logged as ngalert.notifier error). 2026-06-08.
              summary: "L1 Hardware: NIC {{ $labels.device }} on {{ $labels.instance }} link-flapping (6+ carrier changes/30m) — Cilium datapath risk (2026-06-08 enp3s0 incident)"
              runbook: "talosctl -n NODE_IP dmesg | grep 'Link is'; reseat cable / switch-end port; durable fix pcie_aspm=off — docs/runbooks/frank-gotchas/networking.md"

      # --- Layer 2 — OS & Bootstrap (frank-ops#2) ---
      # Per control-plane node only — HA lost = critical.
      - orgId: 1
        name: layer-2-os-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-2-os-down
            title: Layer 2 OS Control-Plane NotReady
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: |
                    kube_node_status_condition{condition="Ready",status="false"}
                    * on(node) group_left kube_node_role{role="control-plane"}
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 2m
            labels:
              severity: critical
              github_issue: "frank-ops#2"
            annotations:
              summary: "L2 OS: control-plane node {{ $labels.node }} NotReady — HA at risk"
              runbook: "talosctl -n {{ $labels.node }} health; talosctl -n {{ $labels.node }} dmesg | tail -50"

      # --- Layer 2 — etcd, the control plane's own quorum (frank-ops#2) ---
      # Frank did not scrape its own etcd for 148 days. kubeEtcd.enabled is true
      # by chart default and was never disabled, so a headless Service, a
      # VMServiceScrape and an Endpoints object have existed since the cluster
      # was built — the Endpoints object EMPTY the entire time, because the
      # chart's Service selects pods labelled component=etcd (the kubeadm
      # layout) and Talos runs etcd as a host system service. Zero endpoints,
      # zero targets, zero series, and no error anywhere. An etcd problem was
      # invisible until it became an apiserver problem.
      #
      # apps/victoria-metrics/values.yaml now pins a STATIC Endpoints object at
      # the three minis on 2381, and patches/phase08-obs/omni-configpatch-etcd-
      # metrics.yaml opens that listener (operator-applied through Omni). Spec:
      # docs/superpowers/specs/2026-08-03--obs--etcd-scrape-control-plane-design.md
      #
      # ONLY QUORUM LOSS PAGES. layer-2-etcd-no-leader and layer-2-etcd-member-
      # down are severity: critical with NO health_bridge_only, so they reach
      # Telegram. The other four carry health_bridge_only="true", which the
      # notification policy's escape-hatch route (ahead of the severity routes,
      # continue: false) diverts to the Health Bridge alone. for: 10m on both
      # pagers is the load-bearing number: a planned Talos rolling reboot takes
      # one member down and elects a new leader entirely legitimately, and the
      # 2026-08-02 control-plane roll took roughly 7 minutes while producing 48
      # alerts against a completely healthy cluster. An etcd alert that fires on
      # every planned roll gets muted inside a month, and a muted alert is worse
      # than no alert because it still looks like coverage.
      #
      # layer-2-etcd-scrape-absent exists because the other five would otherwise
      # recreate the bug being fixed. Every rule here uses noDataState: OK, so
      # if the Endpoints object ever empties AGAIN — a chart bump changing the
      # selector, a values merge dropping endpoints:, a node IP change — the
      # up{job="kube-etcd"} series simply vanish, every rule goes NoData, every
      # rule reads OK, and Frank is blind to etcd behind a green dashboard.
      # absent() is the only expression that fires on a series DISAPPEARING.
      # critical + health_bridge_only is deliberate: health-bridge's dead-to-
      # bug-issue lifecycle needs critical, the escape-hatch route keeps it off
      # Telegram, so a blind scrape becomes a tracked bug that auto-closes on
      # heal without paging (blindness is not death).
      #
      # THESE ARE NOT THE ONLY etcd ALERTS IN THE CLUSTER — AND THE OTHERS ARE
      # INERT. victoria-metrics-k8s-stack also renders a VMRule (victoria-
      # metrics-victoria-metrics-k8s-stack-etcd) carrying 15 UPSTREAM etcd
      # alerts: etcdNoLeader, etcdInsufficientMembers, etcdMembersDown,
      # etcdHighFsyncDurations, etcdDatabaseQuotaLowSpace and more. Every one
      # selects job=~".*etcd.*", which MATCHES kube-etcd, and four of them
      # overlap the rules below at looser thresholds. That VMRule renders
      # whether or not our kubeEtcd block exists (it follows kubeEtcd.enabled,
      # true by chart default) and it is NOT a duplicate anyone forgot to
      # delete: a VMRule is evaluated by vmalert, and apps/victoria-metrics/
      # values.yaml sets vmalert.enabled: false — alerting on Frank is
      # Grafana-managed. So those 15 never evaluate and never fire. If you have
      # just discovered "duplicate etcd alerting", the rules BELOW are the live
      # half; do not delete them in favour of the inert ones.
      #
      # METRICS: only etcd_server_* / etcd_disk_* / etcd_mvcc_* / etcd_network_*
      # and up{job="kube-etcd"}. NEVER etcd_request_* / etcd_requests_* /
      # etcd_lease_* / etcd_bookmark_* — those are the APISERVER's storage
      # client, they were present in VMSingle throughout the 148 blind days, and
      # mistaking them for etcd metrics is precisely why nobody noticed. A rule
      # repointed at one of them goes green and measures the wrong process.
      # Guarded by scripts/tests/test_etcd_scrape.py.
      #
      # NOTE: no < > & in annotations — Grafana's Telegram contact point sends
      # HTML parse_mode, so a bare angle bracket makes Telegram reject the
      # message with 400 and the alert fires but is never delivered (the
      # 2026-06-08 layer-1-nic-link-flap incident). Hence NODE_IP, not a
      # bracketed placeholder, and comparisons spelled out in words.
      - orgId: 1
        name: layer-2-etcd-health
        folder: feature-health
        interval: 1m
        rules:
          # 1/6 — PAGES. The quorum has no leader: no writes are being served.
          - uid: layer-2-etcd-no-leader
            title: Layer 2 etcd Quorum Has No Leader
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'etcd_server_has_leader'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: lt, params: [1] }
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: critical
              github_issue: "frank-ops#2"
            annotations:
              summary: "L2 etcd: member {{ $labels.instance }} reports no leader for 10m — the quorum is not serving writes"
              runbook: "talosctl -n NODE_IP etcd status (expect 3 members, one leader); talosctl -n NODE_IP service etcd status; docs/runbooks/frank-gotchas/grafana.md"

          # 2/6 — PAGES. A member's scrape target is down. On a healthy cluster
          # this is 3 series at 1; two of three still holds quorum, but the
          # cluster is one failure from losing it.
          - uid: layer-2-etcd-member-down
            title: Layer 2 etcd Member Down
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'up{job="kube-etcd"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: lt, params: [1] }
            noDataState: OK
            execErrState: Error
            for: 10m
            labels:
              severity: critical
              github_issue: "frank-ops#2"
            annotations:
              summary: "L2 etcd: member {{ $labels.instance }} unreachable for 10m — quorum is one failure from being lost"
              runbook: "talosctl -n NODE_IP etcd status; talosctl -n NODE_IP service etcd status; check the 2381 metrics listener is still open (patches/phase08-obs/omni-configpatch-etcd-metrics.yaml); docs/runbooks/frank-gotchas/grafana.md"

          # 3/6 — health-bridge only. The watchdog against this whole layer
          # silently reverting. absent() returns EMPTY while the series exist,
          # so NoData is the HEALTHY path here — inverted versus every other
          # rule in this group. Same shape as tls-cert-canary-absent.
          # for: 15m so a vmagent restart or a rolling etcd apply cannot trip it.
          - uid: layer-2-etcd-scrape-absent
            title: Layer 2 etcd Scrape Absent
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'absent(up{job="kube-etcd"})'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 15m
            labels:
              severity: critical
              health_bridge_only: "true"
              github_issue: "frank-ops#2"
            annotations:
              summary: "L2 etcd: the kube-etcd scrape has produced no series for 15m — every other etcd rule is now blind and reading OK"
              runbook: "Check the Endpoints object is populated: kubectl -n kube-system get endpoints -l k8s-app=kube-etcd -o yaml (the chart labels the ENDPOINTS k8s-app; jobLabel is on the Service, so selecting on it here returns nothing and reads as a missing object). No subsets means the chart reverted to pod-selector discovery, which can never match on Talos. Then confirm the listener from the vmagent pod: wget -qO- http://192.168.55.21:2381/metrics. docs/runbooks/frank-gotchas/grafana.md"

          # 4/6 — health-bridge only. Leader churn is the signal the iGPU
          # retrieval acceptance row needs and could not measure. for: 0m
          # because the query already integrates over an hour.
          - uid: layer-2-etcd-leader-changes
            title: Layer 2 etcd Leader Change Churn
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'increase(etcd_server_leader_changes_seen_total[1h])'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [3] }
            noDataState: OK
            execErrState: Error
            for: 0m
            labels:
              severity: warning
              health_bridge_only: "true"
              github_issue: "frank-ops#2"
            annotations:
              summary: "L2 etcd: more than 3 leader changes in an hour on {{ $labels.instance }} — the quorum is re-electing, usually disk or peer-network pressure"
              runbook: "talosctl -n NODE_IP etcd status; compare WAL fsync p99 and peer round-trip on the etcd dashboard; correlate with workloads pinned to the control-plane minis. Threshold is a provisional first-pass value. docs/runbooks/frank-gotchas/grafana.md"

          # 5/6 — health-bridge only. 50ms p99 is the widely-cited etcd health
          # boundary; Frank's minis are NVMe-backed so this should sit far
          # below it. Provisional until the dashboard has a baseline.
          - uid: layer-2-etcd-wal-fsync-slow
            title: Layer 2 etcd WAL Fsync Slow
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'histogram_quantile(0.99, sum by (le, instance) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])))'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0.05] }
            noDataState: OK
            execErrState: Error
            for: 15m
            labels:
              severity: warning
              health_bridge_only: "true"
              github_issue: "frank-ops#2"
            annotations:
              summary: "L2 etcd: WAL fsync p99 on {{ $labels.instance }} above 50ms for 15m — etcd commits are disk-bound and leader elections become likely"
              runbook: "talosctl -n NODE_IP etcd status; check disk pressure and Longhorn replica traffic on that mini; see the etcd dashboard for the fsync and backend-commit panels. Threshold is a provisional first-pass value. docs/runbooks/frank-gotchas/grafana.md"

          # 6/6 — health-bridge only. Ratio against the member's OWN advertised
          # quota, so it stays correct if the quota is ever raised.
          - uid: layer-2-etcd-db-quota
            title: Layer 2 etcd Database Approaching Quota
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: 'etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0.8] }
            noDataState: OK
            execErrState: Error
            for: 15m
            labels:
              severity: warning
              health_bridge_only: "true"
              github_issue: "frank-ops#2"
            annotations:
              summary: "L2 etcd: backend database on {{ $labels.instance }} is above 80 percent of its quota — at 100 percent etcd goes read-only cluster-wide"
              runbook: "talosctl -n NODE_IP etcd status (shows DB size); defragment and revise the compaction settings before the quota is reached, because an exhausted backend puts the cluster into a NOSPACE alarm and refuses writes. Threshold is a provisional first-pass value. docs/runbooks/frank-gotchas/grafana.md"

      # --- Layer 3 — Networking / Cilium (frank-ops#3) ---
      # Per-workload alert when any cilium DaemonSet or the cilium-operator
      # Deployment has replicas unavailable.
      #
      # Query rewrite 2026-08-02: per-pod kube_pod_status_ready -> per-workload
      # availability. A terminal pod (Succeeded/Failed) can never become Ready
      # and Kubernetes does not GC it below --terminated-pod-gc-threshold, so
      # kube-state-metrics exports its NotReady series forever; the 2026-08-02
      # control-plane roll left 47 NodeShutdown tombstones behind and produced
      # 48 firing alerts against a healthy cluster. A tombstone is not a
      # replica. Note the threshold INVERTS with the metric: lt 1 on a
      # readiness gauge becomes gt 0 on an unavailability counter.
      #
      # for: 15m (was 5m) — DELIBERATE sensitivity change, unlike the phase-2
      # rules which kept their pre-migration windows. cilium and cilium-envoy
      # are DaemonSets, and a DaemonSet reports replicas unavailable throughout
      # ANY node drain. At 5m every planned Talos rolling reboot would produce
      # an alert burst — trading one noise source for another. The 2026-08-02
      # control-plane roll took roughly 7 minutes.
      #
      # NOTE the selector is `cilium.*`, NOT the old pod regex `cilium-.*`.
      # A pod regex has to tolerate the DaemonSet/ReplicaSet name suffix; a
      # workload regex matches the workload name exactly, and the DaemonSet is
      # named plain `cilium`. Carrying `cilium-.*` over verbatim would have
      # silently dropped the cilium agent itself — the single most important
      # workload in this rule — while still matching cilium-envoy and
      # cilium-operator, so the rule would have looked alive. Verified live:
      # daemonset=~"cilium-.*" returns 1 series (cilium-envoy),
      # daemonset=~"cilium.*" returns 2 (cilium, cilium-envoy). Coverage is
      # unchanged versus the pod query, which matched all three workloads.
      - orgId: 1
        name: layer-3-networking-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-3-networking-down
            title: Layer 3 Cilium Agent Down
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: |
                    label_replace(
                      label_replace(
                        kube_deployment_status_replicas_unavailable{namespace="kube-system",deployment=~"cilium.*"},
                        "workload", "$1", "deployment", "(.*)"),
                      "kind", "deployment", "", "")
                    or
                    label_replace(
                      label_replace(
                        kube_daemonset_status_number_unavailable{namespace="kube-system",daemonset=~"cilium.*"},
                        "workload", "$1", "daemonset", "(.*)"),
                      "kind", "daemonset", "", "")
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 15m
            labels:
              severity: warning
              github_issue: "frank-ops#3"
            annotations:
              summary: "L3 Cilium: {{ $labels.kind }}/{{ $labels.workload }} has {{ $values.B.Value | printf \"%.0f\" }} replica(s) unavailable — pod networking degraded"
              runbook: "kubectl -n kube-system rollout status {{ $labels.kind }}/{{ $labels.workload }}; kubectl -n kube-system describe {{ $labels.kind }}/{{ $labels.workload }}"

      # --- Layer 4 — Storage / Longhorn (frank-ops#4) ---
      # DEFERRED: the original plan used longhorn_volume_robustness for per-volume
      # degraded/faulted detection, but Longhorn native metrics aren't scraped yet.
      # Fallback: alert when the longhorn-manager DaemonSet has replicas
      # unavailable (control-plane signal).
      # Follow-up: enable Longhorn ServiceMonitor/VMServiceScrape to restore the
      # original volume-level rule.
      #
      # Query rewrite 2026-08-02: per-pod kube_pod_status_ready -> per-workload
      # availability, for the tombstone reason documented on layer-3 above.
      # Threshold inverts with the metric (lt 1 -> gt 0).
      #
      # for: 15m (was 10m) — DELIBERATE. longhorn-manager is a DaemonSet, so it
      # reports replicas unavailable throughout any node drain; at 10m a Talos
      # rolling reboot (~7 minutes for the 2026-08-02 control-plane roll) is
      # already close to firing, and a slower roll across all seven nodes would
      # clear it comfortably.
      #
      # DaemonSet-ONLY, on purpose. `longhorn-manager` exists solely as a
      # DaemonSet; there is no Deployment of that name in longhorn-system
      # (verified live: the deployment-branch selector returns 0 series and
      # always will). A Deployment clause would be permanently inert and would
      # imply longhorn-manager might one day appear as one — the same cargo-cult
      # the phase-2 rewrite stripped out of layer-14 and layer-15. The other
      # longhorn Deployments (csi-*, longhorn-ui, longhorn-driver-deployer) and
      # DaemonSets (longhorn-csi-plugin, engine-image-*) were outside this rule
      # before the migration and stay outside it: widening coverage is a
      # separate change from rewriting a query.
      #
      # NOTE the selector is `longhorn-manager`, NOT the old pod regex
      # `longhorn-manager-.*`, which as a workload name matches NOTHING —
      # carrying it over verbatim would have produced a rule that can never
      # fire, with no error anywhere. Verified live: daemonset=~"longhorn-
      # manager-.*" returns 0 series, daemonset="longhorn-manager" returns 1.
      - orgId: 1
        name: layer-4-storage-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-4-storage-down
            title: Layer 4 Longhorn Manager NotReady
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: P4169E866C3094E38
                model:
                  refId: A
                  expr: |
                    label_replace(
                      label_replace(
                        kube_daemonset_status_number_unavailable{namespace="longhorn-system",daemonset="longhorn-manager"},
                        "workload", "$1", "daemonset", "(.*)"),
                      "kind", "daemonset", "", "")
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: { type: gt, params: [0] }
            noDataState: OK
            execErrState: Error
            for: 15m
            labels:
              severity: warning
              github_issue: "frank-ops#4"
            annotations:
              summary: "L4 Longhorn: {{ $labels.kind }}/{{ $labels.workload }} has {{ $values.B.Value | printf \"%.0f\" }} replica(s) unavailable — storage control-plane degraded"
              runbook: "kubectl -n longhorn-system rollout status {{ $labels.kind }}/{{ $labels.workload }}; kubectl -n longhorn-system get volumes"

      # --- Layer 5 — GPU Compute (frank-ops#5) ---
      # Per-workload: fires for each GPU-operator or Intel-DRA-driver workload
      # with replicas unavailable.
      #
      # Query rewrite 2026-08-02: per-pod kube_pod_status_ready -> per-workload
      # availability, for the tombstone reason documented on layer-3 above.
      # Threshold inverts with the metric (lt 1 -> gt 0).
      #
      # for: 15m (was 5m) — DELIBERATE. These two namespaces are almost all
      # DaemonSet: 9 DaemonSets (the nvidia device plugin, dcgm-exporter,
      # operator-validator, MIG manager, feature discovery, the Intel DRA
      # kubelet plugin) against 3 Deployments. A DaemonSet reports replicas
      # unavailable throughout any node drain, so at 5m every planned Talos
      # rolling reboot would burst this rule. The 2026-08-02 control-plane roll
      # took roughly 7 minutes.
      #
      # No workload-name filter, matching the pre-migration query, which
      # selected every pod in both namespaces. gpu-operator's validator pods are
      # DaemonSet-owned rather than Job-owned, so nothing here needs the
      # Job-shaped exclusions phase 2 dropped elsewhere.
      - orgId: 1
        name: layer-5-gpu-down
        folder: feature-health
        interval: 1m
        rules:
          - uid: layer-5-gpu-down
            title: Layer 5 GPU Operator NotReady

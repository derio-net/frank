apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-contact-points
  namespace: monitoring
data:
  contact-points.yaml: |
    apiVersion: 1
    templates:
      - orgId: 1
        name: frank-telegram
        template: |
          {{- /*
            Compact Telegram message (spec 2026-10-22--obs--telegram-alert-brevity).
            NO dollar sign anywhere in this text, comments included: Grafana
            env-interpolates the whole provisioning file, so a dollar-prefixed
            name would be rewritten at boot. Hence no range variables, no root
            reference and no regex backreferences - counts come from the builtin
            slice, URL surgery from backreference-free reReplaceAll chains.
            Guard: scripts/tests/test_telegram_alert_template.py
          */ -}}
          {{ define "frank.telegram.origin" -}}
            {{- /* scheme://host of the GeneratorURL (not Grafana's external URL field: a trailing slash there doubles the slash) */ -}}
            {{ .GeneratorURL | reReplaceAll "/alerting/grafana/.*" "" }}
          {{- end }}
          {{ define "frank.telegram.ruleuid" -}}
            {{- /* Grafana strips private double-underscore labels from .Labels, so the
                   rule uid is cut out of .../alerting/grafana/UID/view?orgId=1 instead */ -}}
            {{ .GeneratorURL | reReplaceAll ".*/alerting/grafana/" "" | reReplaceAll "/view.*" "" }}
          {{- end }}
          {{ define "frank.telegram.where" -}}
          {{- /* Identity labels only (R3), joined by a middle dot. Each item prints its
                 separator only when an EARLIER item was present - no variables to
                 remember it in. pod is shown only when job is not kube-state-metrics:
                 on KSM series the pod label names the exporter, not the subject. */ -}}
          {{ if or .Labels.namespace .Labels.workload .Labels.deployment .Labels.statefulset .Labels.daemonset .Labels.cronjob .Labels.node .Labels.persistentvolumeclaim (and .Labels.pod (ne .Labels.job "kube-state-metrics")) }}
          Where:
          {{- if .Labels.namespace }} {{ .Labels.namespace }}{{ end }}
          {{- if or .Labels.workload .Labels.deployment .Labels.statefulset .Labels.daemonset .Labels.cronjob }}
            {{- if .Labels.namespace }} ·{{ end }} {{ or .Labels.workload .Labels.deployment .Labels.statefulset .Labels.daemonset .Labels.cronjob }}
          {{- end }}
          {{- if .Labels.node }}
            {{- if or .Labels.namespace .Labels.workload .Labels.deployment .Labels.statefulset .Labels.daemonset .Labels.cronjob }} ·{{ end }} {{ .Labels.node }}
          {{- end }}
          {{- if .Labels.persistentvolumeclaim }}
            {{- if or .Labels.namespace .Labels.workload .Labels.deployment .Labels.statefulset .Labels.daemonset .Labels.cronjob .Labels.node }} ·{{ end }} {{ .Labels.persistentvolumeclaim }}
          {{- end }}
          {{- if and .Labels.pod (ne .Labels.job "kube-state-metrics") }}
            {{- if or .Labels.namespace .Labels.workload .Labels.deployment .Labels.statefulset .Labels.daemonset .Labels.cronjob .Labels.node .Labels.persistentvolumeclaim }} ·{{ end }} {{ .Labels.pod }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{ define "frank.telegram.firing" -}}
          🔥 FIRING · {{ .Labels.severity }} · {{ .Labels.alertname }}
          {{ .Annotations.summary }}
          {{- template "frank.telegram.where" . }}
          {{- if .Annotations.runbook }}
          Fix: {{ .Annotations.runbook }}
          {{- end }}
          Rule: {{ .GeneratorURL }}
          Silence: {{ template "frank.telegram.origin" . }}/alerting/silence/new?alertmanager=grafana&matcher=__alert_rule_uid__%3D{{ template "frank.telegram.ruleuid" . }}&orgId=1
          {{- end }}
          {{ define "frank.telegram.resolved" }}✅ RESOLVED · {{ .Labels.alertname }} — {{ .Annotations.summary }}{{ end }}
          {{ define "frank.telegram.message" -}}
          {{- /* R6: at most 5 firing blocks, then an overflow line; then at most 5
                 resolved one-liners, then a count. The first item of each list is
                 rendered on its own and the rest (slice 1 5, or slice 1) carry a
                 leading separator - with no index variable that is the only way to
                 put separators BETWEEN items. Overflow count = len (slice LIST 5). */ -}}
          {{ if .Alerts.Firing -}}
          {{ template "frank.telegram.firing" (index .Alerts.Firing 0) }}
          {{- if gt (len .Alerts.Firing) 5 }}
          {{- range slice .Alerts.Firing 1 5 }}

          {{ template "frank.telegram.firing" . }}
          {{- end }}

          … +{{ len (slice .Alerts.Firing 5) }} more firing — {{ template "frank.telegram.origin" (index .Alerts.Firing 0) }}/alerting/list
          {{- else }}
          {{- range slice .Alerts.Firing 1 }}

          {{ template "frank.telegram.firing" . }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Alerts.Resolved }}
          {{- if .Alerts.Firing }}

          {{ end }}
          {{- template "frank.telegram.resolved" (index .Alerts.Resolved 0) }}
          {{- if gt (len .Alerts.Resolved) 5 }}
          {{- range slice .Alerts.Resolved 1 5 }}
          {{ template "frank.telegram.resolved" . }}
          {{- end }}
          … +{{ len (slice .Alerts.Resolved 5) }} more resolved
          {{- else }}
          {{- range slice .Alerts.Resolved 1 }}
          {{ template "frank.telegram.resolved" . }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- end }}
    contactPoints:
      - orgId: 1
        name: "Telegram - Willikins"
        receivers:
          - uid: efi04e0201jb4f
            type: telegram
            settings:
              bottoken: $FRANK_C2_TELEGRAM_BOT_TOKEN
              chatid: |
                $FRANK_C2_TELEGRAM_CHAT_ID
              parse_mode: None
              message: '{{ template "frank.telegram.message" . }}'
              # message renders the compact `frank-telegram` template defined in
              # `templates:` at the top of THIS file (summary + Where + Fix + Rule +
              # a rule-uid-only Silence link; resolved = one line; 5 firing / 5
              # resolved cap). Like every provisioning file it is read at Grafana
              # BOOT - a merged edit needs a rollout restart of
              # deploy/victoria-metrics-grafana. The template must hold no dollar
              # sign: this file is env-interpolated.
              # Guard: scripts/tests/test_telegram_alert_template.py
              # parse_mode is pinned to None (plain text) EXPLICITLY. An UNSET
              # value is NOT plain: grafana/alerting receivers/telegram/v1/config.go:84-86
              # falls back to HTML, and a live probe on 2026-10-10 showed a bare
              # `<` returns Telegram 400 (message "sent" but never delivered) when
              # unset, ok with None (frank#799). Markdown is still rejected: it
              # treats `_` as italic and strips underscores (`job=session_manager`
              # -> `sessionmanager`, #143). Plain text loses the Firing/Resolved
              # bolding of the default template - accepted: correctness > formatting.
              # Guard: scripts/tests/test_telegram_parse_mode_explicit.py
      - orgId: 1
        name: "Health Bridge Webhook"
        receivers:
          - uid: health-bridge-webhook
            type: webhook
            settings:
              url: "http://health-bridge.monitoring.svc.cluster.local:8080/webhook"
              httpMethod: POST
              authorization_scheme: Bearer
              authorization_credentials: $HEALTH_BRIDGE_WEBHOOK_SECRET
      - orgId: 1
        name: "AI Helper Webhook"
        receivers:
          - uid: ai-alert-helper-webhook
            type: webhook
            # Re-pointed from the retired ai-alert-helper to the new alert-agent's
            # grafana-webhook receiver (2026-06-16). Cutover order: verify the new
            # receiver answers /healthz BEFORE this flip, remove the old app AFTER.
            settings:
              url: "http://alert-agent.alert-agent.svc.cluster.local:8080/alert"
              httpMethod: POST

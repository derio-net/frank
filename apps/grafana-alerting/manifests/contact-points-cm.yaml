apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-contact-points
  namespace: monitoring
data:
  contact-points.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: "Telegram - Willikins"
        receivers:
          - uid: efi04e0201jb4f
            type: telegram
            settings:
              bottoken: $FRANK_C2_TELEGRAM_BOT_TOKEN
              chatid: |
                $FRANK_C2_TELEGRAM_CHAT_ID
              parse_mode: None
              # parse_mode is pinned to None (plain text) EXPLICITLY. An UNSET
              # value is NOT plain: grafana/alerting receivers/telegram/v1/config.go:84-86
              # falls back to HTML, and a live probe on 2026-10-10 showed a bare
              # `<` returns Telegram 400 (message "sent" but never delivered) when
              # unset, ok with None (frank#799). Markdown is still rejected: it
              # treats `_` as italic and strips underscores (`job=session_manager`
              # -> `sessionmanager`, #143). Plain text loses the Firing/Resolved
              # bolding of the default template - accepted: correctness > formatting.
              # Guard: scripts/tests/test_telegram_parse_mode_explicit.py
      - orgId: 1
        name: "Health Bridge Webhook"
        receivers:
          - uid: health-bridge-webhook
            type: webhook
            settings:
              url: "http://health-bridge.monitoring.svc.cluster.local:8080/webhook"
              httpMethod: POST
              authorization_scheme: Bearer
              authorization_credentials: $HEALTH_BRIDGE_WEBHOOK_SECRET
      - orgId: 1
        name: "AI Helper Webhook"
        receivers:
          - uid: ai-alert-helper-webhook
            type: webhook
            # Re-pointed from the retired ai-alert-helper to the new alert-agent's
            # grafana-webhook receiver (2026-06-16). Cutover order: verify the new
            # receiver answers /healthz BEFORE this flip, remove the old app AFTER.
            settings:
              url: "http://alert-agent.alert-agent.svc.cluster.local:8080/alert"
              httpMethod: POST

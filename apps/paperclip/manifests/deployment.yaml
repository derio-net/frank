apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  namespace: paperclip-system
  labels:
    app.kubernetes.io/name: paperclip
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperclip
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperclip
        app.kubernetes.io/component: server
    spec:
      terminationGracePeriodSeconds: 45
      # Pinned to gpu-1: the 2Gi limit (bumped from 1Gi in 1306b38) was still
      # OOM-killing under load, so we move to a 12Gi limit on the node with
      # 128GB headroom rather than push the control-plane minis (64GB each).
      # No GPU is requested — gpu-1 is also our biggest CPU/RAM box and is
      # currently only ~20% requested. The nvidia.com/gpu:NoSchedule
      # toleration mirrors the cluster's defensive idiom (ollama, n8n,
      # openrgb, secure-agent-pod) so paperclip survives any future re-assert
      # of the gpu-only taint.
      nodeSelector:
        kubernetes.io/hostname: gpu-1
      tolerations:
        - key: nvidia.com/gpu
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
      containers:
        - name: paperclip
          # Pure upstream public image, pinned by sha tag (upstream only
          # publishes `latest`, `canary` and `sha-<short>`; no semver tags).
          # sha-d554c47 == v2026.916.1 (d554c4789ed3930f8a53ac9fdf6503b3187097da,
          # released 2026-09-21). The claude-code / codex / opencode / gemini /
          # kimi CLIs are bundled upstream; nothing is layered on top. Fresh
          # start per the 2026-10-04 spec (instance wiped, no Frank shims).
          image: ghcr.io/paperclipai/paperclip:sha-d554c47
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: paperclip-config
            - secretRef:
                name: paperclip-auth
            - secretRef:
                name: paperclip-brave
                optional: true
            - secretRef:
                name: paperclip-resend
                optional: true
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperclip-db-postgresql
                  key: password
            - name: DATABASE_URL
              value: "postgres://paperclip:$(PG_PASSWORD)@paperclip-db-postgresql.paperclip-system.svc:5432/paperclip"
          volumeMounts:
            - name: data
              mountPath: /paperclip
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 12Gi
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperclip-data

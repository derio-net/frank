---
# Issues write on derio-net/willikins only (private repo): the monthly tier-review report
# (ci-budget-report) upserts its issue with this token. Added to the derio-net
# App by manual op cicd-ci-budget-app-permissions.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: github-app-derio-willikins-issues
spec:
  kind: GithubAccessToken
  generator:
    githubAccessTokenSpec:
      appID: "3994132"
      installID: "138773908"
      auth:
        privateKey:
          secretRef:
            name: github-app-derio-key
            key: key
      permissions:
        issues: write
        metadata: read
      repositories:
        - willikins
---
# Read-only workflow-file access for the monthly report on agentic-stoa (the org
# has no ci-authority generator). contents + metadata read ONLY - never reuse
# stoa-github-mirror here, it carries statuses:write.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: github-app-agentic-stoa-ci-read
spec:
  kind: GithubAccessToken
  generator:
    githubAccessTokenSpec:
      appID: "3994156"
      installID: "138773982"
      auth:
        privateKey:
          secretRef:
            name: github-app-stoa-key
            key: key
      permissions:
        contents: read
        metadata: read
      repositories:
        - hum
        - content-factory
        - stoa-blog
        - companies
        - cnc-fr
        - cnc-frd
        - cnc-fru
        - second-brain
        - hermes-brain
        - flexible-health
        - site

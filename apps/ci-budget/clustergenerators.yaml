# ci-budget-watcher GitHub App installation tokens (spec 2026-10-18 section 4).
#
# Two kinds per org, each on the org's EXISTING App (permissions are added to the
# App by manual op cicd-ci-budget-app-permissions):
#   *-ci-billing   organization_administration:read - the org billing-usage
#                  endpoint. NO repositories (it is an org endpoint). Nothing
#                  else may ever carry this permission.
#   *-ci-authority actions_variables:write + the reads the backstop and coverage gate
#                  need, scoped to the org's tiers.yaml repos. The ONLY tokens
#                  that can write a repository Actions variable. agentic-stoa
#                  has no github-preferred repo and gets none.
# The mirror, status and push tokens never carry either permission
# (scripts/tests/test_ci_budget_manifests.py).
#
# ESO resolves auth.privateKey.secretRef in the CONSUMING ExternalSecret's
# namespace (tekton-pipelines) and IGNORES secretRef.namespace - deliberately no
# namespace field below.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: github-app-derio-net-ci-billing
spec:
  kind: GithubAccessToken
  generator:
    githubAccessTokenSpec:
      appID: "3994132"
      installID: "138773908"
      auth:
        privateKey:
          secretRef:
            name: github-app-derio-key
            key: key
      permissions:
        organization_administration: read
        metadata: read
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: github-app-derio-net-ci-authority
spec:
  kind: GithubAccessToken
  generator:
    githubAccessTokenSpec:
      appID: "3994132"
      installID: "138773908"
      auth:
        privateKey:
          secretRef:
            name: github-app-derio-key
            key: key
      permissions:
        actions_variables: write   # GitHub's key for the Variables permission
        actions: read
        checks: read
        contents: read
        metadata: read
      repositories:
        - willikins
        - herdr-vertical-tabs
        - presentation-craft
        - vibe-kanban
        - runs-fr
---

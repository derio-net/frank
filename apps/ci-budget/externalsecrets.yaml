# ci-budget-watcher token Secrets: one ESO-minted (~1h) installation token per
# ClusterGenerator, key `token`. refreshInterval 30m keeps a margin under the
# TTL; the watcher is a */10 CronJob that reads the Secret per run.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-budget-github-billing-derio-net
  namespace: tekton-pipelines
spec:
  refreshInterval: 30m
  target:
    name: ci-budget-github-billing-derio-net
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: github-app-derio-net-ci-billing
---
apiVersion: external-secrets.io/v1

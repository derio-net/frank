# Telegram notifier (R13): flip / would-flip / refusal / backstop messages. The watcher
# treats the Secret as optional, so a missing one is silent (heartbeat-only) and looks
# like a quiet month; declaring it here makes it part of the deploy. Same C2 bot and
# Infisical source as apps/staging-gate/tekton/externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-budget-telegram
  namespace: tekton-pipelines
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: ci-budget-telegram
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TELEGRAM_TOKEN
      remoteRef:
        key: FRANK_C2_TELEGRAM_BOT_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: TELEGRAM_CHATID
      remoteRef:
        key: FRANK_C2_TELEGRAM_CHAT_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

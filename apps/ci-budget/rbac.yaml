# ci-budget-watcher identity. The state ConfigMap is created by the watcher at
# runtime and never lives in git (the Application runs prune: true).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-budget-watcher
  namespace: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-budget-watcher
  namespace: tekton-pipelines
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ci-budget-state"]
    verbs: ["get", "patch", "update"]
  # RBAC cannot scope `create` by resourceName (the name is not known at
  # authorisation time), so create is the one unnamed verb.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-budget-watcher
  namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-budget-watcher
subjects:
  - kind: ServiceAccount
    name: ci-budget-watcher
    namespace: tekton-pipelines

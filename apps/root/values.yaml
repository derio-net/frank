# Git repo containing Helm values for each app
repoURL: https://github.com/derio-net/frank.git
targetRevision: main

# Cluster destination
destination:
  server: https://kubernetes.default.svc

# Note: LEAF Application templates do NOT set automated.prune explicitly — the
# schema default (false) is the project-wide convention (manual pruning only,
# see agents/rules/frank-argocd.md); ArgoCD normalizes an explicit `prune: false`
# to absent, which caused permanent drift. The ROOT Application is the exception:
# it runs prune: true (declared in apps/root/bootstrap/root-application.yaml),
# which is why deleting a template retires the app.

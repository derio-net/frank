# Authentik Blueprint: retired legacy forward-auth proxy providers
#
# The LIVE forward-auth estate is blueprints-cluster-proxy-providers.yaml
# (*.cluster.derio.net, embedded outpost). This file exists only to retire the
# pre-migration *.frank.derio.net objects, and should carry nothing else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-proxy-providers
  namespace: authentik
  labels:
    app.kubernetes.io/component: blueprint
data:
  proxy-providers.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Proxy Providers for Non-OIDC Services
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Retired 2026-08 with the frank.derio.net domain retirement.
      #
      # These stay as URL-free `state: absent` tombstones rather than being
      # deleted from the file outright. A blueprint only reconciles what it
      # still lists, so removing the entries would leave the live Authentik
      # providers and applications orphaned — present in the database, absent
      # from Git, and invisible to every check in this repo. Deletion has to be
      # declared to happen.
      #
      # Applications are listed FIRST: each holds a foreign key to its provider,
      # so the dependent object must be removed before its target.
      #
      # Once these have reconciled against the live instance, the whole file
      # (and its blueprints.configMaps entry in apps/authentik/values.yaml) can
      # be dropped in a follow-up.
      - model: authentik_core.application
        state: absent
        identifiers:
          slug: longhorn

      - model: authentik_core.application
        state: absent
        identifiers:
          slug: hubble

      - model: authentik_core.application
        state: absent
        identifiers:
          slug: sympozium

      - model: authentik_core.application
        state: absent
        identifiers:
          slug: n8n-01

      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: Longhorn UI

      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: Hubble UI

      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: Sympozium

      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: n8n-01

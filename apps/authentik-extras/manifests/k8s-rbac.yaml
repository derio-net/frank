# ClusterRoleBindings mapping Authentik groups to Kubernetes RBAC
# These groups come from the OIDC token's 'groups' claim.
#
# root-agents is READ-ONLY and SECRETLESS (derio-net/frank#912): the cluster-wide read below, plus
# a namespaced read bound per app namespace in the GENERATED root-agents-rbac.yaml
# (scripts/root_agents_rbac.py --write; never upgrade-sessions, cluster-update-fr or runs-fr).
# The old authentik-root-agents -> cluster-admin binding is gone from git but prune is false, so it
# is deleted from the cluster by manual operation auth-root-agents-cutover.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-root-admins
subjects:
  - kind: Group
    name: root-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-root-devops
subjects:
  - kind: Group
    name: root-devops
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-root-developers
subjects:
  - kind: Group
    name: root-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: root-agents-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-root-agents-read
subjects:
  - kind: Group
    name: root-agents
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: root-agents-cluster-read
  apiGroup: rbac.authorization.k8s.io
---
# Explicit list, deliberately not the built-in `view` (which aggregates every aggregate-to-view role
# operators ship). No secrets, no wildcards, no write verbs. Bound per namespace by root-agents-rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: root-agents-ns-read
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "rollouts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "watch"]

      # LiteLLM (cluster) proxy provider
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: LiteLLM (cluster)
        id: provider-litellm-cluster
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://litellm.cluster.derio.net

      - model: authentik_core.application
        state: present
        identifiers:
          slug: litellm-cluster
        attrs:
          name: LiteLLM (cluster)
          provider: !KeyOf provider-litellm-cluster
          meta_launch_url: https://litellm.cluster.derio.net

      # Paperclip (cluster) proxy provider
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Paperclip (cluster)
        id: provider-paperclip-cluster
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://paperclip.cluster.derio.net

      - model: authentik_core.application
        state: present
        identifiers:
          slug: paperclip-cluster
        attrs:
          name: Paperclip (cluster)
          provider: !KeyOf provider-paperclip-cluster
          meta_launch_url: https://paperclip.cluster.derio.net

      # ComfyUI (cluster) proxy provider
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: ComfyUI (cluster)
        id: provider-comfyui-cluster
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://comfyui.cluster.derio.net

      - model: authentik_core.application
        state: present
        identifiers:
          slug: comfyui-cluster
        attrs:
          name: ComfyUI (cluster)
          provider: !KeyOf provider-comfyui-cluster
          meta_launch_url: https://comfyui.cluster.derio.net

      # GPU Switcher (cluster) proxy provider
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: GPU Switcher (cluster)
        id: provider-gpu-cluster
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://gpu.cluster.derio.net

      - model: authentik_core.application
        state: present

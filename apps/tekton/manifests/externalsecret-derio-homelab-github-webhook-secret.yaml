# HMAC secret shared between the GitHub webhook on derio-homelab/kid-laptops and
# the `github` ClusterInterceptor on the github-listener EventListener.
#
# Deliberately NOT reusing stoa-github-webhook-secret. It would have worked —
# the interceptor only needs both ends to agree — but it would silently couple
# two unrelated orgs' webhook authenticity to one value, so compromising a
# webhook config in one org would let an attacker forge events for the other.
# Frank's boundaries are per-org everywhere else (tokens, Apps, bots); the
# webhook secret should not be the exception.
#
# The Infisical value is created by manual operation
# `cicd-kid-laptops-infisical-webhook-secret`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: derio-homelab-github-webhook-secret
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: derio-homelab-github-webhook-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret
      remoteRef:
        # Absolute path — the `infisical` ClusterSecretStore is scoped to /.
        key: /derio-homelab/GITHUB_WEBHOOK_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

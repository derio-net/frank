# HMAC secret shared between the GitHub `repository_dispatch` webhook on
# derio-net/runs-fr and the `github` ClusterInterceptor on the
# staging-gate-runs-fr trigger (github-listener EventListener).
#
# Deliberately NOT reusing stoa-github-webhook-secret or
# derio-homelab-github-webhook-secret. It would have worked — the
# interceptor only needs both ends to agree — but it would silently couple
# an unrelated org's webhook authenticity to one value, so compromising a
# webhook config in one org would let an attacker forge events for another.
# Frank's boundaries are per-org everywhere else (tokens, Apps, bots); the
# webhook secret should not be the exception (same reasoning as the
# derio-homelab-github-webhook-secret ExternalSecret in this directory).
#
# The Infisical value is created by manual operation
# `cicd-staging-gate-runs-fr-webhook`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: derio-net-github-webhook-secret
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: derio-net-github-webhook-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret
      remoteRef:
        # Absolute path — the `infisical` ClusterSecretStore is scoped to /.
        key: /derio-net/GITHUB_WEBHOOK_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

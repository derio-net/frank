# HMAC secret shared between derio-net/runs-fr's own `build.yml` (GHA — a
# signed direct POST to webhooks.hop.derio.net, NOT a GitHub repo webhook;
# repository_dispatch is App-only per GitHub's availability matrix, so no
# repo webhook for it can exist — P10 review Critical #1, journal decision
# d-delivery-gha-direct-post) and the `github` ClusterInterceptor on the
# staging-gate-runs-fr trigger (github-listener EventListener). The
# interceptor validates purely by HMAC + the X-GitHub-Event header value, so
# it cannot tell a direct POST from a real GitHub delivery — both ends only
# need to agree on this one secret value.
#
# Deliberately NOT reusing stoa-github-webhook-secret or
# derio-homelab-github-webhook-secret. It would have worked — the
# interceptor only needs both ends to agree — but it would silently couple
# an unrelated org's webhook authenticity to one value, so compromising a
# webhook config in one org would let an attacker forge events for another.
# Frank's boundaries are per-org everywhere else (tokens, Apps, bots); the
# webhook secret should not be the exception (same reasoning as the
# derio-homelab-github-webhook-secret ExternalSecret in this directory).
#
# The Infisical value is created by manual operation
# `cicd-staging-gate-runs-fr-webhook`, which also mirrors it into runs-fr's
# own Actions secret `FRANK_STAGING_GATE_WEBHOOK_SECRET`. `/derio-net` must
# be a FOLDER in the same Infisical PROJECT the `infisical` ClusterSecretStore
# targets — a value in a sibling project is unreadable, and the ESO error
# names the folder, not the project, which reads like a typo'd path rather
# than a wrong-project lookup.
#
# EXPECTED DEGRADED WINDOW: merging this file makes the `tekton-extras`
# ArgoCD Application go (and stay) Degraded — ArgoCD's built-in ExternalSecret
# health check — until the manual op above seeds the Infisical value. Nothing
# pages on it. This is expected, not a regression; see the matching note on
# the webhooks.yaml `derio-net/runs-fr` entry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: derio-net-github-webhook-secret
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: derio-net-github-webhook-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret
      remoteRef:
        # Absolute path — the `infisical` ClusterSecretStore is scoped to /.
        key: /derio-net/GITHUB_WEBHOOK_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

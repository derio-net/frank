# GitHub App installation-token generator (derio-fr-automation, App 3994132).
#
# OWNED BY TEKTON (tekton-extras) since VibeKanban and the secure-agent-pod were retired
# (2026-11, spec 2026-11-08--agents--retire-vk): tekton-pipelines/frank-gitops-push
# depends on this generator (cnc-promotion and staging-gate depend on that Secret).
# It used to live under apps/secure-agent-pod (retired 2026-11), and removing that
# Application would have cascaded to it; the ExternalSecret's deletionPolicy: Retain would then have kept
# the old Secret in place while its token expired ~1h later, everything still green.
# Do not move it back under an Application that can be removed.
#
# Least-privilege identity that REPLACES the clawdia org-owner PAT for agent git/gh.
# ESO mints a short-lived (~1h) installation token; an ExternalSecret writes it into
# a Secret that the pod mounts as a live-updated file. The private key is NEVER
# mounted into a container — only the rotating token is. A container-filesystem
# compromise yields at most a ~1h token, not the key.
#
# NOTE: ESO (v2.1.0) resolves this generator's privateKey.secretRef in the CONSUMING
# ExternalSecret's namespace and IGNORES secretRef.namespace — so the key Secret must
# exist in EVERY consumer's namespace: tekton-pipelines (frank-gitops-push). The
# retired secure-agent-pod was a second consumer until 2026-11. The real protection
# is that the key is never mounted into a container.
#
# To tighten further, scope the minted token with `repositories:` / `permissions:`
# (omitted here = the App's full install: repository_selection ALL derio-net repos,
# contents/issues/PRs/workflows write — verified 2026-09-14). Consumers that need
# less get their own scoped generator on the same App instead of scoping this one,
# which tekton (and, until it was retired, secure-agent-pod) shared (e.g. the
# github-app-renovate / -cluster-update-* generators).
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: github-app-derio
spec:
  kind: GithubAccessToken
  generator:
    githubAccessTokenSpec:
      appID: "3994132"
      installID: "138773908"
      auth:
        privateKey:
          secretRef:
            name: github-app-derio-key
            key: key

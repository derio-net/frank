# GitHub App installation-token generator for the derio-homelab org.
#
# kid-laptops (derio-homelab/kid-laptops, issue #43) is private and sits in a
# THIRD org: not derio-net (github-app-derio, secure-agent-pod) and not
# agentic-stoa (github-app-stoa, tekton). Neither existing generator's token can
# read it, so the mirror needs its own.
#
# It reuses the *App* — derio-fr-automation (3994132), the same one installed on
# derio-net — because a GitHub App can be installed into many orgs, each
# installation getting its own id and its own repository scope. Reusing the App
# means one private key to rotate instead of two; the per-org blast radius still
# comes from the installation's repository selection, which must be scoped to
# kid-laptops only.
#
# NOTE: ESO resolves auth.privateKey.secretRef in the CONSUMING ExternalSecret's
# namespace (tekton-pipelines) and IGNORES secretRef.namespace — deliberately no
# namespace field below. Getting this wrong leaves the ExternalSecret in
# SecretSyncedError indefinitely while ArgoCD stays green; it hid for seven days
# on frank-gitops-push. Guarded by
# scripts/tests/test_kid_laptops_mirror_wiring.py.
#
# installID is filled by the operator on this PR before merge — manual operation
# `cicd-kid-laptops-github-app-install`. No App is installed on derio-homelab
# today (`gh api /orgs/derio-homelab/installations` returns an empty list), so an
# agent cannot know it. Merging with the sentinel in place would create a
# permanently failing ExternalSecret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: github-app-derio-homelab
spec:
  kind: GithubAccessToken
  generator:
    githubAccessTokenSpec:
      appID: "3994132"
      installID: "REPLACE_AFTER_APP_INSTALL"
      auth:
        privateKey:
          secretRef:
            name: github-app-derio-key
            key: key

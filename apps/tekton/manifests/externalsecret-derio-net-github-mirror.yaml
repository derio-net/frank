# derio-net mirror credential — the token derio-net-pull-sync, mirror-reconcile,
# ci-delivery-check and the github-status task use for the five derio-net
# github-preferred repos.
#
# ESO mints a short-lived (~1h) App installation token via the
# github-app-derio-mirror ClusterGenerator and writes it to key `token`, the
# same key shape the stoa and homelab mirrors use.
#
# refreshInterval 45m keeps a margin under the 1h TTL. Tekton tasks are
# short-lived and read the Secret per run, so every run gets a current token.
#
# The App private key (github-app-derio-key) MUST exist in THIS namespace:
# ESO resolves the generator's privateKey secretRef here, not where the
# ClusterGenerator was declared.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: derio-net-github-mirror
  namespace: tekton-pipelines
spec:
  refreshInterval: 45m
  target:
    name: derio-net-github-mirror
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: github-app-derio-mirror

# derio-homelab mirror credential — the token github-pull-sync uses to clone
# the private kid-laptops repo from GitHub.
#
# ESO mints a short-lived (~1h) App installation token via the
# github-app-derio-homelab ClusterGenerator and writes it to key `token`, the
# same key shape the stoa mirror uses, so derio-homelab-pull-sync reads it
# exactly like github-pull-sync reads its own.
#
# refreshInterval 45m keeps a margin under the 1h TTL. Tekton tasks are
# short-lived and read the Secret per run, so every run gets a current token —
# no live-file mount needed, unlike the long-running agent pods.
#
# The App private key (github-app-derio-key) MUST exist in THIS namespace:
# ESO resolves the generator's privateKey secretRef here, not where the
# ClusterGenerator was declared.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: derio-homelab-github-mirror
  namespace: tekton-pipelines
spec:
  refreshInterval: 45m
  target:
    name: derio-homelab-github-mirror
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: github-app-derio-homelab

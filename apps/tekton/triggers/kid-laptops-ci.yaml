# THE CONTRACT between Frank and derio-homelab/kid-laptops.
#
# kid-laptops documents exactly what this TriggerTemplate must generate, at
# `ci/tekton/pipelinerun-example.yaml`, and has a test that fails if that
# example ever drifts from their pipeline. This file is the other end of it;
# scripts/tests/test_kid_laptops_pipelinerun_contract.py fails if THIS drifts.
#
# Fired by the `kid-laptops-push` trigger on gitea-listener (second hop — see
# eventlistener.yaml).
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: kid-laptops-push-binding
  namespace: tekton-pipelines
spec:
  params:
    - name: repo-url
      value: $(body.repository.clone_url)
    # body.after is the pushed SHA. Binding a branch name here instead would
    # let the resolver fetch a pipeline from a commit other than the one under
    # test — the exact drift the git resolver exists to prevent.
    - name: revision
      value: $(body.after)
    - name: short-sha
      value: $(extensions.short_sha)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: kid-laptops-ci-template
  namespace: tekton-pipelines
spec:
  params:
    - name: repo-url
    - name: revision
    - name: short-sha
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: kid-laptops-ci-
        # NOT tekton-pipelines. The CI namespace is where the VMI lives and
        # where the kid-laptops-ci-kubevirt ServiceAccount is scoped;
        # tekton-triggers-sa has an explicit RoleBinding there so the
        # EventListener can create this object (apps/tekton/manifests/
        # kid-laptops-ci-rbac.yaml).
        namespace: kid-laptops-ci
      spec:
        pipelineRef:
          # Fetched from the repo at the tested revision, so CI ships with the
          # code. Requires enable-git-resolver — on, in the
          # tekton-pipelines-resolvers namespace (NOT tekton-pipelines, where
          # looking for resolvers-feature-flags returns NotFound and reads
          # misleadingly as "resolvers not installed").
          resolver: git
          params:
            - name: url
              value: $(tt.params.repo-url)
            - name: revision
              value: $(tt.params.revision)
            - name: pathInRepo
              value: ci/tekton/pipeline.yaml
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: revision
            value: $(tt.params.revision)
          # MUST be unique per run: two concurrent runs sharing a run-id create
          # and destroy each other's VM. $(uid) is Tekton's per-event random
          # postfix — documented as "a random value, just like the postfix
          # generated by generateName", which is not a uniqueness guarantee. The
          # short SHA narrows a collision to two concurrent runs on the SAME
          # commit that also collide on $(uid), and makes a stray VMI traceable
          # back to a commit.
          - name: run-id
            value: $(tt.params.short-sha)-$(uid)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                # numberOfReplicas 1, dataLocality best-effort — verified NOT
                # node-pinned, so this does not constrain where the run lands.
                storageClassName: longhorn-cicd
                resources:
                  requests:
                    # Checkout plus the uv cache the checks task writes.
                    storage: 2Gi
        taskRunSpecs:
          # Per-task, not pipeline-wide: only the molecule tasks touch the
          # KubeVirt API, so clone / lint / syntax / unit-tests run with the
          # namespace default ServiceAccount and no cluster privileges at all.
          #
          # Both tasks are currently SKIPPED — kid-laptops gates them behind
          # `enable-molecule` (default false) because KubeVirt is not installed
          # on Frank yet. These bindings stay so that flipping that param is the
          # only change needed once it is.
          - pipelineTaskName: molecule-base
            serviceAccountName: kid-laptops-ci-kubevirt
          - pipelineTaskName: molecule-teardown
            serviceAccountName: kid-laptops-ci-kubevirt

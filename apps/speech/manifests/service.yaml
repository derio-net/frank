# ClusterIP only: private. Exposed via the ip-allowlisted Traefik route.
apiVersion: v1
kind: Service
metadata:
  name: speech
  namespace: speech
  labels:
    app.kubernetes.io/name: speech
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: speech
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

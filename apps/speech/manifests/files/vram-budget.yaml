# VRAM budget for gpu-1's RTX 5070 Ti (16 GB), shared by Ollama and speech.
# Sizes are conservative placeholders (estimate: true) until the benchmark
# replaces them with measured values. Guard: scripts/tests/test_speech_vram_budget.py
total_gb: 16
headroom_gb: 1.5
ollama:
  # Only one model is loaded at a time (OLLAMA_MAX_LOADED_MODELS=1).
  allowlist:
    - {name: "gemma4:12b-64k", num_ctx: 65536, vram_gb: 9.7, estimate: false}
  # Tags the Ollama chart can load but that must NOT be loaded while speech is up
  # (hybrid CPU/GPU offload, ~24 GB total: it would take the whole card).
  excluded_while_speech_up:
    - {name: "qwen3.6:35b-a3b-64k", reason: "24 GB total, 61% on GPU; does not fit beside speech"}
speech:
  # Names are the model repos the Deployment preloads (PRELOAD_MODELS); a guard
  # in scripts/tests/test_speech_manifests.py keeps the two in step.
  # Sizes are still estimates (estimate: true) from the models' documented sizes
  # plus runtime workspace; the benchmark (infer-speech-benchmark-run) replaces
  # them with measured values.
  models:
    # large-v3-turbo CT2 float16: ~1.6 GB weights + CTranslate2 workspace.
    - {name: "deepdml/faster-whisper-large-v3-turbo-ct2", vram_gb: 2.5, estimate: true}
    # Kokoro-82M ONNX (~0.3 GB weights) + onnxruntime CUDA arena.
    - {name: "speaches-ai/Kokoro-82M-v1.0-ONNX", vram_gb: 1.5, estimate: true}
    # Piper voices run on onnxruntime CUDA. Measured 2026-11-22: loading
    # el_GR-rapunzelina-low added 128 MiB to the card (10663 -> 10791 MiB, with
    # Ollama, Whisper, Kokoro and thorsten all loaded). thorsten-high was already
    # loaded, so its share is a conservative estimate ("high" is the larger size).
    - {name: "speaches-ai/piper-de_DE-thorsten-high", vram_gb: 0.4, estimate: true}
    - {name: "speaches-ai/piper-el_GR-rapunzelina-low", vram_gb: 0.2, estimate: false}

# RBAC for the staging-gate Pipeline.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-gate
  namespace: tekton-pipelines
---
# Read the <app>-staging ArgoCD Application status (await-sync task polls Synced+Healthy).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: staging-gate-argocd-read
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: staging-gate-argocd-read
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: staging-gate-argocd-read
subjects:
  - kind: ServiceAccount
    name: staging-gate
    namespace: tekton-pipelines
---
# P9.T1: read the ONE Secret the vCluster chart exports for the gate
# (apps/vclusters/staging/values.yaml's exportKubeConfig.additionalSecrets).
# `resourceNames` restricts this to vc-staging-gate ONLY -- vcluster-staging
# also holds the vCluster's own control-plane/admin Secrets (vc-config-staging
# etc.), which this ServiceAccount must never be able to list or read. Unlike
# the June design (a `vcluster-staging-kubeconfig` Secret mounted as a
# workspace volume), run-smoke and reset now fetch this Secret with the pod's
# OWN API token via `kubectl get`, so RBAC is genuinely required here -- this
# is NOT the same shape as the deleted `staging-gate-secrets-read` Role below
# (P8 review, p8-m3): that one widened access to a kubelet-resolved
# secretKeyRef the pod's SA token never touches. This one is the touch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: staging-gate-vcluster-kubeconfig-read
  namespace: vcluster-staging
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["vc-staging-gate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: staging-gate-vcluster-kubeconfig-read
  namespace: vcluster-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: staging-gate-vcluster-kubeconfig-read
subjects:
  - kind: ServiceAccount
    name: staging-gate
    namespace: tekton-pipelines
---
# P9.T3: serialize per app. resolve-contract's wait-turn step lists
# PipelineRuns labelled staging-gate/app=<app> (set by the TriggerTemplate) to
# find an older, still-unfinished run for the SAME app before proceeding, so
# two concurrent runs never share the one staging vCluster. verbs is `list`
# only (P9 review, M2) -- wait-turn only ever does a label-selector listing
# (`kubectl get pipelineruns -l ...`, RBAC's "list" verb), never a single
# named get; "get" was unused.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: staging-gate-pipelinerun-read
  namespace: tekton-pipelines
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: staging-gate-pipelinerun-read
  namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: staging-gate-pipelinerun-read
subjects:
  - kind: ServiceAccount
    name: staging-gate
    namespace: tekton-pipelines
# No RBAC is needed for frank-gitops-push or the staging-gate-telegram Secret
# (P9.T3): both are resolved via a container `env.valueFrom.secretKeyRef`,
# which the KUBELET reads -- not the pod ServiceAccount's API token. A Role
# here would only widen who can read those Secrets via the automounted SA
# token in third-party step images, for no capability the pipeline actually
# uses (P8 review, finding p8-m3-unneeded-secret-role -- the
# staging-gate-secrets-read Role this replaced was dropped for the same
# reason; test_no_secrets_read_role_exists guards its absence).

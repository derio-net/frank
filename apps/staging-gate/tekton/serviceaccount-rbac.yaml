# RBAC for the staging-gate Pipeline. RUNTIME-verified in the manual phase (P7) — the
# vCluster-access mechanism (the `vcluster-staging-kubeconfig` Secret) is created out-of-band
# alongside the ArgoCD cluster Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-gate
  namespace: tekton-pipelines
---
# Read the <app>-staging ArgoCD Application status (await-sync task polls Synced+Healthy).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: staging-gate-argocd-read
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: staging-gate-argocd-read
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: staging-gate-argocd-read
subjects:
  - kind: ServiceAccount
    name: staging-gate
    namespace: tekton-pipelines
# No RBAC is needed for the gate's other secrets. frank-gitops-push (the App token every
# clone/push step authenticates with over HTTPS — see tasks.yaml's git-plumbing note) is
# resolved via a container `env.valueFrom.secretKeyRef`, which the KUBELET reads — not the pod
# ServiceAccount's API token. The vCluster kubeconfig is injected as a workspace Secret volume
# (see triggers.yaml's PipelineRun template), likewise not an API read. A `staging-gate-secrets-
# read` Role here would only widen who can read those Secrets via the automounted SA token in
# third-party step images, for no capability the pipeline actually uses (P8 review, finding
# p8-m3-unneeded-secret-role — dropped).

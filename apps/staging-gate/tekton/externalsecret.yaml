# Telegram credential for staging-gate-notify (P9.T3's finally task). Same shape as
# apps/argocd-notifications/manifests/externalsecret.yaml: the existing C2 bot's token/chat-id
# via Infisical FRANK_C2_TELEGRAM_BOT_TOKEN/FRANK_C2_TELEGRAM_CHAT_ID through the "infisical"
# ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staging-gate-telegram
  namespace: tekton-pipelines
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: staging-gate-telegram
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: FRANK_C2_TELEGRAM_BOT_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: chat-id
      remoteRef:
        key: FRANK_C2_TELEGRAM_CHAT_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

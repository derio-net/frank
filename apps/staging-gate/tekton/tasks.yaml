# staging-gate Tekton Tasks (tekton.dev/v1). Schema-valid + structurally complete; on-cluster
# RUNTIME (git push, ArgoCD polling, vCluster kubectl) is verified in the manual phase (P7).
# Design: alpine/git for git (no apk → works nonroot), mikefarah/yq for nested value edits
# (no fragile sed), bitnamilegacy/kubectl for cluster ops. Images pinned by tag; add digests once
# verified against the registry (P7). Gotchas honoured: computeResources, HOME=/tekton/home,
# non-root (securityContext inlined per step — YAML anchors do NOT cross `---` doc boundaries).
# Image tag convention is `sha-<commit>` (spec Component 1): params.sha is the SHORT commit sha
# the GHA repository_dispatch sends; the tag is `sha-$(params.sha)`.
#
# P9 finding: every kubectl step here used to run rancher/kubectl:v1.31.4, which is "kubectl
# from scratch" — a single static binary with NO shell at all (confirmed live via `docker
# inspect`/`docker run`: a mounted `#!/bin/sh` script fails `exec ...: no such file or
# directory`). Tekton's `script:` mechanism execs the script file directly, relying on the
# image having a shell to interpret the shebang, so every rancher/kubectl script step here
# would have failed at pod runtime — invisible to `kubectl apply --dry-run=server` (schema-only)
# and to structural pytest (never executes the script). Fixed by switching every kubectl step to
# bitnamilegacy/kubectl:1.33.4 (Debian-based; has bash/date/base64/awk; already used elsewhere in
# the repo at apps/tekton/manifests/pipelinerun-ttl-gc.yaml, runAsUser 1001). Guarded by
# test_no_step_with_a_script_uses_a_shell_less_image.
#
# Git plumbing: every clone/push step `ref:`s the shared `staging-gate-git` StepAction
# (stepactions.yaml, P8.T2 REFACTOR) — one script authenticating over HTTPS with the
# frank-gitops-push App token (GITHUB_TOKEN, secretKeyRef key `token`), like
# cnc-promotion/site-promotion — no SSH key, no workspace-mounted credential. Auth goes through a
# `credential.helper` naming the env var (never a URL-embedded token, never the value written to
# .git/config — P8 review, finding p8-m1-token-in-git-config); `set +x` keeps the token out of
# PipelineRun logs.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: staging-gate-bump-staging
  namespace: tekton-pipelines
spec:
  description: Set image.tag=sha-<sha> in the app's staging values file (frank) and push.
  params:
    - {name: sha, type: string}
    - {name: stagingValuesPath, type: string}
  workspaces:
    - {name: scratch}
  steps:
    - name: clone
      ref: {name: staging-gate-git}
      computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
      params:
        - {name: mode, value: clone}
        - {name: scratchPath, value: $(workspaces.scratch.path)}
    - name: bump
      image: mikefarah/yq:4.44.3
      env: [{name: TAG, value: "sha-$(params.sha)"}]
      computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      script: |
        #!/bin/sh
        set -eu
        f="$(workspaces.scratch.path)/frank/$(params.stagingValuesPath)"
        yq -i '.image.tag = strenv(TAG)' "$f"
        echo "staged image.tag -> $TAG"; yq '.image' "$f"
    - name: push
      ref: {name: staging-gate-git}
      computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
      params:
        - {name: mode, value: push}
        - {name: scratchPath, value: $(workspaces.scratch.path)}
        - {name: message, value: "gate: stage sha-$(params.sha) [skip ci]"}
        - {name: path, value: "$(params.stagingValuesPath)"}
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: staging-gate-await-sync
  namespace: tekton-pipelines
spec:
  description: Poll the <app>-staging ArgoCD Application until Synced + Healthy (or time out).
  params:
    - {name: stagingApp, type: string}
    - {name: timeoutSeconds, type: string, default: "600"}
  steps:
    - name: wait
      image: bitnamilegacy/kubectl:1.33.4
      env: [{name: HOME, value: /tekton/home}]
      computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1001, seccompProfile: {type: RuntimeDefault}}
      script: |
        #!/bin/sh
        set -eu
        end=$(( $(date +%s) + $(params.timeoutSeconds) ))
        while [ "$(date +%s)" -lt "$end" ]; do
          sync=$(kubectl -n argocd get application "$(params.stagingApp)" -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
          health=$(kubectl -n argocd get application "$(params.stagingApp)" -o jsonpath='{.status.health.status}' 2>/dev/null || true)
          echo "sync=$sync health=$health"
          [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ] && exit 0
          sleep 10
        done
        echo "timed out waiting for $(params.stagingApp) Synced+Healthy" >&2
        exit 1
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: staging-gate-run-smoke
  namespace: tekton-pipelines
spec:
  description: Run the app's smoke-test Job IN the staging vCluster; exit 0 only if it succeeds.
  params:
    - {name: app, type: string}
    - {name: smokeImage, type: string}
    - {name: smokeNamespace, type: string}
    - {name: smokeRbacUrl, type: string, description: "the app's smoke RBAC manifest URL, containing the literal {sha}"}
    - {name: smokeServiceAccount, type: string}
    - {name: sha, type: string}
    - {name: timeoutSeconds, type: string, default: "300"}
  steps:
    # P9.T1: no `vcluster-kubeconfig` workspace any more — fetch the gate's own
    # kubeconfig Secret with THIS pod's own API token (staging-gate-vcluster-
    # kubeconfig-read Role, resourceNames-scoped to vc-staging-gate only).
    # Written under umask 077 and never `cat`'d — see
    # test_kubeconfig_file_is_never_catd and the behaviour test that executes
    # this script directly.
    - name: fetch-kubeconfig
      image: bitnamilegacy/kubectl:1.33.4
      env: [{name: HOME, value: /tekton/home}]
      computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1001, seccompProfile: {type: RuntimeDefault}}
      script: |
        #!/bin/sh
        set -eu
        umask 077
        dest="${VC_KUBECONFIG_PATH:-/tekton/home/vc.kubeconfig}"
        kubectl -n vcluster-staging get secret vc-staging-gate -o jsonpath='{.data.config}' | base64 -d > "$dest"
    # P9.T2: fetch the app's smoke RBAC manifest pinned to the GATED sha.
    # runs-fr is PRIVATE; frank-gitops-push (the derio-fr-automation App
    # install, `repository_selection: all`) can read it. curl -fsS fails
    # closed on any non-2xx response rather than applying a partial/error body.
    - name: fetch-smoke-rbac
      image: curlimages/curl:8.7.1
      env:
        - {name: HOME, value: /tekton/home}
        - {name: SMOKE_RBAC_URL, value: $(params.smokeRbacUrl)}
        - {name: SHA, value: $(params.sha)}
        - name: GITHUB_TOKEN
          valueFrom: {secretKeyRef: {name: frank-gitops-push, key: token}}
      computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 100, seccompProfile: {type: RuntimeDefault}}
      script: |
        #!/bin/sh
        set -eu
        # SHA is already regex-validated by resolve-contract's validate-inputs
        # step (^[a-f0-9]{7,40}$) before it ever reaches this task's params, so
        # this substitution carries no shell-metacharacter risk.
        url=$(printf '%s' "$SMOKE_RBAC_URL" | sed "s/{sha}/$SHA/")
        curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.raw" \
          "$url" -o "${SMOKE_RBAC_PATH:-/tekton/home/smoke-rbac.yaml}"
    - name: smoke
      image: bitnamilegacy/kubectl:1.33.4
      env:
        - {name: HOME, value: /tekton/home}
        - {name: KUBECONFIG, value: /tekton/home/vc.kubeconfig}
        # app/sha derive from the GHA repository_dispatch payload — read via env
        # rather than splicing $(params.app)/$(params.sha) straight into the
        # script (P8 review scope check). smokeServiceAccount is contract data
        # (the registry file), not trigger-payload-derived, but env keeps the
        # style consistent.
        - {name: APP, value: $(params.app)}
        - {name: SHA, value: $(params.sha)}
        - {name: SMOKE_SA, value: $(params.smokeServiceAccount)}
      computeResources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1001, seccompProfile: {type: RuntimeDefault}}
      script: |
        #!/bin/sh
        set -eu
        ns="$(params.smokeNamespace)"; job="smoke-${APP}-${SHA}"
        # Idempotent namespace create — a re-gate of the same app reuses it.
        kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n "$ns" apply -f /tekton/home/smoke-rbac.yaml
        kubectl -n "$ns" delete job "$job" --ignore-not-found
        cat <<EOF | kubectl -n "$ns" apply -f -
        apiVersion: batch/v1
        kind: Job
        metadata: {name: $job}
        spec:
          backoffLimit: 0
          ttlSecondsAfterFinished: 600
          template:
            spec:
              restartPolicy: Never
              serviceAccountName: $SMOKE_SA
              containers:
                - name: smoke
                  image: $(params.smokeImage):sha-${SHA}
                  env:
                    - {name: GATEWAY_URL, value: "http://${APP}.${ns}.svc"}
                    - {name: SMOKE_NAMESPACE, value: "${ns}"}
        EOF
        end=$(( $(date +%s) + $(params.timeoutSeconds) ))
        while [ "$(date +%s)" -lt "$end" ]; do
          s=$(kubectl -n "$ns" get job "$job" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)
          f=$(kubectl -n "$ns" get job "$job" -o jsonpath='{.status.failed}' 2>/dev/null || true)
          [ "$s" = "1" ] && { echo "smoke PASS"; exit 0; }
          if [ -n "$f" ] && [ "$f" != "0" ]; then
            echo "smoke FAIL"; kubectl -n "$ns" logs "job/$job" --tail=80 2>/dev/null || true; exit 1
          fi
          sleep 5
        done
        echo "smoke TIMEOUT" >&2; exit 1
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: staging-gate-promote
  namespace: tekton-pipelines
spec:
  description: >-
    Promote — record the gated sha as last-green in $(params.promotedRecordPath) (smoke-gated;
    the pipeline only runs this Task when run-smoke Succeeded) and push. There is no prod app
    yet (spec Revision 2026-09-14), so this writes a record rather than bumping a prod values
    file.
  params:
    - {name: app, type: string}
    - {name: sha, type: string}
    - {name: image, type: string, description: "contract's base image ref, e.g. ghcr.io/derio-net/runs-fr"}
    - {name: promotedRecordPath, type: string}
    - {name: pipelineRun, type: string}
  workspaces:
    - {name: scratch}
  steps:
    - name: clone
      ref: {name: staging-gate-git}
      computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
      params:
        - {name: mode, value: clone}
        - {name: scratchPath, value: $(workspaces.scratch.path)}
    - name: record
      image: mikefarah/yq:4.44.3
      env:
        - {name: SHA, value: "$(params.sha)"}
        - {name: IMAGE_REF, value: "$(params.image):sha-$(params.sha)"}
        - {name: PIPELINE_RUN, value: "$(params.pipelineRun)"}
      computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      script: |
        #!/bin/sh
        set -eu
        f="$(workspaces.scratch.path)/frank/$(params.promotedRecordPath)"
        export NOW="$(date -u +%FT%TZ)"
        yq -i '.sha = strenv(SHA) | .image = strenv(IMAGE_REF) | .pipelineRun = strenv(PIPELINE_RUN) | .promotedAt = strenv(NOW)' "$f"
        echo "promoted sha-$(params.sha)"; yq '.' "$f"
    - name: push
      ref: {name: staging-gate-git}
      computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
      params:
        - {name: mode, value: push}
        - {name: scratchPath, value: $(workspaces.scratch.path)}
        - {name: message, value: "gate: last-green $(params.app) sha-$(params.sha) [skip ci]"}
        - {name: path, value: "$(params.promotedRecordPath)"}
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: staging-gate-reset
  namespace: tekton-pipelines
spec:
  description: Reset staging — delete the app's namespace in the vCluster (runs in finally).
  params:
    - {name: smokeNamespace, type: string}
  steps:
    # Same fetch as staging-gate-run-smoke's first step (P9.T1) — each Task is a
    # separate pod/TaskRun, so each needs its own fetch even though they share
    # the identical script.
    - name: fetch-kubeconfig
      image: bitnamilegacy/kubectl:1.33.4
      env: [{name: HOME, value: /tekton/home}]
      computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1001, seccompProfile: {type: RuntimeDefault}}
      script: |
        #!/bin/sh
        set -eu
        umask 077
        dest="${VC_KUBECONFIG_PATH:-/tekton/home/vc.kubeconfig}"
        kubectl -n vcluster-staging get secret vc-staging-gate -o jsonpath='{.data.config}' | base64 -d > "$dest"
    - name: reset
      image: bitnamilegacy/kubectl:1.33.4
      env:
        - {name: HOME, value: /tekton/home}
        - {name: KUBECONFIG, value: /tekton/home/vc.kubeconfig}
      computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1001, seccompProfile: {type: RuntimeDefault}}
      script: |
        #!/bin/sh
        set -eu
        kubectl delete namespace "$(params.smokeNamespace)" --ignore-not-found --wait=false
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: staging-gate-notify
  namespace: tekton-pipelines
spec:
  description: >-
    Telegram-notify on a RED staging-gate run (finally task). Params come ONLY from the
    pipeline's raw $(params.*)/$(context.*) and each task's $(tasks.<t>.status) — NEVER from
    resolve-contract's RESULTS, because Tekton skips a finally task's param when it reads a
    RESULT from a task that failed or never ran, and resolve-contract can be exactly that task.
    $(tasks.<t>.status) is always resolvable in finally (Succeeded/Failed/None) — that is the
    whole reason it is exposed there — so referencing five of them here never risks skipping
    this task the way a results reference would.
  params:
    - {name: app, type: string}
    - {name: sha, type: string}
    - {name: pipelineRun, type: string}
    - {name: resolveStatus, type: string}
    - {name: bumpStatus, type: string}
    - {name: awaitStatus, type: string}
    - {name: smokeStatus, type: string}
    - {name: promoteStatus, type: string}
  steps:
    - name: notify
      image: curlimages/curl:8.7.1
      timeout: 2m
      env:
        - {name: HOME, value: /tekton/home}
        - {name: APP, value: $(params.app)}
        - {name: SHA, value: $(params.sha)}
        - {name: PIPELINE_RUN, value: $(params.pipelineRun)}
        - {name: RESOLVE_STATUS, value: $(params.resolveStatus)}
        - {name: BUMP_STATUS, value: $(params.bumpStatus)}
        - {name: AWAIT_STATUS, value: $(params.awaitStatus)}
        - {name: SMOKE_STATUS, value: $(params.smokeStatus)}
        - {name: PROMOTE_STATUS, value: $(params.promoteStatus)}
        # P9 review (I4): optional: true. Without it, an ExternalSecret that
        # has not synced yet (staging-gate-telegram is refreshInterval: 5m,
        # not instant) makes THIS Secret's key missing, and Kubernetes refuses
        # to start the container at all (CreateContainerConfigError) -- for
        # the one Task whose entire job is reporting a red run, silently
        # un-startable is the worst possible failure mode. optional: true lets
        # the container start with the env var simply unset/empty, and the
        # script below checks for that explicitly and fails loudly instead.
        - name: TELEGRAM_TOKEN
          valueFrom: {secretKeyRef: {name: staging-gate-telegram, key: token, optional: true}}
        - name: TELEGRAM_CHAT_ID
          valueFrom: {secretKeyRef: {name: staging-gate-telegram, key: chat-id, optional: true}}
      computeResources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 64Mi}}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 100, seccompProfile: {type: RuntimeDefault}}
      script: |
        #!/bin/sh
        set -eu
        # P9 review (I4): the secretKeyRefs above are optional: true, so an
        # un-synced ExternalSecret leaves these EMPTY rather than unset --
        # under `set -u` an unset var would abort the script anyway, but an
        # empty one would not, and would otherwise sail into a POST with an
        # empty token/chat_id (Telegram would just 404/401 it, silently).
        # Check explicitly and fail loudly BEFORE ever invoking curl.
        if [ -z "${TELEGRAM_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
          echo "staging-gate-telegram token/chat-id is empty (ExternalSecret not yet synced?) -- cannot notify" >&2
          exit 1
        fi
        # app/sha are the RAW trigger-payload values, not a validated/sanitized
        # copy -- if validate-inputs is itself the failing step, notify still
        # needs to report SOMETHING. No parse_mode is set below, so Telegram
        # would not 400 on <, >, or & (that trap needs parse_mode=HTML) --
        # stripped anyway, defensively, so the message stays unambiguous
        # either way (P9 spec: "avoided by construction").
        sanitize() { printf '%s' "$1" | tr -d '<>&'; }
        app=$(sanitize "$APP")
        sha=$(sanitize "$SHA")

        failing="unknown"
        for pair in "resolve-contract:$RESOLVE_STATUS" "bump-staging:$BUMP_STATUS" \
                    "await-sync:$AWAIT_STATUS" "run-smoke:$SMOKE_STATUS" "promote:$PROMOTE_STATUS"; do
          name=${pair%%:*}; status=${pair#*:}
          if [ "$status" = "Failed" ]; then
            failing="$name"
            break
          fi
        done

        text="staging-gate RED: app=${app} sha=${sha} failing_task=${failing} pipelineRun=${PIPELINE_RUN}"
        curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=${text}"

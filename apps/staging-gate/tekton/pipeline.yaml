# staging-gate Pipeline (tekton.dev/v1). Reusable: params are {app, sha}; resolve-contract reads
# apps/staging-gate/registry/<app>.yaml (https-cloned with the frank-gitops-push App token — frank
# is private). promote runs ONLY when run-smoke Succeeded and records last-green; reset always
# (finally). Git clone/push steps `ref:` the shared StepAction in stepactions.yaml (P8.T2
# REFACTOR) — see its header comment for the mode/param contract. RUNTIME → P7 (staging/vCluster
# wiring), Component 4 registry → P8.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: staging-gate
  namespace: tekton-pipelines
spec:
  params:
    - {name: app, type: string}
    - {name: sha, type: string}
    # P9 review (M1): plumbed through from resolve-contract's taskSpec (whose
    # own param default this mirrors) so it is an actual Pipeline-level knob,
    # not just a default with no way to override it.
    - {name: waitTurnTimeoutSeconds, type: string, default: "1800"}
  workspaces:
    - {name: scratch}
  tasks:
    - name: resolve-contract
      params:
        - {name: app, value: $(params.app)}
        - {name: sha, value: $(params.sha)}
        - {name: waitTurnTimeoutSeconds, value: $(params.waitTurnTimeoutSeconds)}
      workspaces:
        - {name: scratch, workspace: scratch}
      taskSpec:
        params:
          - {name: app, type: string}
          - {name: sha, type: string}
          # P9.T3: bounded wait for an older same-app run (default 30min).
          - {name: waitTurnTimeoutSeconds, type: string, default: "1800"}
        workspaces:
          - {name: scratch}
        results:
          - {name: stagingApp}
          - {name: stagingValuesPath}
          - {name: smokeImage}
          - {name: smokeNamespace}
          - {name: smokeRbacUrl}
          - {name: smokeServiceAccount}
          - {name: image}
          - {name: promotedRecordPath}
        steps:
          - name: validate-inputs
            # Defence in depth (P8 review, finding p8-rec-validate-inputs): phase 10's
            # CEL trigger filter validates app/sha at the EventListener, but a manual
            # PipelineRun bypasses it entirely. app builds a filesystem path (the
            # registry lookup below) and a Job name (run-smoke); sha reaches shell
            # scripts throughout the pipeline. Read via env, never $(params.*)
            # splicing, for the same injection reason as the StepAction (p8-c1).
            # Runs BEFORE wait-turn: the label selector below is app's value, so app
            # must already be a valid label value by the time wait-turn uses it.
            image: alpine/git:2.45.2
            env:
              - {name: APP, value: $(params.app)}
              - {name: SHA, value: $(params.sha)}
            computeResources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 65532
              seccompProfile: {type: RuntimeDefault}
            script: |
              #!/bin/sh
              set -eu
              echo "$SHA" | grep -Eq '^[a-f0-9]{7,40}$' || { echo "invalid sha: $SHA" >&2; exit 1; }
              echo "$APP" | grep -Eq '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$' || { echo "invalid app: $APP" >&2; exit 1; }
          - name: wait-turn
            # P9.T3 (serialization): the TriggerTemplate labels every PipelineRun
            # `staging-gate/app: <app>` (triggers.yaml). Wait while an OLDER
            # (earlier creationTimestamp), still-unfinished PipelineRun for the SAME
            # app exists, so two runs never share the one staging vCluster. "Self"
            # is identified by $(context.pipelineRun.name), not by name-matching
            # against the label selector result (which includes self).
            #
            # bitnamilegacy/kubectl:1.33.4, not rancher/kubectl: this step needs a
            # shell (while-loop, awk) -- see test_no_step_with_a_script_uses_a_
            # shell_less_image's docstring for why rancher/kubectl cannot run any
            # script at all.
            image: bitnamilegacy/kubectl:1.33.4@sha256:ed0b31a0508da84ee655c5c6e01bd3897fc56ad6cf69debb27fa1893a06d2246
            env:
              - {name: HOME, value: /tekton/home}
              - {name: APP, value: $(params.app)}
              - {name: SELF, value: $(context.pipelineRun.name)}
              - {name: WAIT_TIMEOUT, value: $(params.waitTurnTimeoutSeconds)}
            computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1001
              seccompProfile: {type: RuntimeDefault}
            script: |
              #!/bin/sh
              set -eu
              end=$(( $(date +%s) + WAIT_TIMEOUT ))
              # P9 review (I1): only the TriggerTemplate labels its PipelineRun
              # staging-gate/app -- a manual `tkn pipeline start` (or phase 11's own
              # Test Plan) is unlabelled, so "self" never appears in `rows` and,
              # without this bail-out, the step would spin for the full
              # WAIT_TIMEOUT (default 30min) before failing with a misleading
              # "timed out" message on a run that was never blocked by anything.
              # A FEW short retries (informer/API propagation lag can legitimately
              # delay self showing up by a poll or two) before giving up and
              # proceeding without serialization.
              self_missing_polls=0
              while [ "$(date +%s)" -lt "$end" ]; do
                rows=$(kubectl -n tekton-pipelines get pipelineruns -l "staging-gate/app=$APP" \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.metadata.creationTimestamp}{"\t"}{.status.conditions[-1:].status}{"\n"}{end}')
                self_ts=$(printf '%s\n' "$rows" | awk -F'\t' -v self="$SELF" '$1==self{print $2}')
                if [ -z "$self_ts" ]; then
                  self_missing_polls=$((self_missing_polls + 1))
                  if [ "$self_missing_polls" -ge "${SELF_NOT_FOUND_RETRIES:-3}" ]; then
                    echo "self not labelled staging-gate/app -- serialization not enforced for this run" >&2
                    exit 0
                  fi
                  echo "self PipelineRun $SELF not found yet -- retrying" >&2
                  sleep "${WAIT_POLL_INTERVAL:-10}"
                  continue
                fi
                self_missing_polls=0
                # Blocking = an OTHER run, for the SAME app, created strictly before
                # self -- OR created in the SAME second (creationTimestamp has
                # one-second granularity, so a strict timestamp `<` alone lets two
                # same-second runs both see no older run and proceed concurrently;
                # P9 review, I2), tiebroken on name so the comparison is a total
                # order -- whose last condition status is neither True (succeeded)
                # nor False (failed) -- i.e. still Unknown/running.
                blocking=$(printf '%s\n' "$rows" | awk -F'\t' -v self="$SELF" -v selfts="$self_ts" \
                  '$1!=self && ($2<selfts || ($2==selfts && $1<self)) && $3!="True" && $3!="False" {print $1}')
                if [ -z "$blocking" ]; then
                  echo "no older unfinished staging-gate run for app=$APP -- proceeding"
                  exit 0
                fi
                echo "waiting on older run(s): $blocking"
                sleep "${WAIT_POLL_INTERVAL:-10}"
              done
              echo "timed out after ${WAIT_TIMEOUT}s waiting for an older staging-gate run for app=$APP to finish" >&2
              exit 1
          - name: clone
            ref: {name: staging-gate-git}
            computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
            params:
              - {name: mode, value: clone}
              - {name: scratchPath, value: $(workspaces.scratch.path)}
          - name: read
            image: mikefarah/yq:4.44.3
            env:
              - {name: APP, value: $(params.app)}
            computeResources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 65532
              seccompProfile: {type: RuntimeDefault}
            script: |
              #!/bin/sh
              set -eu
              f="$(workspaces.scratch.path)/frank/apps/staging-gate/registry/${APP}.yaml"
              # Each result path is a genuine Tekton substitution; values written newline-free.
              printf '%s' "$(yq '.stagingApp' "$f")" > "$(results.stagingApp.path)"
              printf '%s' "$(yq '.stagingValuesPath' "$f")" > "$(results.stagingValuesPath.path)"
              printf '%s' "$(yq '.smokeImage' "$f")" > "$(results.smokeImage.path)"
              printf '%s' "$(yq '.smokeNamespace' "$f")" > "$(results.smokeNamespace.path)"
              printf '%s' "$(yq '.smokeRbacUrl' "$f")" > "$(results.smokeRbacUrl.path)"
              printf '%s' "$(yq '.smokeServiceAccount' "$f")" > "$(results.smokeServiceAccount.path)"
              printf '%s' "$(yq '.image' "$f")" > "$(results.image.path)"
              printf '%s' "$(yq '.promotedRecordPath' "$f")" > "$(results.promotedRecordPath.path)"
    - name: bump-staging
      runAfter: [resolve-contract]
      taskRef: {name: staging-gate-bump-staging}
      params:
        - {name: sha, value: $(params.sha)}
        - {name: stagingValuesPath, value: $(tasks.resolve-contract.results.stagingValuesPath)}
      workspaces:
        - {name: scratch, workspace: scratch}
    - name: await-sync
      runAfter: [bump-staging]
      taskRef: {name: staging-gate-await-sync}
      params:
        - {name: stagingApp, value: $(tasks.resolve-contract.results.stagingApp)}
    - name: run-smoke
      runAfter: [await-sync]
      taskRef: {name: staging-gate-run-smoke}
      params:
        - {name: app, value: $(params.app)}
        - {name: smokeImage, value: $(tasks.resolve-contract.results.smokeImage)}
        - {name: smokeNamespace, value: $(tasks.resolve-contract.results.smokeNamespace)}
        - {name: smokeRbacUrl, value: $(tasks.resolve-contract.results.smokeRbacUrl)}
        - {name: smokeServiceAccount, value: $(tasks.resolve-contract.results.smokeServiceAccount)}
        - {name: sha, value: $(params.sha)}
    - name: promote
      # P8 review (p8-c2-dag-when-status, Critical): a DAG task cannot read
      # $(tasks.<x>.status) — Tekton rejects it ("pipeline tasks can not refer
      # to execution status ... of any other pipeline task"). runAfter already
      # skips promote whenever run-smoke fails; that when-guard is redundant
      # AND inadmissible.
      runAfter: [run-smoke]
      taskRef: {name: staging-gate-promote}
      params:
        - {name: app, value: $(params.app)}
        - {name: sha, value: $(params.sha)}
        - {name: image, value: $(tasks.resolve-contract.results.image)}
        - {name: promotedRecordPath, value: $(tasks.resolve-contract.results.promotedRecordPath)}
        - {name: pipelineRun, value: $(context.pipelineRun.name)}
      workspaces:
        - {name: scratch, workspace: scratch}
  finally:
    # P9.T3: reset reads smokeNamespace from resolve-contract's RESULTS, so if
    # resolve-contract itself failed (or was skipped), Tekton skips reset too
    # (a finally task's param is unresolvable when it reads a result from a
    # task that never produced one). That is ACCEPTABLE here, unlike for
    # notify below: if resolve-contract never ran, nothing was ever deployed
    # into the vCluster for this run, so there is nothing for reset to clean
    # up. notify, by contrast, must fire on exactly that failure -- see its
    # comment for why it reads only raw params/status, never results.
    - name: reset
      taskRef: {name: staging-gate-reset}
      params:
        - {name: smokeNamespace, value: $(tasks.resolve-contract.results.smokeNamespace)}
    - name: notify
      # P9.T3: fire on any RED run. $(tasks.status) (the pipeline-wide
      # aggregate, legal only in finally) is "Succeeded" when every task
      # ran and succeeded, "Completed" when some were skipped but none
      # failed, and "Failed" otherwise -- so `notin [Succeeded, Completed]`
      # catches both an outright task failure AND the case where run-smoke
      # itself never ran because an earlier task failed.
      when:
        - input: "$(tasks.status)"
          operator: notin
          values: ["Succeeded", "Completed"]
      taskRef: {name: staging-gate-notify}
      params:
        # Deliberately the pipeline's RAW params/context, never
        # resolve-contract.results.* -- a finally task's param is skipped
        # entirely when it reads a result from a task that failed or never
        # ran, and resolve-contract can be exactly that task. Losing the
        # red-path notification on the run most likely to need one would
        # defeat the point of this task.
        - {name: app, value: $(params.app)}
        - {name: sha, value: $(params.sha)}
        - {name: pipelineRun, value: $(context.pipelineRun.name)}
        - {name: resolveStatus, value: "$(tasks.resolve-contract.status)"}
        - {name: bumpStatus, value: "$(tasks.bump-staging.status)"}
        - {name: awaitStatus, value: "$(tasks.await-sync.status)"}
        - {name: smokeStatus, value: "$(tasks.run-smoke.status)"}
        - {name: promoteStatus, value: "$(tasks.promote.status)"}

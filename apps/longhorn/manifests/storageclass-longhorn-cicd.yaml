# Longhorn-CICD StorageClass — single replica, NOT node-pinned (no disk or node selector,
# so replicas land wherever Longhorn has room). Used by: Gitea repos, Zot image blobs, act-runner data.
# Per-run CI workspaces moved to longhorn-hdd (2026-10-11).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-cicd
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"
  dataLocality: best-effort

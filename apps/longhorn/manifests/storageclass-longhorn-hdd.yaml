# Longhorn-HDD StorageClass — single replica on pc-1's hdd-tagged disks only.
# Re-creatable CI scratch only (Tekton per-run workspaces): no redundancy, 2008-era drives.
# Spec: docs/superpowers/specs/2026-10-11--stor--pc1-hdd-longhorn-design.md
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-hdd
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"        # only pc-1 has hdd disks and node anti-affinity is hard
  diskSelector: "hdd"
  dataLocality: "disabled"     # the selector already fixes the replica's node

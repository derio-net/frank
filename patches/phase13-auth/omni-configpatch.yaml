metadata:
    namespace: default
    type: ConfigPatches.omni.sidero.dev
    id: 150-auth-oidc-apiserver
    labels:
        omni.sidero.dev/cluster: frank
        omni.sidero.dev/machine-set: frank-control-planes
spec:
    data: |
        machine:
            files:
                - content: |
                    apiVersion: apiserver.config.k8s.io/v1
                    kind: AuthenticationConfiguration
                    jwt:
                      - issuer:
                          url: https://auth.frank.derio.net/application/o/k8s-agent/
                          audiences:
                            - k8s-agent
                        claimMappings:
                          username:
                            claim: preferred_username
                            prefix: "authentik:"
                          groups:
                            claim: groups
                            prefix: ""
                      - issuer:
                          url: https://auth.cluster.derio.net/application/o/k8s-agent/
                          audiences:
                            - k8s-agent
                        claimMappings:
                          username:
                            claim: preferred_username
                            prefix: "authentik:"
                          groups:
                            claim: groups
                            prefix: ""
                  permissions: 0o644
                  path: /var/lib/kubernetes/authn-config.yaml
                  op: create
        cluster:
            apiServer:
                extraArgs:
                    authentication-config: /etc/kubernetes/authn-config.yaml
                extraVolumes:
                    - hostPath: /var/lib/kubernetes/authn-config.yaml
                      mountPath: /etc/kubernetes/authn-config.yaml
                      readonly: true

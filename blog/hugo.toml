baseURL = "https://blog.derio.net/frank/"
languageCode = "en-us"
title = "Frank, the Talos Cluster"

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[params]
  description = "Building, operating, and deciding: an AI-hybrid Kubernetes homelab with Talos Linux, Cilium, Longhorn, ArgoCD, and GPU compute"
  projectSlug = "Frank"
  papersDossierDir = "docs/papers-dossiers"
  papersDossierBaseURL = "https://github.com/derio-net/frank/blob/main/docs/papers-dossiers"

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.footer]
    displayPoweredBy = false

  [params.editURL]
    enable = false

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"

  # Series-index card layout (cards | table | none) — read by the series-index shortcode.
  [params.seriesIndex]
    style = "cards"

  # Build-time WebP image optimization (blog-craft #14) — read by opt-image.html.
  [params.imageOptimize]
    enabled = true
    format = "webp"
    quality = 82
    maxWidth = 1600
    bannerMaxWidth = 2560

# `series` must be a taxonomy or Hextra's opengraph partial fails on
# series-tagged pages (`first 6 $series.Pages`). capabilities/references
# back the papers content-type's cross-referencing.
# Hextra's home feed (layouts/list.rss.xml) lists `params.rss.sections`, whose
# theme default is ["blog"] — a section no blog-craft blog has, so the feed was
# empty. Posts live under content/docs/<series>/.
[params.rss]
  sections = ["docs"]

# Pin the mermaid bundle Hextra fetches at build time (_partials/scripts/mermaid.html
# GetRemotes `mermaid@latest` by default, so diagram layout floated between builds:
# mermaid 11.17 pushed 8 of frank's 186 diagrams past the 1400px width gate with
# no diagram edits — frank#787). Bump deliberately, rebuild, and re-run
# validate_mermaid_layout.mjs; never `latest`. imageZoom / asciinema / katex have
# the same `@latest` default in Hextra if a blog turns them on.
[params.mermaid]
  base = "https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist"

[taxonomies]
  series = "series"
  capabilities = "capabilities"
  references = "references"

[[menu.main]]
  name = "Building"
  pageRef = "/docs/building"
  weight = 1

[[menu.main]]
  name = "Operating"
  pageRef = "/docs/operating"
  weight = 2

[[menu.main]]
  name = "Papers"
  pageRef = "/docs/papers"
  weight = 3

[[menu.main]]
  name = "Search"
  weight = 6
  [menu.main.params]
    type = "search"

[[menu.main]]
  name = "GitHub"
  url = "https://github.com/derio-net/frank"
  weight = 7
  [menu.main.params]
    icon = "github"
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    lineNos = false
    # `style` is inert while noClasses = false (below): it only seeds
    # `hugo gen chromastyles`, and we emit no generated palette. Kept as the
    # record of the previous look; the live palette comes from the theme.
    style = "monokai"
    # Chroma defaults noClasses=true, stamping the palette onto every token as
    # `<span style="color:#f92672">` — ~9,300 inline style attributes site-wide.
    # blog.derio.net serves a CSP, a browser drops inline styles while the page
    # still returns 200, and on 2026-07-26 that silently cost EVERY code block
    # its highlighting with nothing failing server-side.
    #
    # Class-based output is also what Hextra expects: it ships
    # assets/css/chroma/{light,dark}.css at `.highlight .chroma .<token>`
    # specificity, so highlighting now follows the light/dark toggle instead of
    # being monokai in both. Do NOT add a generated chroma stylesheet alongside
    # it — one was tried and lost on specificity every time, silently.
    noClasses = false

[outputs]
  home = ["HTML", "RSS", "JSON", "Catalog", "llms"]

# Hugo 0.158+ default security.http.urls excludes URLs containing "@", which
# blocks Hextra's flexsearch CDN load (cdn.jsdelivr.net/npm/flexsearch@<ver>).
# Override removes that exclusion. Drop this block entirely if you disable search.
[security]
  [security.http]
    urls = ['(?i)^https?://[a-z]', '! (?i)localhost']


# Reader experience (features.reader_experience). The editorial "Updated" date
# resolves from `last_updated` (which must therefore be a date on a reader
# blog), then lastmod, then date. Reader blogs only: elsewhere `last_updated`
# stays the free-text key the {{< last-updated >}} shortcode prints, and
# Hugo keeps its default chain (incl. :git under enableGitInfo).
[frontmatter]
  lastmod = ["last_updated", "lastmod", "date"]

[params.reader]
  enabled = true
  agentExports = true

[params.reader.author]
  name = "derio-net"
  url = "https://github.com/derio-net"

# Agent exports. The catalog is blog-craft's; `llms` is Hextra's own output
# format (it defines it but does not enable it), and the feature's
# home.llms.txt overrides the theme's generic llms.txt with a catalog-first one.
# Do NOT add Hextra's `markdown` format to outputs.page: it also writes
# index.md and would race scripts/export-content.py for the same file.
[outputFormats.Catalog]
  mediaType = "application/json"
  baseName = "content-index"
  isPlainText = true


# Operator-owned discovery links, preserved by blog-craft's three-way merge.
[[menu.main]]
  name = "Topics"
  pageRef = "/topics"
  weight = 4

[[menu.main]]
  name = "About"
  pageRef = "/about"
  weight = 5

# END OF FILE. The file ends inside a [[menu.main]] table: any key appended
# below the About entry silently becomes part of that menu item. Add new
# tables ABOVE the operator-owned menu entries.

# Experimental Codex banner prompts.
#
# These entries document the 16 handoff ideas not selected for the current
# production banners. They are intentionally marked `operator_generated: true`
# so blog/scripts/generate-images.py will skip them. Generate them from Codex,
# not the current Gemini blog-craft path, until blog-craft has an OpenAI/Codex
# banner route with native 3:1 generation, reference images, and hard-gated crops.
#
# Required gate: accept only native 3:1 source sheets. For observed Codex
# 2172x724 outputs, crop to 2169x241 stripes for exact 9:1 banners.
images:
- key: idea-building-1-the-girder
  operator_generated: true
  generator: codex-imagegen
  model: Codex built-in image_gen tool; exact OpenAI backend model is not exposed by the CLI tool
  aspect_ratio: '3:1'
  image_size: native
  output: .regen-archive/idea-building-1-the-girder/idea-building-1-the-girder-openai-native3x1-candidate.png
  description: Experimental Codex 3x9:1 banner sheet candidate for idea-building-1-the-girder.
  codex_generation:
    source_prompt: docs/runbooks/banner-generation-handoff/prompts/idea-building-1-the-girder.txt
    reference_image: .reference-pool/building/reference/frank-work-clothes-hard-hat.png
    source_aspect_ratio: "3:1"
    observed_source_dimensions: 2172x724
    crop_aspect_ratio: "9:1"
    crop_dimensions: 2169x241
    quality_gate: Reject non-3:1 sources; never stretch or squeeze to fit.
  composition:
    reference_images:
      primary: .reference-pool/building/reference/frank-work-clothes-hard-hat.png
    scene: |-
      Create one native 3:1 image sheet composed of three independent horizontal banner stripes stacked top-to-bottom. Each stripe must be a complete standalone ultra-wide 9:1 banner, not a cropped slice of one continuous scene. Use the same basic image in all three stripes with small composition and lighting variations, so each stripe can be reviewed independently.
      
      Each stripe must preserve the scene's full intended composition inside that stripe. Do not stretch, squeeze, letterbox, or pad the artwork. Keep a strong non-Frank horizontal structure spanning the frame so the model does not duplicate Frank to fill space. Show exactly one Frank per stripe unless the scene explicitly says otherwise. No text, no labels, no logos, no watermarks.
      
      Native output target used in Codex: 3:1 source sheet. Observed accepted source dimensions from Codex built-in image_gen: 2172x724. Valid crop recipe from that source: crop each stripe to 2169x241, producing exact 9:1 banners.
      
      Scene for each stripe:
      Frank — a chibi-proportioned green Frankenstein monster. Uneven
      cartoon-green skin with brown / reddish-tan sewn-on patches across the
      cheek and jaw (horizontal stitch lines crossing each; brown against
      green, NOT mechanical implants). Each eye is a solid BLACK circle
      with a single small WHITE pupil-dot — no glow. No nose. Messy black
      flat-top hair with jagged spiky peaks. Thick raised brow ridge, no
      eyebrows. A horizontal stitched scar across the upper forehead with
      a small rectangular RED bandage over it above the right eye. Two
      symmetric RJ45-connector bolts on the temples, each sparking
      faint blue. Hands stitched onto the arms with visible scar lines
      around the wrists. Cartoon illustration, thick outlines, vibrant
      colours.
      
      Dark server-room aesthetic. Deep navy or near-black background;
      studio-style framing rather than a documentary photograph.
      Small flecks of bright white / electric-blue sparks scattered
      through the scene; faint blue glow on metal edges and from any
      small LED indicators in the frame.
      Lighting is a single warm overhead source unless the scene says
      otherwise; soft falloff into deep shadow rather than uniform fill.
      
      The reference images attached to this request are ANCHORS, not subjects to render.
      
      The FIRST reference image is the canonical character-design sheet. Use this to tune the hero's appearance
      
      There is exactly ONE Frank in the final image, regardless of how many reference images show him.
      
      Redraw Frank from scratch in the scene's perspective and lighting; vary his pose, angle, head turn,
      and body language to fit the scene's action.
      
      Frank wears dirty/patched work clothes.
      
      Frank's expression is determined — jaw set, brow level, eyes forward and focused.
      
      Frank strides along a scaffold plank that spans the full width of the ultra-wide frame, carrying a rack-mount server overhead on one shoulder like a steel girder, his other arm out for balance. Behind and below him a half-built server rack rises through the frame — bare frame rails at the left, fully populated and lit at the right, the build visibly progressing across the strip. Sparks drift through the air. Warm work-lamp light from above, deep shadow below. Edges fade into darkness. ABSOLUTELY NO TEXT anywhere in the image — pure illustration only, no words, no title, no labels, no numbers.

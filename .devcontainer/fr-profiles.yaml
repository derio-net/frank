profiles:
  dev:
    purpose: "day-to-day docs/skills/blog/plan work \u2014 checks: cd blog && hugo\
      \ --minify; scripts/validate-plans.sh; uv run scripts/validate-papers.py; uv\
      \ run scripts/validate-dossier.py; uv run pytest scripts/tests/; node scripts/validate-mermaid.mjs"
    secrets:
    - GH_TOKEN
    notes:
    - "tool 'hugo' has no known devcontainer feature \u2014 wired via postCreateCommand (version + sha256 pinned to the CI version in .github/workflows/deploy-blog.yml; bump both together)"
    - "tools 'kustomize' (v5.6.0) and 'helm' (v4.2.0) are likewise wired via postCreateCommand, per-arch sha256-pinned. REQUIRED, not optional: the scripts/tests/ tripwires shell out to 'kustomize build' and 'helm template', and neither is guarded by shutil.which \u2014 so a missing binary is a FAILURE, not a skip, and the failure names the assertion target (a missing secret key, an absent NetworkPolicy) rather than the binary. Without kustomize the suite reported 17 such failures; adding it left 3 more, which were helm. GitHub's ubuntu runners ship both preinstalled, so the host and CI were green throughout and only the devcontainer \u2014 the environment the isolation contract says to run checks in \u2014 was short. Pinned to the operator's host versions; bump together"
    - "GH_TOKEN: use a fine-grained token scoped to derio-net/frank with contents:write + pull_requests:write only \u2014 the dev checks themselves need no token"
    - "python deps come from pyproject.toml + uv.lock, installed by the trailing 'uv sync --group dev --frozen' in postCreateCommand. It is LAST on purpose — the chain is ';'-separated, so the final command's exit status is the step's, and a failed sync fails postCreate loudly. This is why every python check in 'purpose' is 'uv run': pytest and pyyaml live in the project venv, not on PATH. pytest was previously named ONLY inside repo-tripwires.yml's pip install, so this profile prescribed a 'pytest scripts/tests/' that no environment could actually run, and CI was green throughout because CI installed its own copy — the same shape as the kustomize/helm note above, one layer up (there the binary was missing, here the declaration was). '--frozen' makes the lock authoritative: edit pyproject without 'uv lock' and CI fails rather than silently installing something unpinned. Guarded by scripts/tests/test_python_toolchain_single_source.py"
    - "supply-chain: super-fr (fr CLI) is installed from the repo's packages/fr subdirectory (uv tool install git+https://github.com/derio-net/super-fr#subdirectory=packages/fr). postCreate fails LOUDLY by design \u2014 no || true (a silent fr-install failure cost a debugging round on 2026-06-06)"
  cluster-admin:
    purpose: "cluster-touching runs (kubectl/talosctl from inside isolation) \u2014\
      \ non-default, operator-selected only"
    secrets:
    - GH_TOKEN
    - KUBECONFIG_B64
    - TALOSCONFIG_B64
default: dev

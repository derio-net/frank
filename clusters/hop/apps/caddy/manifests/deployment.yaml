apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: caddy-system
  labels:
    app.kubernetes.io/name: caddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
    spec:
      # Recreate + hostPort 80/443 means the old pod must release the ports
      # before the new one binds them, so every roll is a brief PUBLIC EDGE
      # outage. Now that a Caddyfile edit rolls this pod on purpose (see
      # kustomization.yaml), the default 30s grace period would be the dominant
      # term in that outage for no benefit: Caddy handles SIGTERM by draining
      # and exiting promptly, and this serves static pages and short-lived
      # reverse-proxy requests, not long uploads. 5s keeps the window to a few
      # seconds while still allowing an orderly shutdown.
      terminationGracePeriodSeconds: 5
      containers:
        - name: caddy
          image: ghcr.io/derio-net/caddy-cloudflare:2.11.3
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              hostPort: 443
              protocol: TCP
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: caddy-cloudflare
                  key: api-token
            # CrowdSec bouncer API key for the Caddyfile {env.X} interpolation.
            - name: CROWDSEC_BOUNCER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: caddy-crowdsec
                  key: CROWDSEC_BOUNCER_API_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
              httpHeaders:
                - name: Host
                  value: www.derio.net
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data

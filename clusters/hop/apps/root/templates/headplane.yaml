apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headplane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hop-infrastructure
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: clusters/hop/apps/headplane/manifests
  destination:
    server: {{ .Values.destination.server }}
    namespace: headscale-system
  syncPolicy:
    automated:
      # prune: true is required because headplane's config ships via Kustomize
      # configMapGenerator; each edit orphans the previous hash-suffixed ConfigMap.
      # Nothing stateful lives in this app (Deployment, Service, RBAC only), so no
      # per-resource Prune=false exemption is needed.
      #
      # Note this app also MOUNTS headscale-config, owned by the headscale
      # Application. That ConfigMap is not generated here and not pruned by this
      # app — see the headscale exclusion note in kustomization.yaml.
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

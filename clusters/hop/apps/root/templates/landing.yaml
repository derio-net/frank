apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: landing
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hop-infrastructure
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: clusters/hop/apps/landing/manifests
  destination:
    server: {{ .Values.destination.server }}
    namespace: landing-system
  syncPolicy:
    automated:
      # prune: true is required because both landing configs ship via Kustomize
      # configMapGenerator; each edit orphans the previous hash-suffixed ConfigMap.
      # Nothing stateful lives in this app (Deployment, Service only), so no
      # per-resource Prune=false exemption is needed.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

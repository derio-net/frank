apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caddy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hop-infrastructure
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: clusters/hop/apps/caddy/manifests
  destination:
    server: {{ .Values.destination.server }}
    namespace: caddy-system
  syncPolicy:
    automated:
      # prune: true is REQUIRED because the Caddyfile ships via Kustomize
      # configMapGenerator (clusters/hop/apps/caddy/manifests/kustomization.yaml).
      # Every edit renders a NEW hash-suffixed ConfigMap and orphans the old one;
      # without prune they accumulate forever and the app sits permanently
      # OutOfSync — which is how the caddy-config staleness hid in the first place.
      #
      # The caddy-data PVC carries Caddy's ACME certificate store and is exempted
      # with `argocd.argoproj.io/sync-options: Prune=false` on the resource itself.
      # Losing it means re-issuing every public cert into Let's Encrypt rate
      # limits with the edge down. Do not remove that annotation.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data

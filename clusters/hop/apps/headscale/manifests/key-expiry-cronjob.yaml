apiVersion: batch/v1
kind: CronJob
metadata:
  name: headscale-api-key-expiry
  namespace: headscale-system
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: headscale-api-key-expiry
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/name: headscale-api-key-expiry
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
              imagePullPolicy: IfNotPresent
              command: ["python3", "/app/key-expiry-check.py"]
              env:
                - name: API_URL
                  value: http://headscale.headscale-system.svc:8080/api/v1/apikey
                # Keep these aligned with the two deliberately separate consumer keys.
                - name: EXPECTED_PREFIXES
                  value: "8HpmMnl,lTe41sn"
                - name: WARN_DAYS
                  value: "30"
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: headplane-api-key
                      key: api-key
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              resources:
                requests:
                  cpu: 10m
                  memory: 24Mi
                limits:
                  memory: 48Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: headscale-api-key-expiry-script

# Images allowed to carry a tag that is not >=3 numeric components, and stateful-workload images not digest-pinned. Each needs a reason that
# explains why the publisher offers nothing finer. Entries must exist in rendered-images.txt
# (a test fails on stale ones). Everything else must be an exact tag or a digest (spec R2).
exceptions:
  - image: docker.io/library/postgres:17.9-bookworm
    reason: PostgreSQL versions are major.minor (17.9 IS the exact release); chart default.
  - image: ghcr.io/derio-net/openrgb:1.0rc2
    reason: Own image tagged with upstream's pre-release name; immutable, no finer tag exists.
  - image: ghcr.io/derio-net/ovms-retrieval-models:2
    reason: Own image; the tag is the immutable MODELS_REV integer guarded by test_models_rev_moves_when_the_dockerfile_changes.
  - image: arp242/goatcounter:2.7.0
    reason: Stateful workload (PVC) on an exact, unchanged tag or commit; bytes only change when git changes it, and stateful updates go through a snapshot session. Digest pinning is not needed to keep bytes fixed this phase.

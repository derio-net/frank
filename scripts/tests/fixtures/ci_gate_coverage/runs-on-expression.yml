name: expr
on:
  pull_request:
  push:
    branches: [main, "sync-pr-**", "sync-rerun-**"]
jobs:
  check:
    if: (vars.CI_AUTHORITY || 'github') == (github.server_url == 'https://github.com' && 'github' || 'gitea')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - run: make test

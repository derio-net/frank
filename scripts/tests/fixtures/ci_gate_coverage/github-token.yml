name: token
on:
  pull_request:
  push:
    branches: [main, "sync-pr-**", "sync-rerun-**"]
jobs:
  check:
    if: (vars.CI_AUTHORITY || 'github') == (github.server_url == 'https://github.com' && 'github' || 'gitea')
    runs-on: ubuntu-latest
    steps:
      - run: gh pr view 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

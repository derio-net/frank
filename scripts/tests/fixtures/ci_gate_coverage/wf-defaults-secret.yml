name: e
on:
  pull_request:
  push:
    branches: [main, "sync-pr-**", "sync-rerun-**"]
defaults:
  run:
    shell: bash -c "echo ${{ secrets.DEPLOY_KEY }}"
jobs:
  check:
    if: (vars.CI_AUTHORITY || 'github') == (github.server_url == 'https://github.com' && 'github' || 'gitea')
    runs-on: ubuntu-latest
    steps:
      - run: make test

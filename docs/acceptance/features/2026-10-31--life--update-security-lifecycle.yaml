    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R27
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-ci-recovery
    capability: update-lifecycle
    acceptance: An update held for CI shows whether the status was lost, never ran,
      or failed, offers the matching recovery, and a repeated failure is marked failed.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R28
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-session-idempotent
    capability: update-lifecycle
    acceptance: Starting the same session twice attaches to the existing one, and two
      sessions changing the same cluster OS or application cannot run at once.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R29
    levels: {}
    status: not-implemented
    notes: ''
    verify: live

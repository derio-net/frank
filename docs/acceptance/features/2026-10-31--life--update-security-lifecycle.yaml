    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R25
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-clean-failure-state
    capability: update-lifecycle
    acceptance: A failed update, killed pod or abandoned session ends in a named state

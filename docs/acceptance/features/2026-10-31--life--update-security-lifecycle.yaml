    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R24
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-no-credential-leak
    capability: update-lifecycle
    acceptance: No credential appears in logs, transcripts, PR bodies, Telegram or the

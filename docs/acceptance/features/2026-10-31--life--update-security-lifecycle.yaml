# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-10-31--life--update-security-lifecycle
repo: derio-net/frank
rows:
  - id: life-inventory-complete
    capability: update-lifecycle
    acceptance: The console inventory lists every dependency of Frank, Hop and Omni
      (Talos, Kubernetes, Omni, every chart and image, per service) with declared, running
      and latest version, and flags any declared-vs-running mismatch.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R1
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-every-version-pinned
    capability: update-lifecycle
    acceptance: No workload on either cluster runs a :latest or untagged image, and
      Frank, Hop and Omni versions are declared in git.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R2
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-every-dep-has-path
    capability: update-lifecycle
    acceptance: Every dependency has exactly one update path, Renovate detects updates
      for all dependency types, and CI rejects an unclassified dependency.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R4
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-automerge-and-batch
    capability: update-lifecycle
    acceptance: Auto-merge items show their merge time and can be held or merged now;
      routine updates arrive as one editable batch approved with one click.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R6
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-vulns-jump-queue
    capability: update-lifecycle
    acceptance: Vulnerabilities in images running on either cluster are found with severity
      and fix availability, listed first and approvable individually and immediately.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R8
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-telegram-quiet-alarm
    capability: update-lifecycle
    acceptance: 'The derio.net #security topic gets one immediate alarm per new qualifying
      vulnerability, repeated only on a state change, plus one daily report.'
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R10
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-grafana-trend
    capability: update-lifecycle
    acceptance: A Grafana dashboard shows versions-behind and vulnerability counts over
      time per cluster, plus alarm and report state.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R12
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-console-acts-via-forges
    capability: update-lifecycle
    acceptance: The console at updates.cluster.derio.net, behind Authentik, shows Needs
      action, Inventory and History, and its actions change only the forges, never a
      cluster.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R13
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-done-means-verified
    capability: update-lifecycle
    acceptance: An update is shown done only after ArgoCD applied its merge commit and
      the real service's smoke test passed; every app has a smoke test.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R16
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-rollback-and-rollouts
    capability: update-lifecycle
    acceptance: Every update shows its rollback path before approval, and paused or
      aborted Argo Rollouts appear under Needs action and are resolved through a session.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R18
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-disposable-session
    capability: update-lifecycle
    acceptance: Start session launches a locked-down pod with credentials scoped to
      that upgrade, the operator attaches in the browser, and the pod and its credentials
      are gone after it ends.
    origin:
    - spec:2026-10-31--life--update-security-lifecycle#R20
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: life-os-tracks
    capability: update-lifecycle
    acceptance: Frank and Hop OS upgrades are shown as ordered Talos/Kubernetes sequences

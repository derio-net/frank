rows:
  - id: fr-isolation-env-in-pods
    capability: In-pod fr isolation (host-worktree mode)
    acceptance: Agent processes in all four agent-bearing containers (secure-agent-pod
      kali+vk-local, hermes-agent-shell hermes+ssh) observe FR_ISOLATION_TARGET=worktree,
      enabling super-fr host-worktree isolation in-pod.
    origin:
    - spec:2026-07-24--agents--fr-isolation-target-env
    levels: {}
    status: unwired
    notes: Live manual proof 2026-07-24 post-PR#687 roll — kubectl exec in all four
      containers (kali, vk-local, hermes, ssh) printed FR_ISOLATION_TARGET=worktree.
      Guard test scripts/tests/test_fr_isolation_target_env.py pins the manifests in
      CI-less local runs.
  - id: fr-isolation-env-ssh-login
    capability: In-pod fr isolation (host-worktree mode)
    acceptance: Agents logging in over SSH/Mosh on either pod also see FR_ISOLATION_TARGET=worktree
      despite sshd env scrubbing (profile.d re-export shims).
    origin:
    - spec:2026-07-24--agents--fr-isolation-target-env
    levels: {}
    status: unwired
    notes: Live manual proof 2026-07-24 — env -i bash -lc printed worktree on kali (environ-loop
      shim, s6 PID 1, post-#687 roll) and on hermes ssh (static-export shim, PR#689
      + rollout restart; /proc/1/environ is proctitle junk there since sshd is PID 1).
      Guard test pins both shims.

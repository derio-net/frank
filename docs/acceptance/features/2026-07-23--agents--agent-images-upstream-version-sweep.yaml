# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-07-23--agents--agent-images-upstream-version-sweep
repo: derio-net/frank
rows:
  - id: agent-shell-talosctl-cluster-skew
    capability: Agent shells
    acceptance: Operators driving Talos from an agent shell use a talosctl whose version
      is supported against the running cluster, instead of one three minor versions
      behind it.
    origin:
    - spec:2026-07-23--agents--agent-images-upstream-version-sweep
    levels: {}
    status: unwired
    notes: 'VERIFIED LIVE 2026-07-23 — secure-agent-pod kali container (image secure-agent-kali:c7a80f6)
      reports talosctl client Tag: v1.12.6, matching the cluster (all 7 nodes Talos
      v1.12.6). The three-minor skew (was v1.9.5, outside Talos''s supported +/-1) is
      closed. The audit script''s cluster anchor also resolves to v1.12.6 and marks
      the pin ok. Live manual proof; no CI level.'
  - id: agent-shell-sweep-boots-clean
    capability: Agent shells
    acceptance: Every agent shell Frank deploys still boots and serves after the upstream
      version sweep rebuilds it.
    origin:
    - spec:2026-07-23--agents--agent-images-upstream-version-sweep
    levels: {}
    status: unwired
    notes: 'VERIFIED LIVE 2026-07-23 — all rebuilt shells Running on c7a80f6: alert-agent
      (3 multi-agent-shell containers, s6-rc started clean, no crashloop-bail), n8n-01
      (multi-agent-shell sidecar), secure-agent-pod (kali + vk-local 2/2), paperclip
      (paperclip-shell 2/2), ruflo (ruflo-server + ruflo-shell 2/2), hermes-agent-shell
      (hermes + hindsight + ssh 3/3). cnc-base NOT covered: its runner StatefulSet is
      not currently deployed (cnc-prod app OutOfSync/Missing, pre-existing — the manual-login
      persistent agent is down, unrelated to the sweep). Live manual proof.'
  - id: hermes-upgrade-reaches-pod
    capability: Agent shells
    acceptance: A Hermes version bump actually reaches the running shell, rather than
      shipping in the image while the pod keeps serving the old venv off its PVC.
    origin:
    - spec:2026-07-23--agents--agent-images-upstream-version-sweep
    levels: {}
    status: unwired
    notes: 'VERIFIED LIVE 2026-07-23, with a topology correction the live check surfaced.
      The DEPLOYED consumer of the bumped image is the hermes-agent-shell-ssh sidecar
      (built FROM docker v2026.7.20): its running container reports "Hermes Agent v0.19.0
      (2026.7.20)" — the bump reached the pod. TWO nuances the spec''s image->app mapping
      got wrong: (1) the base hermes-agent-shell image (PyPI 0.19.0, the .seed-version
      PVC-venv one this row was written about) is NOT deployed anywhere in frank — same
      status as infra-shell — so its bump is validated by CI smoke only; (2) the pod''s
      runtime "hermes" container is docker.io/nousresearch/hermes-agent:v2026.7.7.2
      (=0.18.2), pinned DIRECTLY in the manifest, NOT a ghcr.io/derio-net/* image, so
      the sweep did not touch it. Consequence: the intent_ack_continuation manual-op
      (frank plan P2.T2.S7) is moot for the current deployment — see the plan note.
      Live manual proof.'
  - id: ruflo-revendor-preserves-function
    capability: Ruflo
    acceptance: Ruflo still serves its UI and handles file upload and download after
      the upstream re-vendor, proving the local GridFS and wasm-scheme patches survived.
    origin:
    - spec:2026-07-23--agents--agent-images-upstream-version-sweep
    levels: {}
    status: unwired
    notes: 'VERIFIED LIVE 2026-07-23 — ruflo Running on ruflo-server:c7a80f6, readiness
      1/1, /api/v2/feature-flags returns valid JSON. Both local patches confirmed present
      in the RUNNING build: the GridFS shim (Readable.from / new Writable) compiled
      into /app/build/server/chunks/database-*.js, and the wasm allow-line in urlSafety-*.js.
      The re-vendor (a6dd4ab->26c35b5) preserved both. package.json version 0.20.0.
      Live manual proof (endpoint + compiled-patch presence); a full authenticated file
      round-trip was not exercised, but the patch code is demonstrably in the artifact.'
  - id: agent-images-pin-drift-measurable
    capability: Agent image maintenance
    acceptance: An operator can re-measure how far every agent-images pin has drifted
      from upstream on demand, without redoing the manual registry-by-registry reconnaissance.
    origin:
    - spec:2026-07-23--agents--agent-images-upstream-version-sweep
    levels: {}
    status: unwired
    notes: VERIFIED LIVE 2026-07-23 — scripts/version_audit.py (agent-images main c7a80f6)
      run against the live cluster reports every bumped pin ok, and its talosctl anchor
      resolves to the cluster's v1.12.6 (not GitHub latest v1.13.7), reading osImage
      "Talos (v1.12.6)". omnictl reports unknown (server version not discoverable from
      the repo — the honest-gap behaviour, by design). On-demand, no scheduled watcher
      (decision d3). Guarded by a test-scripts CI job (43 tests). Live manual proof.

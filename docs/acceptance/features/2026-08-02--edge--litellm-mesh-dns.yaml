# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-08-02--edge--litellm-mesh-dns
repo: derio-net/frank
rows:
  - id: litellm-reachable-from-mesh-by-name
    capability: Edge & mesh access
    acceptance: Frank publishes mesh-resolvable names for LiteLLM, and an authenticated
      API call to them returns a model list rather than being intercepted by the public
      SSO ingress.
    origin:
    - spec:2026-08-02--edge--litellm-mesh-dns
    levels: {}
    status: unwired
    notes: 'PROVEN LIVE 2026-08-02, after manual-op edge-headscale-litellm-mesh-dns-restart.
      DNS, read on a mesh node with all three controls so the homelab wildcard could
      not fake it: gitea-ssh.cluster.derio.net -> 192.168.55.209 (positive control:
      MagicDNS answering and outranking the wildcard), nope-xyz.cluster.derio.net ->
      192.168.55.220 (negative control: the wildcard itself), litellm-lb.cluster.derio.net
      -> 192.168.55.206 (proof: differs from the wildcard, so it can only be the new
      map). Reachability: http://litellm-lb.cluster.derio.net:4000/health/liveliness
      -> 200. Route: https://litellm-api.cluster.derio.net/v1/models -> 401 from LiteLLM
      with a valid wildcard cert (ssl_verify=0), NOT a 302 to Authentik. Authenticated:
      the same URL with the vaulted kid-laptops virtual key -> 200 and a 12-model list
      (mistral-small-24b, gemma-12b, ...), which is the load-bearing check - every other
      result above is satisfied by a LiteLLM that rejects all keys. SSO regression:
      https://litellm.cluster.derio.net/ still 302s to Authentik. Status is skipped
      rather than ci because the proof needs a live mesh node and a real credential;
      the offline half (route shape, no forward-auth) IS ci-guarded under litellm-public-host-keeps-sso.
      The off-LAN foreign-network leg is derio-homelab/kid-laptops'' row laptop-reaches-frank-from-anywhere.'
  - id: litellm-public-host-keeps-sso
    capability: Edge & mesh access
    acceptance: Adding mesh-only API endpoints for LiteLLM does not remove SSO from
      its public hostname, and the mesh endpoints never acquire the forward-auth middleware
      that would break API-key clients.
    origin:
    - spec:2026-08-02--edge--litellm-mesh-dns
    levels:
      unit:
      - frank:scripts/tests/test_headscale_litellm_mesh_dns.py#test_litellm_api_route_has_no_forward_auth
      - frank:scripts/tests/test_headscale_litellm_mesh_dns.py#test_litellm_api_route_keeps_network_middlewares
      - frank:scripts/tests/test_headscale_litellm_mesh_dns.py#test_litellm_public_route_still_has_forward_auth
    status: ci
    notes: 'Implemented phase 2. Both directions asserted, because each failure mode
      is silent in opposite ways: L143 test_litellm_api_route_has_no_forward_auth (the
      API route never acquires forward-auth — if it did, every Bearer-key client would
      get a 302 to Authentik, the exact bug this plan routes around) and L167 test_litellm_public_route_still_has_forward_auth
      (litellm.cluster.derio.net keeps SSO on the admin UI, which someone tidying two
      near-identical routes could strip). L156 additionally holds ip-allowlist + security-headers
      on the API route, so "drop forward-auth" cannot quietly become "drop the network
      guards too". Runs on every PR via .github/workflows/repo-tripwires.yml (pytest
      scripts/tests/, no paths filter). Both guards were mutation-tested rather than
      trusted: L167 passes on unmodified HEAD (it guards a property already true), so
      it was proven to bite by stripping forward-auth from the public route — each mutation
      failed exactly one test and no others.'

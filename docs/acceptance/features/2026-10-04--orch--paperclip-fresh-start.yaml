# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-10-04--orch--paperclip-fresh-start
repo: derio-net/frank
rows:
  - id: paperclip-pure-upstream-pod
    capability: Paperclip fresh start
    acceptance: The Paperclip pod runs only the unmodified upstream v2026.916.1 image
      — one container, no init containers, no Frank agent-CLI installs or adapter config.
    origin:
    - spec:2026-10-04--orch--paperclip-fresh-start#R1
    - spec:2026-10-04--orch--paperclip-fresh-start#R3
    levels:
      unit:
      - frank:scripts/tests/test_paperclip_pure_upstream.py#test_single_container_no_init_containers
      - frank:scripts/tests/test_paperclip_pure_upstream.py#test_image_is_upstream_sha_pin
      - frank:scripts/tests/test_paperclip_pure_upstream.py#test_no_agent_shim_env
      - frank:scripts/tests/test_paperclip_pure_upstream.py#test_no_llm_key_reference
      - frank:scripts/tests/test_paperclip_pure_upstream.py#test_no_shell_shim_objects
      - frank:scripts/tests/test_paperclip_pure_upstream.py#test_deployment_references_no_removed_object
      - frank:scripts/tests/test_paperclip_pure_upstream.py#test_config_trust_proxy_and_announcements
      - frank:scripts/tests/test_paperclip_pure_upstream.py#test_shell_leftovers_gone
    status: ci
    notes: Guarded in CI by scripts/tests/test_paperclip_pure_upstream.py (8 unit tests;
      repo-tripwires.yml runs pytest scripts/tests on every PR, no paths filter). Red
      before the change (6 failures), green after.

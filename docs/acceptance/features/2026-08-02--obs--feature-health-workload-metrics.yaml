# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-08-02--obs--feature-health-workload-metrics
repo: derio-net/frank
rows:
  - id: feature-health-survives-node-reboot
    capability: Feature-health alerting
    acceptance: A control-plane rolling reboot completes without any feature-health
      alert firing for a pod terminated by the reboot.
    origin:
    - spec:2026-08-02--obs--feature-health-workload-metrics
    levels:
      unit:
      - frank:scripts/tests/test_feature_health_workload_metrics.py
    status: not-implemented
    notes: 'Phase 6 live run 2026-08-03 (PR #756, merge b8558529): 39 feature-health
      rules live, ZERO still querying kube_pod_status_ready, and the firing set fell
      25 -> 3 (2 TLS canaries + 1 gpu_timeshare) — the exact muted/by-design baseline.
      STILL not-implemented because the claim is about what happens DURING a control-plane
      roll, and no roll has occurred since the merge. What is proven: the defect class
      is absent from the manifests (CI) and from the live ConfigMap. What is not: that
      a reboot passes quietly. Flips at the next node reboot.'
  - id: feature-health-detects-real-outage
    capability: Feature-health alerting
    acceptance: A workload that loses all available replicas still raises its layer's
      feature-health alert.
    origin:
    - spec:2026-08-02--obs--feature-health-workload-metrics
    levels:
      unit:
      - frank:scripts/tests/test_feature_health_workload_metrics.py
    status: not-implemented
    notes: 'Phase 6 live run 2026-08-03: all 14 expressions return series against live
      VictoriaMetrics, each `or` branch independently, every series carrying workload
      + lowercase kind, every value 0 — the correct quiet state under gt 0 and the permanently-firing
      state under the old lt 1, which is the per-rule polarity proof. STILL not-implemented:
      that proves the queries resolve and are correctly polarised, not that losing replicas
      RAISES the alert. Needs an injected or genuine failure. Known narrowing recorded
      in grafana.md: layer-12 no longer watches the Rollout-managed sympozium-apiserver
      replicas.'
  - id: feature-health-routing-preserved
    capability: Feature-health alerting
    acceptance: The routing-relevant fields of every migrated feature-health alert —
      folder, uid, severity and github_issue — are unchanged by the rewrite, so each
      alert reaches exactly the receivers it reached before.
    origin:
    - spec:2026-08-02--obs--feature-health-workload-metrics
    levels:
      unit:
      - frank:scripts/tests/test_feature_health_workload_metrics.py
    status: ci
    notes: 'CORRECTED at code review. This row previously claimed these alerts route
      to the Health Bridge "only, never to Telegram" — that is FALSE, and it was marked
      status:ci, so CI appeared to prove it. notification-policy-cm.yaml evaluates severity=critical
      -> Telegram (continue:true) and severity=warning -> Telegram (continue:true) BEFORE
      the grafana_folder=feature-health -> Health Bridge route, and none of these rules
      carries an escape-hatch label (gpu_timeshare, health_bridge_only, canary, telegram_direct
      — all of whose routes deliberately sit above the severity routes). So every one
      of them delivers to Telegram AND Health Bridge, and did so before this change
      too. That is why the 2026-08-02 flood was noticed at all. The provable claim is
      the one now stated: routing INPUTS are unchanged. Enforced on every PR by .github/workflows/repo-tripwires.yml
      (pytest scripts/tests/ -q, no paths filter): test_migrated_rules_keep_folder_uid_severity_and_tracker
      pins folder + severity + github_issue for all twelve migrated uids against a captured
      expected-dict (layer-8 was missing from that map until code review — its folder
      and tracker were unpinned), test_every_feature_health_rule_lives_in_the_feature_health_folder
      catches a group-header typo, and test_every_rule_has_a_non_empty_uid_and_uids_are_globally_unique
      catches a uid collision that would stop a rule evaluating at all. Each assertion
      was mutation-checked against a doctored ConfigMap.'
  - id: feature-health-scale-to-zero-guarded
    capability: Feature-health alerting
    acceptance: An unexpectedly scaled-to-0 Deployment raises an alert, while the GPU-timeshared
      and Rollout-managed workloads that sit at 0 by design do not.
    origin:
    - spec:2026-08-02--obs--feature-health-workload-metrics
    levels:
      unit:
      - frank:scripts/tests/test_feature_health_workload_metrics.py
    status: not-implemented
    notes: 'Two-part claim, one part now proven live. PROVEN (2026-08-03, post-merge):
      the by-design workloads do NOT alert — comfyui (gpu-switcher timeshare) and litellm
      (Rollout scaleDown: onsuccess, serving 5/5) both sit at 0 replicas and the shipped
      expr returns 0 series, while the same query with exclusions stripped returns exactly
      those 2, so it is quiet for the right reason rather than by matching nothing.
      NOT PROVEN: that an UNEXPECTED scale-to-0 raises the alert — needs a real one.
      Note the rule sits in Normal (NoData) in the healthy case by construction: its
      expr is a PromQL filter, so ''no series'' IS the healthy state (noDataState: OK).
      The exclusion set is derived in CI from gpu-switcher''s WORKLOADS env var and
      every Rollout workloadRef with scaleDown: onsuccess, so it cannot drift silently.
      Rule carries health_bridge_only: ''true'' — verified present on the live ConfigMap.'

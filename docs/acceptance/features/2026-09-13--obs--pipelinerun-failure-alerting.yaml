# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-09-13--obs--pipelinerun-failure-alerting
repo: derio-net/frank
rows:
  - id: pipelinerun-outcomes-visible
    capability: CI/CD observability
    acceptance: Tekton PipelineRun outcomes are queryable in VictoriaMetrics, broken
      down by pipeline and success/failure.
    origin:
    - spec:2026-09-13--obs--pipelinerun-failure-alerting
    levels:
      unit:
      - frank:scripts/tests/test_pipelinerun_outcome_alerting.py
    status: unwired
    notes: 'Live manual proof 2026-09-14 (post-merge, #797). vmagent target health=up
      job=tekton-pipelines-controller ns=tekton-pipelines, lastError empty. VMSingle
      stores 66 tekton metric names including tekton_pipelines_controller_pipelinerun_duration_seconds_count
      with a pipeline label, queried live per pipeline and status. The cardinality drop
      applied: taskruns_pod_latency_milliseconds is ABSENT from VMSingle. 689 tekton
      series stored against the census prediction of 851 — lower because the controller
      had restarted ~12h earlier and has seen fewer distinct taskruns since, not because
      the scrape is partial. Asserted on the artifacts, not on ArgoCD: tekton-extras
      reported Synced/Healthy at the PRE-merge revision dcb31fe6 while the VMServiceScrape
      did not exist at all, and only a refresh moved it to 8dc7df49.'
  - id: pipeline-total-failure-alerts
    capability: CI/CD observability
    acceptance: A pipeline that runs repeatedly and never succeeds raises an alert that
      reaches the operator within hours.
    origin:
    - spec:2026-09-13--obs--pipelinerun-failure-alerting
    levels:
      unit:
      - frank:scripts/tests/test_pipelinerun_outcome_alerting.py
    status: unwired
    notes: 'Live manual proof 2026-09-14 (post-merge, #797 + #801). Synthetic end-to-end:
      three failing runs of a throwaway pipeline produced counters failed=3 with NO
      success series at all — the genuine-absence case the `unless` exists for, and
      the one `and success == 0` would silently drop. ngalert.sender.router dispatched
      at 10:33:35Z, a 30-minute gap matching `for: 30m` exactly, with zero integration=telegram
      error lines in the window. One passing run wrote the success sample at 11:38:00Z
      and the instance went Normal at 11:38:30Z — cleared by the `unless`, not by the
      24h window expiring, which was the specific behavioural claim. Grafana''s rule
      API then reported state=inactive health=ok. Note the resolve path runs through
      NoData (the instance reads "Normal (NoData)") because `unless` removes the only
      series, so `noDataState: OK` is load-bearing for RESOLUTION on this rule, not
      merely for a quiet startup.'
  - id: critical-pipeline-idle-alerts
    capability: CI/CD observability
    acceptance: A high-cadence pipeline that stops running entirely raises an alert,
      even though it produces no failures to count.
    origin:
    - spec:2026-09-13--obs--pipelinerun-failure-alerting
    levels: {}
    status: not-implemented
    notes: 'Two rules, layer-25-idle-stoa-status-bridge (6h window) and layer-25-idle-github-pull-sync
      (72h window), sized from measured max idle gaps of 0.5h and 15.7h. One rule per
      pipeline is load-bearing: a shared rule with a regex would leave `or vector(0)`
      disarmed for whichever pipeline still has a series. Covers the "live, correct
      and unreachable" trigger failure of 2026-07-26, which produced zero PipelineRuns
      and is therefore invisible to a failure-ratio rule.'

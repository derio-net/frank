# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-06-01--net--frank-derio-net-retire
repo: derio-net/frank
rows:
  - id: net-cluster-domain-canonical
    capability: Canonical cluster service access
    acceptance: Operators can reach and authenticate to every Frank cluster service
      using its cluster.derio.net URL without depending on a legacy frank.derio.net
      route.
    origin:
    - spec:2026-06-01--net--frank-derio-net-retire
    levels:
      unit:
      - frank:scripts/tests/test_frank_domain_retirement.py
    status: unwired
    notes: 'VERIFIED LIVE 2026-08-03 — services remain reachable on *.cluster.derio.net
      now that the legacy frank fallback is gone. Spot-checked argocd.cluster.derio.net
      -> 200, with the *.cluster.derio.net wildcard intact for litellm/harbor/auth/grafana.
      The homelab master dashboard was repointed and redeployed: 15 tiles now target
      *.cluster.derio.net with live siteMonitor probes, omni keeps its preserved name,
      and the Portainer tile plus the rp.frank.derio.net Traefik bookmark are gone.
      CORRECTION worth recording: litellm.cluster.derio.net is the forward-auth admin
      UI and 302s an API client to SSO even with a valid Bearer key — so ''canonical''
      is per-consumer, not per-name. Machine clients use litellm-api.cluster.derio.net
      (no forward-auth, added in frank#749), verified returning LiteLLM''s own 401 on
      /v1/models and resolving via the mesh resolver; kid-laptops and the operator .env
      files moved to it in derio-homelab/kid-laptops#81, with a tripwire against regression.
      BREADTH (2026-08-03, independent re-check): the row claims EVERY service, so the
      single-host spot-check above was widened to a ten-host sweep, all over valid TLS
      (curl ssl_verify_result=0) with the legacy fallback already NXDOMAIN and therefore
      unable to mask a failure — argocd and vk returned HTTP 200; grafana, longhorn,
      hubble, infisical, paperclip, auth, n8n and tekton returned HTTP 302 to Authentik,
      which is the correct forward-auth answer for a browserless client and, per the
      litellm correction above, is a pass for a human consumer rather than a machine
      one.'
  - id: net-oidc-cutover-continuity
    capability: Canonical cluster service access
    acceptance: Existing Kubernetes OIDC credentials continue to authenticate during
      the issuer migration while newly minted credentials use auth.cluster.derio.net.
    origin:
    - spec:2026-06-01--net--frank-derio-net-retire
    levels: {}
    status: unwired
    notes: 'Live manual proof of the dual-issuer overlap. 2026-08-01: an old-issuer
      k8s-agent token retained from before the cutover kept authenticating under authenticator
      A while newly minted tokens carried iss=auth.cluster.derio.net, both normalizing
      to authentik:ak-Kubernetes Agent Access-client_credentials. 2026-08-02T08:51Z
      (T0+14h55m): re-proved by minting through both hosts — legacy iss=auth.frank.derio.net
      and cluster iss=auth.cluster.derio.net, both TokenReview authenticated=true with
      identical normalized identity and groups [system:authenticated], while the Omni
      service-account kubeconfig retained cluster-admin. Provider access_token_validity
      measured at hours=8, so every token issued at or before T0=2026-08-01T17:56:02Z
      expired by 2026-08-02T01:56:02Z. Not automatable in CI: needs a live cluster,
      the Authentik client secret and TokenReview.'
  - id: net-legacy-domain-retired
    capability: Canonical cluster service access
    acceptance: Every non-Omni frank.derio.net service name is removed from application
      configuration, ingress, and DNS after the migration overlap closes.
    origin:
    - spec:2026-06-01--net--frank-derio-net-retire
    levels:
      unit:
      - frank:scripts/tests/test_frank_domain_retirement.py
    status: unwired
    notes: 'VERIFIED LIVE 2026-08-03 — the DNS half this row was waiting on is done.
      derio-homelab/ansible-pihole#1 removed the frank.derio.net wildcard A (192.168.55.220);
      #2 removed the mini-1/2/3.frank.derio.net CNAMEs and the commented future-extension
      block after confirming nothing in any repo referenced them. Both deployed via
      dns.yaml. Measured AFTER deploy: 20 retired names x 3 resolvers = 60/60 NXDOMAIN
      — pihole A (192.168.10.11), pihole B (192.168.10.12), and the Headscale mesh resolver
      (100.100.100.100) from a mesh-joined host, which is the LAN-and-mesh proof this
      row demands and which scripts/tmp/p6-verify.sh explicitly cannot make. auth.frank.derio.net
      specifically stopped resolving to 192.168.55.220, closing the dangling default-cert
      name. The repository half stays CI-guarded by scripts/tests/test_frank_domain_retirement.py;
      the homelab side gained its own tripwire (ansible-homelab-automation/scripts/check-retired-domains.sh,
      wired into `make check`). NOTE: the first dns.yaml run applied a two-commit-stale
      checkout and exited 0 — only re-querying the names caught it, the same family
      as the omnictl-reads-a-local-file gotcha recorded elsewhere in this plan.'
  - id: net-omni-domain-preserved
    capability: Canonical cluster service access
    acceptance: Omni remains reachable and usable at omni.frank.derio.net after all
      other frank.derio.net service names are retired.
    origin:
    - spec:2026-06-01--net--frank-derio-net-retire
    levels:
      unit:
      - frank:scripts/tests/test_frank_domain_retirement.py
    status: unwired
    notes: 'VERIFIED LIVE 2026-08-03 — omni.frank.derio.net survived the wildcard removal
      because an explicit CNAME outlives the wildcard it sat under: it resolves to omni.frank.lan
      -> 192.168.10.30 on BOTH the LAN and the mesh resolver. Omni UI returns 200 with
      a genuine Let''s Encrypt certificate (CN=omni.frank.derio.net, valid to 2026-10-08
      — not a Traefik default cert); discovery returns 200; unauthenticated :8100 returns
      401. Certificate renewal — which upstream required be preserved — is owned by
      proxmox-cluster''s omni-cert-renew systemd timer rather than by Traefik, because
      Omni now runs on the gondor VM with no reverse proxy at all: the timer is active,
      its last run reported Result=success ExecMainStatus=0, and the next run is scheduled.
      p6-verify.sh: 37 pass / 0 fail / 0 pending.'

    capability: alerting
    acceptance: A single missed credential-expiry check does not page the operator,
      while a dead check still pages within about 15 hours, and expiry warnings arrive
      at most once per day per tier.
    origin:
    - spec:2026-10-10--obs--frank-alert-gaps#R4
    levels: {}

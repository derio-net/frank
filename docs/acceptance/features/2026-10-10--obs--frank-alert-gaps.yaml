  - id: obs-pvc-capacity-pages
    capability: alerting
    acceptance: The operator is paged when any persistent volume passes 85% (warning)
      or 95% (critical) of its bytes, or 90% of its inodes, naming the volume, before
      it fills and writes fail.
    origin:

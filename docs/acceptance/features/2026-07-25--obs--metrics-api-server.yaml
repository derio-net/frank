# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-07-25--obs--metrics-api-server
repo: derio-net/frank
rows:
  - id: metrics-api-kubectl-top
    capability: Resource Metrics API
    acceptance: An operator can run 'kubectl top nodes' and 'kubectl top pods -A' and
      see live CPU/memory utilization for all 7 nodes (incl. both raspis) and pods across
      namespaces.
    origin:
    - spec:2026-07-25--obs--metrics-api-server
    levels: {}
    status: unwired
    notes: 'Served by metrics-server (metrics.k8s.io). Live proof 2026-07-25 (PR #699
      merged, root App-of-Apps synced to f530f0dd, metrics-server app Synced): kubectl
      top nodes returned all 7 nodes with live CPU/mem incl. both arm64 raspis (raspi-1
      483m/12%/1663Mi, raspi-2 603m/15%/1861Mi, gpu-1 4785m/14%, mini-1/2/3, pc-1);
      kubectl top pods -A non-empty across namespaces; v1beta1.metrics.k8s.io APIService
      Available=True; metrics-server logs clean (no x509/scrape errors). Live manual
      proof — no CI level (frank does not run kubectl-top in CI).'
  - id: metrics-api-cpu-hpa
    capability: Resource Metrics API
    acceptance: A CPU/memory HorizontalPodAutoscaler can read live utilization (HPA
      TARGETS shows a real percentage, not <unknown>) and act on it.
    origin:
    - spec:2026-07-25--obs--metrics-api-server
    levels: {}
    status: unwired
    notes: 'Live proof 2026-07-25: a throwaway CPU HPA on monitoring/blackbox-exporter
      (idle, 10m CPU request) reported TARGETS resolving from <unknown> to a real 40%/80%
      percentage once the HPA controller queried the Metrics API, proving resource metrics
      feed the HPA control loop; HPA then deleted (no standing HPA ships) and blackbox-exporter
      stayed 1/1 (no scale drift). Live manual proof — no CI level.'

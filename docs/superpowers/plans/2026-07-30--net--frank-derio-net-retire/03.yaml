- number: 1
  title: Extend the domain contract for the overlap state
  steps:
  - id: P3.T1.S1
    text: |
      Extend `scripts/tests/test_frank_domain_retirement.py` with an overlap-state inventory. Require `AUTHENTIK_HOST`, ArgoCD, Grafana, Infisical launch URLs, n8n webhook URL, Paperclip primary host, blackbox probes, Hop landing links, and `references/access.md` to use `.cluster.derio.net`. Explicitly allow `.frank` only in both JWT issuers, legacy callback entries, outage-era compatibility routes, the legacy Paperclip allowlist entry, Omni files, and the Headscale split-DNS suffix. Run the focused test and retain the red inventory.
  - id: P3.T1.S2

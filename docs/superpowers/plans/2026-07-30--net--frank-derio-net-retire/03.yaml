    text: |
      Change `AUTHENTIK_HOST`, ArgoCD external URL and issuer, Grafana root/OAuth URLs, n8n webhook URL, OIDC-provider launch URLs, feature-health probes, Hop landing links, and `references/access.md` to their established `.cluster.derio.net` names. Keep both callback URI sets, both JWT issuers, all temporary `*-frank` IngressRoutes, and the legacy Paperclip allowed hostname until cleanup.
  - id: P3.T2.S2
    text: |
      Run the focused domain test, all existing Authentik/Traefik/OIDC tests, `kubectl apply --dry-run=client -f apps/traefik/manifests/ -o yaml >/dev/null`, `kubectl apply --dry-run=client -f apps/authentik-extras/manifests/ -o yaml >/dev/null`, and `git diff --check`. Require green and confirm no cleanup-only deletion entered PR 2.

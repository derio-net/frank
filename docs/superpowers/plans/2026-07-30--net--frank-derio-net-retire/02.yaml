  - net-oidc-cutover-continuity
  tracking_issue: null
tasks:
- number: 1
  title: Establish recovery and old-token baselines
  steps:
  - id: P2.T1.S1
    text: |
      Resolve or explicitly account for the root ArgoCD drift (`gpu-operator` and `longhorn`). With the Omni service-account kubeconfig, run `kubectl auth can-i '*' '*' --all-namespaces`; require `yes`. Confirm the kubeconfig server is `https://omni.frank.derio.net:8100/` and that it uses an Omni token, not Authentik exec auth.
  - id: P2.T1.S2
    text: |
      Before applying PR 1, mint a direct k8s-agent access token through `auth.frank.derio.net`, store it only in an operator-local 0600 temporary kubeconfig, decode only `iss`, `aud`, `exp`, `preferred_username`, and `groups`, and submit it to TokenReview. Record the preferred username, returned issuer-prefixed username, and groups. Do not commit the token or kubeconfig.
- number: 2
  title: Merge, sync, and apply the dual-issuer ConfigPatch
  steps:
  - id: P2.T2.S1
    text: |
      Merge PR 1, wait for `authentik-extras` to report Synced/Healthy, and query the live ArgoCD, Grafana, and Infisical providers through the Authentik API or read-only Django ORM. Require both old and new strict callbacks before touching kube-apiserver.
  - id: P2.T2.S2
    text: |
      Save the merged legacy ConfigPatch commit SHA as the rollback source, then run `omnictl apply -f patches/phase13-auth/omni-configpatch.yaml`. Watch all three kube-apiserver static pods and `/readyz?verbose`; require continuous quorum and a final `readyz check passed`.
  - id: P2.T2.S3
    text: |
      Inspect each kube-apiserver command. Require one `--authentication-config=/etc/kubernetes/authn-config.yaml`, no `--oidc-*` flags, and the read-only authn-config mount. Re-run TokenReview with the retained old token; require username `authentik:<preferred_username>` and exactly the pre-change groups. Verify the Omni service-account kubeconfig still administers the cluster. On any failure, re-apply the legacy ConfigPatch from the recorded commit and stop.

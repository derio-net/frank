  estimate_lines: 260
tasks:
- number: 1
  title: Guard tests for the template contract (red)
  steps:
  - id: P1.T1.S1
    text: |-
      Write scripts/tests/test_telegram_alert_template.py, loading apps/grafana-alerting/manifests/contact-points-cm.yaml the same way scripts/tests/test_telegram_parse_mode_explicit.py does. Assert: (a) the provisioning doc has a top-level `templates:` list with one entry, orgId 1, name `frank-telegram`, whose `template` text defines `frank.telegram.message`, `frank.telegram.firing` and `frank.telegram.resolved`; (b) the `Telegram - Willikins` receiver's settings.message is exactly `{{ template "frank.telegram.message" . }}` and parse_mode is still `None`; (c) the template text never uses `.Labels.SortedPairs`, `.SilenceURL`, `.ValueString` or `.Annotations.SortedPairs` (R2), and contains no `<b>`, `<i>`, `*` or `_` markup outside template actions (R7); (d) it contains `__alert_rule_uid__%3D`, `/alerting/list`, and the literal header strings `🔥 FIRING · ` and `✅ RESOLVED · `; (e) the identity labels appear in R3's order (namespace, workload, deployment, statefulset, daemonset, cronjob, node, persistentvolumeclaim, pod) and `pod` is only referenced inside a branch that compares `job` against `kube-state-metrics`; (f) the Health Bridge and AI Helper receivers carry no `message` setting (R8). Run `.venv/bin/pytest scripts/tests/test_telegram_alert_template.py -q` (if the worktree has no .venv, `uv run --no-project --with pytest --with pyyaml pytest …`): FAILS.
- number: 2
  title: Template and receiver wiring (green)
  steps:
  - id: P1.T2.S1
    text: |-
      In contact-points-cm.yaml add a `templates:` list before `contactPoints:` with entry `frank-telegram`. It defines `frank.telegram.firing` (header `🔥 FIRING · {{ .Labels.severity }} · {{ .Labels.alertname }}`, then `.Annotations.summary`, then a `Where:` line built per spec R3 only when at least one identity label is present, joined with ` · `, then `Fix: {{ .Annotations.runbook }}` only when set, then `Rule: {{ .GeneratorURL }}`, then `Silence: ` + a URL derived from .GeneratorURL alone with `reReplaceAll "/alerting/grafana/([^/?]+)/view.*" "/alerting/silence/new?alertmanager=grafana&matcher=__alert_rule_uid__%3D$1&orgId=1"` — no root data needed, and it works even though Grafana strips `__`-prefixed labels from .Labels), `frank.telegram.resolved` (one line `✅ RESOLVED · <alertname> — <summary>`), and `frank.telegram.message` (range $i over .Alerts.Firing rendering `frank.telegram.firing` when `lt $i 5`, a blank line between blocks; when `gt (len .Alerts.Firing) 5` append `… {{ len .Alerts.Firing }} firing in total — {{ .ExternalURL }}/alerting/list`; then .Alerts.Resolved one-liners capped at 5 the same way).Trim whitespace with `{{-`/`-}}`. Add `message: '{{ template "frank.telegram.message" . }}'` to the Telegram receiver settings and extend its comment block to say the template lives in the same file and is read at Grafana boot. Run the new test plus test_telegram_parse_mode_explicit.py: both pass.
- number: 3
  title: Render proof against Grafana's own template engine
  steps:
  - id: P1.T3.S1
    text: |-
      Render the template with Grafana's preview endpoint (renders, sends nothing). From the repo root `source .env`, read the admin password from Secret `victoria-metrics-grafana` (key admin-password) in ns monitoring, port-forward or `kubectl exec` into deploy/victoria-metrics-grafana -c grafana and POST to `http://localhost:3000/api/alertmanager/grafana/config/api/v1/templates/test` a body {name: "frank-telegram", template: <the template text>, alerts: [...]} — the template endpoint renders every `define`, so read the `frank.telegram.message` result. Use three alert sets mirroring the operator's example (labels of layer-15-workflows-down, generatorURL `https://grafana.cluster.derio.net/alerting/grafana/layer-15-workflows-down/view?orgId=1`): (1) one firing, (2) one resolved, (3) 7 firing + 2 resolved with distinct workloads, one of them a kube_pod-style alert whose job is NOT kube-state-metrics so the pod branch shows. Save request bodies and rendered outputs under scripts/tmp/telegram-preview/ (git-ignored, host-visible). If the cluster is unreachable, fall back to rendering with the grafana/alerting Go module's templates package at the version vendored by Grafana 12.3.3 in a scratch Go program under scripts/tmp/telegram-preview/go/, and record which path was used.
  - id: P1.T3.S2
    text: |-
      Check the rendered text against R1–R6 line by line: no Value line, no label dump, no stray blank lines or trailing spaces, Where line omits job/instance/service/container/prometheus and omits the KSM pod in set (1), silence link carries exactly one matcher, set (3) shows 5 firing blocks + the total line + 2 resolved one-liners, and set (3)'s total stays under Telegram's 4096-char limit. Fix the template (re-run the T1 tests) until it does, and record the three rendered messages verbatim as a `discovery` in the phase's step record so the PR body carries them.
- number: 4
  title: Refactor and runbook note
  steps:
  - id: P1.T4.S1
    text: |-
      Refactor the template for readability (one `define` per concern, comments via `{{/* */}}` explaining the uid extraction, the KSM pod rule and the total-count line), re-run the T1 tests and the T3 renders: unchanged output. Add a short section to docs/runbooks/frank-gotchas/grafana.md, "Telegram message template", stating: the template lives in contact-points-cm.yaml under `templates:`; it is read at boot, so a merge needs `kubectl -n monitoring rollout restart deploy/victoria-metrics-grafana` after confirming the live ConfigMap content; preview edits with the templates/test endpoint before merging; Grafana's template functions have no arithmetic, which is why the overflow line prints a total. Run the full guard suite `.venv/bin/pytest scripts/tests -q` excluding the hugo-bound blog tests, into a log outside .records: passes.

tasks:
- number: 1
  title: Apply the DNS change to the running control plane
  steps:
  - id: P3.T1.S1
    text: |
      OPERATOR STEP — nothing here is agent-completable; it mutates the live
      Hop control plane after the PR merges.

      `headscale-config` is a plain, unhashed ConfigMap and cannot be converted
      to a Kustomize configMapGenerator: headplane is a separate ArgoCD
      Application that mounts the same ConfigMap by name with
      `config_strict: true`, and Kustomize cannot rewrite a cross-Application
      reference. `scripts/tests/test_config_reaches_the_process.py` already
      records headscale as an explicit exemption for exactly this reason.

      So nothing in the pod spec changes when the ConfigMap content changes:
      ArgoCD will report `Synced`, the ConfigMap will hold both new records,
      and headscale will keep serving the DNS map it parsed at boot —
      indefinitely, with nothing anywhere reporting staleness.

      ```bash
      source .env_hop
      kubectl -n argocd get app headscale \
        -o custom-columns=SYNC:.status.sync.status,HEALTH:.status.health.status
      kubectl -n headscale-system rollout restart deploy/headscale
      kubectl -n headscale-system rollout status deploy/headscale --timeout=180s
      ```

      Existing WireGuard sessions survive this; only the control plane blips.
      A laptop that is offline during the restart picks the new map up on its
      next control-plane poll.
  - id: P3.T1.S2
    text: |
      OPERATOR STEP — verification. Run Test Plan steps 3 through 7 from
      `docs/superpowers/specs/2026-08-02--edge--litellm-mesh-dns-design.md`.

      From the Mac (note: macOS has no `getent`):

      READ THIS BEFORE RUNNING THE DNS CHECKS. Homelab DNS serves a WILDCARD
      `*.cluster.derio.net -> 192.168.55.220` (measured 2026-08-02: the
      impossible name `nope-xyz.cluster.derio.net` resolves to `.220`). So on
      the LAN, `litellm-api -> 192.168.55.220` passes WHETHER OR NOT the record
      exists — it is the wildcard answering, and asserting it proves nothing.
      Only `litellm-lb -> 192.168.55.206` discriminates, because `.206` differs
      from the wildcard and can only have come from MagicDNS.

      Both records sit in one ConfigMap and are loaded by one restart, so
      `litellm-lb` resolving to `.206` proves the restart landed and therefore
      that BOTH records are live. Run the negative control beside it so the
      wildcard is visible rather than assumed:

      ```bash
      dscacheutil -q host -a name nope-xyz.cluster.derio.net      # -> 192.168.55.220  CONTROL (the wildcard)
      dscacheutil -q host -a name litellm-lb.cluster.derio.net    # -> 192.168.55.206  PROOF (differs from control)
      curl -s -o /dev/null -w '%{http_code}\n' http://litellm-lb.cluster.derio.net:4000/health/liveliness   # 200
      curl -s -o /dev/null -w '%{http_code}\n' https://litellm-api.cluster.derio.net/v1/models              # 401, NOT 302
      curl -s -o /dev/null -w '%{http_code}\n' https://litellm.cluster.derio.net/                           # 302 (SSO intact)
      ```

      If the control and `litellm-lb` both return `.220`, the restart did NOT
      take effect — headscale is still serving its boot-time DNS map. Go back to
      P3.T1.S1. (Pre-deployment baseline, for comparison: all four names
      returned `.220`, while the existing `gitea-ssh.cluster.derio.net` already
      returned `.209` — which is what proves MagicDNS outranks the wildcard.)

      The `401` is the load-bearing assertion on the route: it means LiteLLM
      answered, so the request reached it without the outpost intercepting. A
      `302` there means forward-auth leaked onto the new route. A TLS error
      means the wildcard cert did not attach.

      USEFUL DECOUPLING: because the LAN wildcard already points
      `litellm-api.cluster.derio.net` at Traefik, the two `curl` route checks
      above work from the LAN as soon as ArgoCD syncs — BEFORE the headscale
      restart. So the Traefik route and the DNS records can be verified
      independently, and a failure tells you which half is at fault.

      Public `NXDOMAIN` still holds and is worth recording, over DoH rather than
      `dig @1.1.1.1` (the homelab blocks outbound port 53, so that merely times
      out). But note it only shows the zone is private — it does NOT distinguish
      MagicDNS from the homelab wildcard:

      ```bash
      curl -s -H 'accept: application/dns-json' \
        'https://cloudflare-dns.com/dns-query?name=litellm-api.cluster.derio.net&type=A'
      # expect "Status": 3
      ```

      Then flip `litellm-reachable-from-mesh-by-name` to `skipped` with the
      evidence.

      NOTE — there is no CLI verb for this in fr 3.15. `fr acceptance set` does
      not exist (verified: the subcommands are check / report / status /
      summary / add / init / backfill / digest), and `fr acceptance add` is
      append-only — re-adding an existing id errors with
      `duplicate row id: litellm-reachable-from-mesh-by-name` rather than
      upserting. So this one edit is made by hand in
      `docs/acceptance/matrix.yaml`, which is the documented exception to
      "agents never hand-edit YAML shapes":

      - set `status: not-implemented` -> `skipped`
      - replace `notes:` with the evidence actually observed — the two resolved
        IPs, the `200` from litellm-lb, the `401` (not `302`) from litellm-api,
        and the date

      Then validate the edit with `fr acceptance check`, which is the gate that
      catches a malformed row or a broken origin ref.

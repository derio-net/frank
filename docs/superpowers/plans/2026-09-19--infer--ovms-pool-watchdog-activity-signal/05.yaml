tasks:
- number: 1
  title: The repo's usage query measures readiness probes
  steps:
  - id: P5.T1.S1
    text: |
      RED. Add `test_no_doc_recommends_the_probe_dominated_usage_query`: fail if any tracked
      `.md` or `.yaml` recommends `increase(ovms_requests_success`. Expect three hits today -
      `agents/rules/frank-gotchas.md:157`, `docs/runbooks/frank-gotchas/igpu-dra.md:234`, and
      the `--metrics_enable` comment at `apps/ovms-retrieval/manifests/deployment.yaml:219`.
  - id: P5.T1.S2
    text: |
      GREEN. Correct all three to `sum by (name) (increase(ovms_requests_accepted[1d]))`, each
      with one line saying why the obvious series is wrong: `readinessProbe` hits
      `/v2/models/bge-reranker-v2-m3/ready` every 10s, so `ovms_requests_success` reports about
      8,600/day for the reranker whether or not a client exists, while `bge-m3` reads ~0 however
      much real traffic it serves. The query invents usage for one model and hides it for the
      other - which is also why the four-day post-#793 silence was so hard to interpret.
  - id: P5.T1.S3
    text: |
      REFACTOR. Put the full prose in `docs/runbooks/frank-gotchas/igpu-dra.md` and keep the
      hot-file entry to one line, per this repo's hot-file/per-topic split. Confirm the
      existing `test_ovms_retrieval_manifests.py` guard - which fails if any file outside the
      app names the service - still passes.
- number: 2
  title: The incident itself becomes a gotcha
  steps:
  - id: P5.T2.S1
    text: |
      Add the one-liner to `agents/rules/frank-gotchas.md` under the iGPU/DRA section and the
      full prose to `docs/runbooks/frank-gotchas/igpu-dra.md`. Lead with the part that is
      transferable rather than the part that is specific: a CPU-derived busy signal is blind to
      a GPU-offloaded server BY CONSTRUCTION, and an idle clock that survives the restart it
      triggers turns one wrong reading into a restart per tick. Include the log excerpt (five
      `idle-with-elevated-pool` restarts at millicores 4/5/29/41/5) because the decision line
      carrying its own inputs is what made the diagnosis a single query.

      Note the near-miss too: the first fix reached for `ovms_requests_success` and would have
      disabled Rule 2 silently. The blog is deliberately NOT updated - `grep -rl "pool-watchdog"
      blog/content/` is empty, so no published post claims anything this change makes wrong,
      and writing the watchdog's first public description is new-content work, not a fix's
      retro-edit.

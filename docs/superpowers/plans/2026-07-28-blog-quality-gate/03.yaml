tasks:
- number: 1
  title: Gather evidence for the four posts
  steps:
  - id: P3.T1.S1
    text: |
      Gather file:line-cited evidence per post, following the protocol in `blog-craft`'s `agents/post-researcher.md` (locate the code, READ it rather than infer it, cite file:line, mark what must be captured live). REWORDED DURING EXECUTION — this step used to say "dispatch `blog-craft:post-researcher`", which `fr-phase-executor` CANNOT do: its tool grant is Read/Edit/Write/Bash/Grep/Glob with no Agent tool. The failure mode was not a hard stop but silent hollow compliance — an executor reading a step it cannot perform and ticking it anyway. The step now names the OUTCOME, not the mechanism; do the research inline (Phase 2 did, to good effect) or have the orchestrator hand a brief down.
      These four already pass the evidence check, so they HAVE command blocks — the research question is narrower: what would a reader do to verify or recover this layer today? Prefer commands already proven elsewhere in the repo (`docs/runbooks/`, `agents/rules/frank-commands.md`) over inventing new ones.
  - id: P3.T1.S2
    text: |
      Run each candidate command and capture output. For 06-fun-stuff (OpenRGB), check whether the layer has genuine day-to-day operations at all — if it does not, `quality_exempt: novelty layer, no operational surface` is the honest answer and is explicitly allowed. Decide per post, and say which you chose and why.
- number: 2
  title: Write the sections
  steps:
  - id: P3.T2.S1
    text: |
      Add a real actionable section to each of the four (or the exemption decided in P3.T1.S2). Each section: one purpose, real commands, real output, and what the reader should see if it is healthy.
  - id: P3.T2.S2
    text: |
      Run the gate over all posts and confirm these four no longer appear. Run `uv run --frozen pytest` and `cd blog && hugo --buildDrafts` clean.

schema_version: 2
ops:
- id: app-webhooks-permission
  summary: Grant the homelab GitHub App (homelab-fr-automation, 4403773) the Webhooks read/write repository permission, then accept the changed permissions on its derio-homelab installation. A GitHub UI step; the check proves it by minting a hooks-scoped token.
  phase: pre-merge
  interactive: true
  apply: |-
    echo "GitHub > derio-homelab org settings > Developer settings > GitHub Apps > homelab-fr-automation > Permissions > Repository > Webhooks: Read and write > Save; then org Settings > GitHub Apps > homelab-fr-automation > Review request > Accept."
  mutating: true
  undo: |-
    echo "Revoke it: the post-merge op app-webhooks-permission-revoke (homelab-fr-automation > Permissions > Repository > Webhooks: No access > Save)."
  check: |-
    python3 scripts/github_app_token.py --app-id 4403773 --install-id 149345112 --key-secret tekton-pipelines/github-app-homelab-key --repo kid-laptops --perm repository_hooks=write --perm metadata=read >/dev/null
- id: webhook-pull-request
  summary: Add pull_request to the live derio-homelab/kid-laptops GitHub webhook (manual-op cicd-kid-laptops-github-webhook-pull-request). Pre-merge is safe because the live derio-homelab-pr-sync CEL drops kid-laptops events until this PR syncs, and it shortens the window in which kid-laptops PR pushes reach Gitea only by repair.
  phase: pre-merge
  needs: [app-webhooks-permission]
  identities: [homelab-kid-laptops-hooks]
  apply: |-
    gh api -X PATCH repos/derio-homelab/kid-laptops/hooks/657693217 -f 'events[]=push' -f 'events[]=pull_request'
  mutating: true
  check: |-
    gh api repos/derio-homelab/kid-laptops/hooks/657693217 --jq '.events | index("pull_request") != null' | grep -qx true
- id: first-reconcile-backfill
  summary: The first mirror-reconcile run after the tekton sync backfills kid-laptops sync-pr-104/105/139 and fires layer-25-mirror-repair-recurring once (expected one-off, the rule's positive control)
  phase: post-merge
  apply: |-
    echo "Expect: within ~15 min of the tekton sync, 3 kid-laptops sync-pr repairs and one warning page for repo=derio-homelab/kid-laptops; sync-pr-139 starts molecule, so watch pc-1 /var and DinD now."
  mutating: false
  check: |-
    curl -s http://192.168.55.225:9428/select/logsql/stats_query --data-urlencode 'query=_time:6h kubernetes.namespace_name:tekton-pipelines AND kubernetes.container_name:="push" AND _msg:"mirror-reconcile repaired" | extract "mirror-reconcile repaired <repo> " | stats by (repo) count() as value' | grep -q 'derio-homelab/kid-laptops'
- id: molecule-on-pr-head
  summary: The backfilled sync-pr-139 (kid-laptops#139's head carries the sync-pr-** trigger) runs molecule, and #139's head on GitHub carries the gitea-actions molecule status
  phase: post-merge
  identities: [homelab-kid-laptops-statuses]
  apply: |-
    echo "Immediately after merge: watch pc-1 /var and the DinD sidecar during the first full molecule run on sync-pr-139."
  mutating: false
  check: |-
    sha=$(gh api repos/derio-homelab/kid-laptops/pulls/139 --jq .head.sha) && test -n "$sha" && gh api "repos/derio-homelab/kid-laptops/commits/$sha/statuses" --jq '.[].context' | grep -q '^gitea-actions/molecule'
- id: app-webhooks-permission-revoke
  summary: Revoke the homelab App's Webhooks permission once the one-off webhook PATCH is done. The grant is installation-wide (the per-mint narrowing to kid-laptops is not), so while it stands a leak of the PEM in tekton-pipelines could mint hooks:write on every installed derio-homelab repo. A GitHub UI step; the check proves revocation positively.
  phase: post-merge
  needs: [webhook-pull-request]
  interactive: true
  apply: |-
    echo "GitHub > derio-homelab org settings > Developer settings > GitHub Apps > homelab-fr-automation > Permissions > Repository > Webhooks: No access > Save (a reduction needs no org re-approval)."
  mutating: true
  undo: |-
    echo "Re-grant only for another one-off hook change: op app-webhooks-permission."
  check: |-
    python3 scripts/github_app_token.py --app-id 4403773 --install-id 149345112 --key-secret tekton-pipelines/github-app-homelab-key --repo kid-laptops --perm metadata=read >/dev/null && ! python3 scripts/github_app_token.py --app-id 4403773 --install-id 149345112 --key-secret tekton-pipelines/github-app-homelab-key --repo kid-laptops --perm repository_hooks=write --perm metadata=read >/dev/null 2>&1

schema_version: 2
ops:
- id: premerge-speech-image
  summary: The derived speech image exists in GHCR (public) before the Deployment that pins it merges
  phase: pre-merge
  apply: |-
    REV=$(grep -o 'SPEECH_REV: "[^"]*"' .github/workflows/build-speech.yml | cut -d'"' -f2); CT2=$(grep -o 'CTRANSLATE2_VERSION: "[^"]*"' .github/workflows/build-speech.yml | cut -d'"' -f2); echo "On the Intel MacBook, logged in to ghcr.io: docker buildx build --platform linux/amd64 --build-arg CTRANSLATE2_VERSION=$CT2 -t ghcr.io/derio-net/speech:$REV --push apps/speech/docker, then make the package public"
  mutating: true
  check: |-
    docker manifest inspect ghcr.io/derio-net/speech:$(grep -o 'SPEECH_REV: "[^"]*"' .github/workflows/build-speech.yml | cut -d'"' -f2) >/dev/null
- id: premerge-gpu-switcher-image
  summary: The gpu-switcher v0.1.2 image (group support) exists in GHCR before the manifest that pins it merges
  phase: pre-merge
  apply: |-
    echo "Build and push ghcr.io/derio-net/gpu-switcher:v0.1.2 from apps/gpu-switcher/app on the Intel MacBook, then make the package public"
  mutating: true
  check: |-
    docker manifest inspect ghcr.io/derio-net/gpu-switcher:v0.1.2 >/dev/null
- id: postmerge-timeslice-allocatable
  summary: gpu-1 advertises the time-sliced nvidia.com/gpu count after the device plugin rolls
  phase: post-merge
  apply: |-
    kubectl get node gpu-1 -o jsonpath='{.status.allocatable.nvidia\.com/gpu}{"\n"}'
  mutating: false
  check: |-
    test "$(kubectl get node gpu-1 -o jsonpath='{.status.allocatable.nvidia\.com/gpu}')" = 2

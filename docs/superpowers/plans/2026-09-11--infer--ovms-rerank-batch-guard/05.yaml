      `requests.memory` stays `2Gi`. Run; red.
  - id: P5.T1.S2
    text: |
      RED. Add an assertion that the raised ceiling is DOCUMENTED in the manifest
      comment as a deliberate reversal of the parent spec's small-failure-domain
      posture on an etcd member, with the measured peak that justifies it. A
      number in a manifest with no provenance is the thing the next operator
      cannot safely change. Still red.
  - id: P5.T1.S3
    text: |
      GREEN. In `apps/ovms-retrieval/manifests/deployment.yaml`: move the seed
      image to `ghcr.io/derio-net/ovms-retrieval-models:2`, set `MODELS_REV` to
      `"2"`, and raise the `ovms` container's `limits.memory` to `10Gi`. Leave
      `requests` untouched so the scheduler's view of mini-1 does not change.
      Re-run; green.
  - id: P5.T1.S4
    text: |
      GREEN. Write the comment the test now demands, covering: the measured peak
      at 50 documents, the cap and sequence bound now in the graph, and that the
      ceiling is a backstop the workload is no longer expected to reach. Re-run
      the full suite; green.
  - id: P5.T1.S5
    text: |
      REFACTOR. Re-read the two edited files for accidental drift (no stray
      formatting changes, comments still true). Run
      `uv run --frozen pytest scripts/tests -q`; all green. Push.

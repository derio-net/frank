tasks:
- number: 1
  title: 'Wire the injector into the export stage: red, green, refactor'
  steps:
  - id: P4.T1.S1
    text: |
      RED. Extend `scripts/tests/test_ovms_retrieval_model_image.py`: the
      Dockerfile must COPY `inject_rerank_guard.py` into the export stage and run
      it against BOTH exported repositories (`/out/gpu` and `/out/cpu` — the CPU
      control arm must stay a like-for-like comparison), with the N and T measured
      in phase 3. Run the test; red.
  - id: P4.T1.S2
    text: |
      RED. Assert the build VERIFIES its own output rather than trusting the
      rewrite: after injection the Dockerfile must re-read each emitted
      `graph.pbtxt` and fail the build if either field is missing. Assert
      `MODELS_REV` has moved 1 -> 2 in BOTH the Dockerfile ARG default and the
      workflow `env:` — `test_models_rev_moves_when_the_dockerfile_changes` already
      fails a PR that edits the Dockerfile without moving it, so this pins the
      value rather than the discipline. Still red.
  - id: P4.T1.S3
    text: |
      GREEN. Edit `apps/ovms-retrieval/docker/Dockerfile`: COPY the injector into
      the export stage, run it over all four emitted graphs after the
      `export_model.py` invocations, then a verification line (`grep -q` on both
      fields per file, or a second python pass) that exits non-zero on absence.
      Comment WHY the fields are not simply passed to `export_model.py`: its
      `rerank_graph_ov_template` emits only three fields, and `--max_doc_length`
      never reaches the graph at all — it sets the exported tokenizer's
      `model_max_length`. Bump `MODELS_REV` to 2 in both places. Re-run; green.
  - id: P4.T1.S4
    text: |
      GREEN. Run the full suite and push. The build workflow runs on
      `pull_request` for this path (unlike every other build-*.yml in this repo),
      so the PR itself proves the export toolchain still resolves and the
      injection succeeds against real exported graphs — without publishing.
      Confirm that job is green before phase 5 pins the tag.
  - id: P4.T1.S5
    text: |
      REFACTOR. Re-read the Dockerfile's new block as prose: it should explain the
      mechanism (one tensor, batch x longest-document tokens) in a sentence, not
      restate the commands. Run `uv run --frozen pytest scripts/tests -q`; green.

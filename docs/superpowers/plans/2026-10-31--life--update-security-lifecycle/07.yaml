  tag: manual
  depends_on:
  - 6
  tracking_issue: null
  acceptance:
  - life-working-at-handover
  - life-clean-failure-state
  - life-ci-recovery
tasks:
- number: 1
  title: Bootstrap secrets and accounts (operator)
  steps:
  - id: P7.T1.S1
    text: |-
      Run the spec's `life-telegram-derio-net-group` manual operation (Telegram group derio.net, #security topic, @frank_updater_bot, three Infisical keys).
  - id: P7.T1.S2
    text: |-
      Create two GitHub Apps (renovate: contents/PRs/issues RW on derio-net/frank; console: PRs RW + statuses RW + issues RW + webhooks redeliver on derio-net/frank) and a session App (contents/PRs RW on frank only); apply each PEM via SOPS into the CONSUMER namespace (renovate, cluster-update-fr, upgrade-sessions). Then replace the PENDING-MANUAL-PHASE appID/installID in apps/renovate/manifests/clustergenerator.yaml and the RENOVATE_GIT_AUTHOR placeholders in cronjob.yaml (form `<app-slug>[bot] <<app-id>+<app-slug>[bot]@users.noreply.github.com>`, verify live), and set the Renovate CronJob `suspend: false` in the same commit (a test pins suspend to the placeholder state). Create a Gitea token limited to Actions on the frank mirror. Mint a Hop read-only ServiceAccount kubeconfig, an Omni Reader SA and an Omni upgrade SA; the Headscale frank-updater pre-auth key (reusable + ephemeral + pre-tagged tag:frank-updater, short expiry, rotated; a daily CronJob registers a fresh node each run, so single-use cannot work) under the dedicated user tag-admin, plus the trivy token Secrets (trivy-operator-trivy-config and trivy-server-token). Apply all via SOPS; record each as a manual-operation block in this phase's prose and run /sync-runbook.
  - id: P7.T1.S3
    text: |-
      Assign the two new Authentik proxy providers (updates, sessions) to the embedded outpost (frank-argocd.md Django ORM step). Run the Headscale manual operations IN ORDER (see the `life-hop-headscale-*` blocks in _prose.md): create user tag-admin; mint the reusable ephemeral tagged key under it; tag hop-1 tag:hop-node; THEN `kubectl -n headscale-system rollout restart deploy/headscale`, gated on live ConfigMap content.
  - id: P7.T1.S4
    text: |-
      Create a GitHub repository ruleset on derio-net/frank targeting branches renovate/** and cluster-update/**: restrict creations, updates and deletions so only the Renovate App and the console App are bypass actors; require signed commits on those branches. Verify by attempting a push to renovate/test from a personal account (must be refused), then delete the test branch if it exists.
- number: 2
  title: Merge order (operator)
  steps:
  - id: P7.T2.S1
    text: |-
      Before merging frank: delete the completed Jobs whose pod template this PR changes (plan journal entry p1-job-immutability, e.g. vk-remote postgres-init and cnc-prod snapshot-job) so ArgoCD can sync the new template; expect the restarts in p1-restart-list and verify each live image afterwards with kubectl (status.containerStatuses imageID), not ArgoCD Synced.
  - id: P7.T2.S2
    text: |-
      Merge in this order: agent-images (session image published, GHCR public) → cluster-update-fr (v0.1.0 tag, GHCR package set public on first publish) → this frank PR. Confirm each image exists and is public before the next merge.
- number: 3
  title: Live handover (operator, with the console)
  steps:
  - id: P7.T3.S1
    text: |-
      After ArgoCD applies the merge SHA (operationState, not Synced) for every new app: confirm a test alarm reaches derio.net → #security only; a real auto-merge completes and verifies; a batch is approved and verifies; a security item is approved alone; a session upgrades one stateful app (snapshot taken first) and is cleaned up; one OS step on Frank and one on Hop complete and verify; a deliberately killed session ends in a named state; a held-for-CI item is recovered from the console. Flip the matching acceptance rows with evidence.
  - id: P7.T3.S2
    text: |-
      Post-Deploy checklist: building + operating blog posts (/blog-craft:blog-post), add layer 22 `life` to docs/layers.yaml consumers (blog/data/roadmap.yaml, layer palette), /update-readme, /sync-runbook, plan Status → Deployed.

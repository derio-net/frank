  completion:
    at: '2026-08-02T22:09:20+00:00'
    note: >-
      Acceptance row `feature-health-survives-node-reboot` stays
      `not-implemented`, deliberately. It reads "a control-plane rolling reboot
      completes without any feature-health alert firing for a terminated pod" —
      a live-behaviour claim no static test can earn. These rules are not on the
      cluster yet (ArgoCD syncs from main; this is a PR branch), and settling it
      needs an actual node reboot observed against the reloaded Grafana. Phase 6
      is the manual phase that owns flipping the acceptance rows, and this is
      its work. Phase 3 did what it can toward it: all 12 rules now count
      replicas instead of pod readiness, so no tombstone can reach them, and the
      three DaemonSet-bearing rules wait 15m to absorb the drain itself (the
      2026-08-02 roll took ~7 minutes). Every rewritten expr was queried live and
      returns series valued 0 on a healthy cluster — the correct quiet state
      under `gt 0`, where the old `lt 1` readings would have fired all four
      permanently.

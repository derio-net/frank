tasks:
- number: 1
  title: Operator-gated cluster + forge wiring (post-merge)
  steps:
  - id: P11.T1.S1
    text: |
      (manual) PREFLIGHT (proves C1's NetworkPolicy and C2's SAN fix together, BEFORE
      registering anything): from a throwaway pod in `tekton-pipelines` (or a
      port-forward), confirm the syncer cert actually carries the gate-kubeconfig
      hostname as a SAN (`openssl s_client -connect staging.vcluster-staging:443
      -servername staging.vcluster-staging </dev/null | openssl x509 -noout -ext
      subjectAltName` -- expect `staging.vcluster-staging` in the list), then fetch
      and use the gate's own kubeconfig from inside the cluster (`kubectl -n
      vcluster-staging get secret vc-staging-gate -o jsonpath='{.data.config}' |
      base64 -d > /tmp/vc.kubeconfig && kubectl --kubeconfig=/tmp/vc.kubeconfig get
      ns`) -- that single command only succeeds if BOTH the C1 NetworkPolicy (the
      pod can reach the vCluster API on 8443) and the C2 SAN fix (TLS verification
      against that hostname passes) hold. Only then confirm the argo-cd#26529
      exclusion is LIVE: `kubectl -n argocd get cm argocd-cm -o jsonpath='{.data.resource\.exclusions}' | grep staging.vcluster-staging`, then `kubectl -n argocd rollout restart statefulset/argocd-application-controller` and wait Ready. Only then register: build `cluster-staging` in `argocd` from the LIVE `vc-staging` Secret (label `argocd.argoproj.io/secret-type=cluster`, `name: staging`, `server: https://staging.vcluster-staging.svc:443`, `tlsClientConfig` from the kubeconfig's client cert/key, `insecure: true` like cnc-staging -- the `.svc` form is fine here specifically BECAUSE `insecure: true` skips hostname verification; it is the gate's OWN kubeconfig, verified above, that needed the SAN fix) with a script under `scripts/tmp/`, never storing the key in git. Verify: controller logs carry no `assignment to entry in nil map` across one more controller restart; `runs-fr-staging` goes Synced/Healthy. Recovery: `kubectl delete secret cluster-staging -n argocd` + delete the controller pod, then STOP.

      ## Manual Operations

      ```yaml
      # manual-operation
      id: cicd-staging-gate-register-vcluster
      layer: cicd
      app: staging-gate
      plan: docs/superpowers/plans/2026-06-15-staging-vcluster-gate
      when: "Post-merge, AFTER argocd-cm carries the staging.vcluster-staging exclusion and the application-controller has restarted"
      why_manual: "The ArgoCD cluster Secret embeds the vCluster admin client key; it is generated from the live vc-staging Secret and must never be ArgoCD-managed or stored in git. Registering before the exclusion is live re-triggers the argo-cd#26529 cluster-wide controller panic. The preflight commands are here too, ahead of registration, because they prove the C1 NetworkPolicy and C2 SAN fix hold BEFORE the gate's first real run depends on them."
      commands:
        - kubectl -n tekton-pipelines run staging-gate-preflight --rm -it --restart=Never --image=alpine/openssl -- sh -c "openssl s_client -connect staging.vcluster-staging:443 -servername staging.vcluster-staging </dev/null 2>/dev/null | openssl x509 -noout -ext subjectAltName"   # expect staging.vcluster-staging in the SAN list -- proves C2
        - kubectl -n tekton-pipelines run staging-gate-preflight-2 --rm -it --restart=Never --image=bitnamilegacy/kubectl:1.33.4 -- sh -c "kubectl -n vcluster-staging get secret vc-staging-gate -o jsonpath='{.data.config}' | base64 -d > /tmp/vc.kubeconfig && kubectl --kubeconfig=/tmp/vc.kubeconfig get ns"   # single command proves C1 (netpol reachability) + C2 (SAN/cert) together
        - kubectl -n argocd get cm argocd-cm -o jsonpath='{.data.resource\.exclusions}' | grep -q staging.vcluster-staging
        - kubectl -n argocd rollout restart statefulset/argocd-application-controller && kubectl -n argocd rollout status statefulset/argocd-application-controller
        - bash scripts/tmp/register-staging-vcluster.sh   # builds cluster-staging from vc-staging (name staging, server https://staging.vcluster-staging.svc:443, insecure true)
      verify:
        - kubectl -n argocd logs statefulset/argocd-application-controller --since=10m | grep -c 'assignment to entry in nil map'   # expect 0
        - kubectl -n argocd get application runs-fr-staging -o custom-columns=SYNC:.status.sync.status,HEALTH:.status.health.status
      status: pending
      ```
  - id: P11.T1.S2
    text: |
      (manual) Delivery path: seed Infisical `/derio-net/GITHUB_WEBHOOK_SECRET`; force-sync `derio-net-github-webhook-secret`; create the runs-fr GitHub webhook (event `repository_dispatch` only, content-type JSON, same secret, URL `https://webhooks.hop.derio.net/`); make GHCR package `runs-fr-smoke` PUBLIC (a first push creates it private); copy the derio-fr-automation App PEM into `argocd` for the runs-fr repository credential and force-sync it; merge the runs-fr `trigger-gate` permissions PR. Verify: `argocd repo list` shows runs-fr successful; the webhook's recent delivery returns 202.

      ## Manual Operations

      ```yaml
      # manual-operation
      id: cicd-staging-gate-runs-fr-webhook
      layer: cicd
      app: staging-gate
      plan: docs/superpowers/plans/2026-06-15-staging-vcluster-gate
      when: "Post-merge, before merging the runs-fr trigger-gate permissions PR"
      why_manual: "GitHub webhooks and Infisical values are forge/secret-store state with no IaC in this repo; the HMAC value must be generated once and set identically in both places."
      commands:
        - "Infisical: create /derio-net/GITHUB_WEBHOOK_SECRET (openssl rand -hex 32)"
        - kubectl -n tekton-pipelines annotate externalsecret derio-net-github-webhook-secret force-sync=$(date +%s) --overwrite
        - "GitHub derio-net/runs-fr → Settings → Webhooks: URL https://webhooks.hop.derio.net/, JSON, same secret, events: repository_dispatch only"
      verify:
        - kubectl -n tekton-pipelines get externalsecret derio-net-github-webhook-secret -o jsonpath='{.status.conditions[0].reason}'   # SecretSynced
        - env -u GITHUB_TOKEN gh api repos/derio-net/runs-fr/hooks --jq '.[]|{url:.config.url,events}'
      status: pending
      ```

      ```yaml
      # manual-operation
      id: cicd-staging-gate-argocd-runs-fr-repo-key
      layer: cicd
      app: staging-gate
      plan: docs/superpowers/plans/2026-06-15-staging-vcluster-gate
      when: "Post-merge, before registering the staging vCluster"
      why_manual: "ESO resolves the GithubAccessToken generator's privateKey.secretRef in the CONSUMER namespace, so the derio-fr-automation PEM must exist in argocd; the PEM is a bootstrap credential applied out-of-band."
      commands:
        # Commit a per-namespace SOPS copy (same pattern as github-app-derio-key-tekton.yaml).
        # metadata is plaintext under the .sops.yaml encrypted_regex, so it is re-namespaced
        # before re-encryption; the PEM never lands on disk decrypted.
        - sops --decrypt secrets/github-app/github-app-derio-key-tekton.yaml | yq '.metadata.namespace = "argocd"' | sops --encrypt --input-type yaml --output-type yaml --filename-override secrets/github-app/github-app-derio-key-argocd.yaml /dev/stdin > secrets/github-app/github-app-derio-key-argocd.yaml
        - sops --decrypt secrets/github-app/github-app-derio-key-argocd.yaml | kubectl apply -f -
        - kubectl -n argocd annotate externalsecret repo-runs-fr force-sync=$(date +%s) --overwrite
      verify:
        - env -u GITHUB_TOKEN gh api orgs/derio-net/installations --jq '.installations[]|select(.id==138773908)|.repository_selection'   # expect all (or runs-fr in the selected list)
        - kubectl -n argocd get externalsecret repo-runs-fr -o jsonpath='{.status.conditions[0].reason}'   # expect SecretSynced
        - argocd repo list --port-forward --port-forward-namespace argocd | grep runs-fr   # expect Successful
      status: pending
      ```

      ```yaml
      # manual-operation
      id: cicd-staging-gate-smoke-package-public
      layer: cicd
      app: staging-gate
      plan: docs/superpowers/plans/2026-06-15-staging-vcluster-gate
      when: "Post-merge, before the first gate run"
      why_manual: "GHCR package visibility is UI-only for org container packages; a first push creates the package private."
      commands:
        - "github.com/orgs/derio-net/packages/container/runs-fr-smoke/settings → Change visibility → Public"
      verify:
        - "curl the anonymous ghcr.io token + manifest for derio-net/runs-fr-smoke:sha-<short> → HTTP 200"
      status: pending
      ```
  - id: P11.T1.S3
    text: |
      (agent, post-merge) GREEN path: a real runs-fr `main` merge → `staging-gate-runs-fr-*` PipelineRun → runs-fr-staging runs `sha-<short>` in the vCluster → run-smoke Succeeded → a `gate: last-green runs-fr sha-<short>` commit on frank `main` and `apps/staging-gate/runs-fr/promoted.yaml` names that sha → reset deleted the smoke ns. Evidence: PipelineRun name + TaskRun statuses + the commit SHA, recorded on the PR and flipping acceptance row `staging-gate-green-records-last-green`.
  - id: P11.T1.S4
    text: |
      (agent, post-merge) RED path: dispatch a sha whose smoke image fails (e.g. a runs-fr branch commit that forces `smoke.py` to exit 1, built by `build.yml` on a throwaway ref, or a manual `repository_dispatch` naming a smoke tag known to fail) → run-smoke Failed, promote skipped, `promoted.yaml` unchanged, Telegram message received. Evidence recorded on the PR; flip `staging-gate-red-blocks-and-notifies` and `staging-gate-registration-keeps-argocd-up`.

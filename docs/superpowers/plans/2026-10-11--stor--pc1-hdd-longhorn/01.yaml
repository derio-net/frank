  - stor-hdd-pool-isolated
  - stor-ci-workspaces-on-hdd
  tier: standard
  files:
  - patches/phase03-longhorn/**
  - apps/longhorn/values.yaml
  - apps/longhorn/manifests/storageclass-longhorn-hdd.yaml
  - apps/longhorn/manifests/storageclass-longhorn-cicd.yaml
  - apps/tekton/triggers/eventlistener-github.yaml
  - apps/tekton/triggers/kid-laptops-ci.yaml
  - apps/tekton/triggers/triggertemplate.yaml

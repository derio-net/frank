schema_version: 2
ops:
- id: premerge-namespaces
  summary: Every namespace the generated RoleBindings name exists on the live cluster
  phase: pre-merge
  apply: |-
    bash scripts/root-agents-cutover.sh namespaces
  mutating: false
  check: |-
    bash scripts/root-agents-cutover.sh namespaces >/dev/null
- id: cutover-move-membership
  summary: Move claude-agent from root-admins to root-agents in Authentik (add first, then remove)
  phase: post-merge
  apply: |-
    bash scripts/root-agents-cutover.sh move-membership
  mutating: true
  check: |-
    bash scripts/root-agents-cutover.sh membership
- id: cutover-delete-binding
  summary: Delete the old authentik-root-agents cluster-admin binding (prune is false, so git alone leaves it live)
  phase: post-merge
  apply: |-
    kubectl delete clusterrolebinding authentik-root-agents --ignore-not-found
  mutating: true
  check: |-
    ! kubectl get clusterrolebinding authentik-root-agents
- id: cutover-exclude-credential-namespaces
  summary: Delete the five root-agents-ns-read RoleBindings in the credential-store namespaces (PR 991 dropped them from git; prune is false)
  phase: post-merge
  needs: [cutover-delete-binding]
  apply: |-
    for ns in authentik infisical argocd kube-system longhorn-system; do kubectl -n "$ns" delete rolebinding root-agents-ns-read --ignore-not-found; done
  mutating: true
  check: |-
    for ns in authentik infisical argocd kube-system longhorn-system; do ! kubectl -n "$ns" get rolebinding root-agents-ns-read >/dev/null 2>&1 || exit 1; done
- id: cutover-matrix-after
  summary: SubjectAccessReview matrix AFTER the cutover meets every expectation
  phase: post-merge
  needs: [cutover-delete-binding, cutover-exclude-credential-namespaces]
  apply: |-
    bash scripts/root-agents-cutover.sh matrix
  mutating: false
  check: |-
    bash scripts/root-agents-cutover.sh verify

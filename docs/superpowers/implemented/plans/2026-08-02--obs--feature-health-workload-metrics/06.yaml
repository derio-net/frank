tasks:
- number: 1
  title: Post-merge verification (operator-driven)
  steps:
  - id: P6.T1.S1
    text: |
      Unimplemented by design — this phase runs AFTER the PR merges, against the
      live cluster, and the operator pushes its completion to the same PR
      (`fr plan complete-phase 6 --note ...`).

      ```yaml
      # manual-operation
      id: obs-feature-health-workload-metrics-reload
      layer: obs
      app: grafana-alerting
      plan: 2026-08-02--obs--feature-health-workload-metrics
      when: After the PR merges and ArgoCD syncs the alert-rules ConfigMap.
      why_manual: |
        Grafana reads file-provisioned alert rules AT BOOT and does not watch them.
        ArgoCD reporting Synced/Healthy proves the ConfigMap changed, NOT that
        Grafana is evaluating the new rules — the pod must be restarted.
      commands:
        - kubectl -n argocd get app grafana-alerting -o custom-columns=SYNC:.status.sync.status,HEALTH:.status.health.status
        - kubectl -n monitoring rollout restart deploy/victoria-metrics-grafana
        - kubectl -n monitoring rollout status deploy/victoria-metrics-grafana --timeout=180s
      verify: |
        PW=$(kubectl -n monitoring get secret victoria-metrics-grafana -o jsonpath='{.data.admin-password}' | base64 -d)
        curl -s -u "admin:$PW" http://192.168.55.203/api/prometheus/grafana/api/v1/alerts
        # 1. zero feature-health rules in state "Normal (NoData)"  <- catches a typo'd metric
        # 2. firing set == the 3-alert baseline: 2 TLS cert canaries + 1 gpu_timeshare probe
        # 3. no rule references kube_pod_status_ready
        # 4. workload-unexpectedly-scaled-to-zero is NOT firing (comfyui + litellm excluded)
      status: pending
      ```

      Run `/sync-runbook` after this block lands so
      `docs/runbooks/manual-operations.yaml` picks it up.
  - id: P6.T1.S2
    text: |
      Set the spec's `**Status:**` to `Deployed`, flip the four acceptance rows
      from `not-implemented` to their earned status, and close out.

      Note the honest limit on row `feature-health-survives-node-reboot`: it is
      only fully proven at the NEXT node reboot. Until then its evidence is the CI
      tripwire plus the absence of tombstone-driven alerts — record that in the
      row's notes rather than claiming a live proof that has not happened.

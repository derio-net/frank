schema_version: 2
phase:
  number: 1
  title: Tier config, gate-coverage checker and the ci-budget app skeleton
  tag: agentic
  depends_on: []
  tracking_issue: null
  acceptance:
  - tier-config-declares-repo-tiers
  - gate-coverage-checker-flags-gaps
  skeleton: true
  tier: standard
  files:
  - apps/ci-budget/**
  - apps/root/templates/ci-budget.yaml
  - apps/gitea-runner/manifests/files/config.yaml

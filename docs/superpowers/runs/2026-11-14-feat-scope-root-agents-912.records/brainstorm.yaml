    capability: cluster-access
    acceptance: No member of the root-agents group can read Secrets in any namespace, and none can reach upgrade-sessions, cluster-update-fr or runs-fr.
    origin: ["frank:docs/superpowers/specs/2026-11-14--auth--root-agents-least-privilege-design.md#R2"]
    status: not-implemented
    verify: live
  - id: root-agents-read-only-triage
    capability: cluster-access
    acceptance: A member of root-agents can still read cluster state (nodes, workloads, ConfigMaps) in every app namespace except the protected three, and can change nothing.
    origin: ["frank:docs/superpowers/specs/2026-11-14--auth--root-agents-least-privilege-design.md#R1"]
    status: not-implemented
    verify: live
  - id: no-ai-agent-cluster-admin
    capability: cluster-access
    acceptance: No AI-agent identity holds cluster-admin, and the old authentik-root-agents cluster-admin binding no longer exists.
    origin: ["frank:docs/superpowers/specs/2026-11-14--auth--root-agents-least-privilege-design.md#R4"]
    status: not-implemented
    verify: live

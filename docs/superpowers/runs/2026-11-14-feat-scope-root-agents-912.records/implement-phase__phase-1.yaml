journal:
  - {kind: discovery, id: p1-venv-linux, phase: 1, title: "The worktree .venv is a Linux container venv", body: "The worktree .venv/bin/python points at a linux interpreter, so it cannot run on the host. Tests ran via `fr isolation exec --branch feat/scope-root-agents-912 -- .venv/bin/python -m pytest`, and every shell command had to lead with `cd <worktree>` or the fr guard refuses it."}
  - {kind: discovery, id: p1-sa-secret-readers, phase: 1, title: "Vendored Tekton controllers legitimately read Secrets cluster-wide", body: "The R7 guard (any ServiceAccount outside the allowlist that can read Secrets in a protected namespace) flagged the vendored Tekton controllers, resolvers, webhook, core-interceptors and tekton-triggers-sa, whose ClusterRoles grant Secret reads. They are platform controllers, not agent identities, so each is in the guard's SA_ALLOWLIST with a reason. Narrowing them means forking apps/tekton/vendor."}
  - {kind: discovery, id: p1-token-review-env, phase: 1, title: ".env_agent variable names are unknown to the script", body: "No file in the repo records the variable names inside .env_agent (the k8s-agent kubeconfig uses an exec plugin). token-review therefore mints via client_credentials and reads K8S_AGENT_CLIENT_SECRET (required), K8S_AGENT_CLIENT_ID (default k8s-agent) and K8S_AGENT_TOKEN_URL (default https://auth.cluster.derio.net/application/o/token/) from the environment. The operator must export the secret from .env_agent before the op. The token travels curl -> python -> kubectl on pipes only, and only status.user.groups is printed. Untested against live Authentik; only against a fake kubectl and curl."}
  - {kind: discovery, id: p1-live-ns, phase: 1, title: "Every generated namespace exists live", body: "Read-only `kubectl get ns` against Frank: 44 live namespaces; none of the 35 generated root-agents-rbac namespaces is missing, so the RoleBinding sync will not fail on an absent namespace. The three manifests pass `kubectl create --dry-run=client`."}
  - {kind: discovery, id: p1-docs-check, phase: 1, title: "fr docs check does not apply", body: "The repo has no .fr/docs.yaml, so `fr docs check` reports nothing to check; the blog page was still updated by hand (role table and the deliberate-decision paragraph)."}
  - {kind: discovery, id: p1-suite-scope, phase: 1, title: "Suite excluded five hugo-related test files", body: "Full suite run excluded test_image_optimization_adoption, test_series_index_adoption, test_series_index_resync, test_mermaid_bundle_pinned and test_blog_ci_at_repo_root. Result: 2379 passed, 17 skipped, exit 0 (the cel-python admission tests may skip on this interpreter and run in CI)."}

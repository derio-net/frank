schema_version: 10
run: 2026-10-21-feat-obs-telegram-alert-brevity
step: brainstorm
outcome: done
questions: {rounds: 1}
journal:
  - kind: discovery
    id: operator-brief
    input: true
    title: Operator brief (verbatim)
    body: |
      (probably the "light" variation). The Grafana notifications in Frank C&C Telegram bot are
      unnecessarily verbose. Let's tighten them up. They need to be undesrtandable and actionable.
      Example: **Resolved**

      Value: A=0, B=0, C=0
      Labels:
       - alertname = Layer 15 Agentic Workflows Degraded
       - container = kube-state-metrics
       - deployment = n8n-01
       - endpoint = http
       - github_issue = frank-ops#15
       - grafana_folder = feature-health
       - instance = 10.244.12.53:8080
       - job = kube-state-metrics
       - kind = deployment
       - namespace = n8n-01
       - pod = victoria-metrics-kube-state-metrics-855b9df945-zxn26
       - prometheus = monitoring/victoria-metrics-victoria-metrics-k8s-stack
       - service = victoria-metrics-kube-state-metrics
       - severity = warning
       - workload = n8n-01
      Annotations:
       - runbook = kubectl -n n8n-01 rollout status deployment/n8n-01; kubectl -n n8n-01 describe deployment/n8n-01
       - summary = L15 Workflows: n8n-01/deployment/n8n-01 has 0 replica(s) unavailable
      Source: https://grafana.cluster.derio.net/alerting/grafana/layer-15-workflows-down/view?orgId=1
      Silence: https://grafana.cluster.derio.net/alerting/silence/new?alertmanager=grafana&matcher=__alert_rule_uid__%3Dlayer-15-workflows-down&matcher=container%3Dkube-state-metrics&... (all 15 labels as matchers)&orgId=1
  - kind: decision
    id: firing-body
    title: Firing body = compact + identity labels
    body: "Operator chose 'Compact + identity labels' over compact-only and minimal: header, summary, Where: (identity labels only), Fix: runbook, Rule and Silence links. decider: operator. Spec R1-R3."
  - kind: decision
    id: resolved-oneline
    title: Resolved = one line
    body: "Operator chose a one-line resolved message over reusing the firing layout or disabling resolved messages. decider: operator. Spec R4."
  - kind: decision
    id: silence-rule-scoped
    title: Silence link scoped to the rule UID only
    body: "Operator chose a short rule-scoped silence link over instance-scoped or none. decider: operator. Spec R5."
  - kind: decision
    id: group-cap-5
    title: Grouped notifications capped at 5 blocks
    body: "Operator chose 'cap at 5 + overflow line'. The overflow line prints the total firing count instead of '+N more' because Grafana's template function set has no arithmetic (spec Design, Template shape). decider: operator. Spec R6."
  - kind: decision
    id: verification
    title: "Verification: templates/test preview pre-merge, live post-merge (gate: tester)"
    body: "Operator chose 'Template preview API + live': pre-merge render via Grafana's templates/test preview (nothing sent) plus offline pytest guards; post-merge, observe a real firing/resolved pair. No .fr/candidate-install, so candidate is unavailable. decider: operator."
resolves: []
acceptance:
  - id: obs-telegram-firing-compact
    capability: obs
    acceptance: "A firing Grafana alert reaches the Frank C&C Telegram chat as a compact block (severity and alertname header, summary, identity-only Where line, runbook Fix line, rule link, rule-scoped silence link), without the value line, the label dump or the all-labels silence URL."
    origin: ["frank:docs/superpowers/specs/2026-10-22--obs--telegram-alert-brevity-design.md#R1"]
    status: not-implemented
    verify: live
  - id: obs-telegram-resolved-oneline
    capability: obs
    acceptance: "A resolved Grafana alert reaches the Frank C&C Telegram chat as a single line naming the alert and its summary."
    origin: ["frank:docs/superpowers/specs/2026-10-22--obs--telegram-alert-brevity-design.md#R4"]
    status: not-implemented
    verify: live
  - id: obs-telegram-group-cap
    capability: obs
    acceptance: "A Telegram notification grouping more than five firing alerts shows at most five alert blocks and ends with the total firing count and a link to the Grafana alert list."
    origin: ["frank:docs/superpowers/specs/2026-10-22--obs--telegram-alert-brevity-design.md#R6"]
    status: not-implemented
    verify: none
emitted:
  spec: docs/superpowers/specs/2026-10-22--obs--telegram-alert-brevity-design.md

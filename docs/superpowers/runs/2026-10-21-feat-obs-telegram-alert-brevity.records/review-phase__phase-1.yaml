- id: p1-r1
  state: fixed
  body: Severity and summary behind `with`; resolved summary too. Set 5 renders `🔥 FIRING · TestAlert` / `✅ RESOLVED · TestAlert`, zero "<no value>" across all sets. Pinned by test_missing_severity_or_summary_never_prints_no_value.
    bcb9dc89.
- id: p1-r2
  state: fixed
  body: Rule+Silence built only when `match "/alerting/grafana/[^/?]+/view"`; otherwise an absolute URL prints raw as Rule, anything else nothing (Grafana appends ?orgId=1 even to an empty URL — found in
    set 5). Overflow link guarded the same way. Sets 5/6 render clean. Pinned by test_links_are_built_only_from_a_rule_shaped_generator_url. bcb9dc89.
- id: p1-r3
  state: fixed
  body: 'Where: values tagged in plain text: `ns`, `workload`, `node`, `pvc`, `pod` — set 1 renders `Where: ns n8n-01 · workload n8n-01`. No markup, R7 intact. bcb9dc89.'
- id: p1-r4
  state: out-of-scope
  body: 'Reclassified out: the 4096 cap exists independently of this change, and the default template it replaces (all labels + ~900-char silence URL per alert) hits it with far fewer alerts — this change
    strictly lowers the risk. Worst observed render (set 3, 7 firing + 2 resolved) is 2886 chars. Documented in docs/runbooks/frank-gotchas/grafana.md "Telegram message template".'

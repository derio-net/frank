  - {id: sr2-f4, state: fixed, body: "Phase 1 rows moved under '## Phase 1 checks (shipped)'; '## Test Plan' now holds rows 7-11; the Phase 2 plan row is in Implementation Plans; Shipping shape names the agent-images PR for R12."}

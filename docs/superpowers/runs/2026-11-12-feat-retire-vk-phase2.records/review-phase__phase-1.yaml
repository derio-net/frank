journal:
  - kind: review
    id: p1-review
    phase: 1
    title: "independent code review of phase 1: 16 findings, all in scope, none critical"
    body: |
      Read-only review of `git diff origin/main...HEAD` against spec, plan and ops.yaml. Verdict: the
      git-state removal is clean and complete (root renders 66 Applications, no dangling references,
      exactly five uids tombstoned, comment-only edits changed no parsed YAML, remaining-workload test
      coverage intact, tripwire real). The archive script and ops.yaml had real holes: p1-r1..p1-r8
      important, p1-r9..p1-r16 minor. All sixteen were fixed: p1-r7, r8, r10, r11, r16 in ops.yaml and
      the plan prose by the orchestrator; p1-r1..r6, r9, r12..r15 by the implementer with tests.
  - {kind: finding, id: p1-r1, phase: 1, review_scope: in, title: "verify passes a truncated tarball (tar error swallowed) and a truncated bundle (list-heads fallback is header-only)", body: "scripts/retire-secure-agent-pod.sh verify and archive never tested the stream; MANIFEST is computed after transfer."}
  - {kind: finding, id: p1-r2, phase: 1, review_scope: in, title: "git/exec failure during local-only detection is recorded as zero, so the clone lands in NONE.txt with no bundle", body: "`rev-list … || echo 0` and `for-each-ref … || true` hid failures."}
  - {kind: finding, id: p1-r3, phase: 1, review_scope: in, title: "session guard false negatives: pipefail+grep -q on large ps output, pattern misses cli.js/versioned binary/tmux/hermes", body: "R9's 'confirms no interactive session remains' was not met."}
  - {kind: finding, id: p1-r4, phase: 1, review_scope: in, title: "key-fingerprint cannot compare the deleted SOPS file from the only tree where the script exists; gate silently weaker than spec", body: "The PR deletes the old key file, so the script compared the Tekton copy only and passed."}
  - {kind: finding, id: p1-r5, phase: 1, review_scope: in, title: "credential exclusion misses .credentials.json and .hermes/.env/auth.json and is tested only by source grep", body: "The fixture held no credential file."}
  - {kind: finding, id: p1-r6, phase: 1, review_scope: in, title: "tar aborts on files changing on a live pod, sqlite copied without WAL, missing path aborts the run", body: "From GNU tar's documented behaviour; not reproduced against the pod."}
  - {kind: finding, id: p1-r7, phase: 1, review_scope: in, title: "step-11 check can pass on a bump run that predates the agent-images kali-removal merge", body: "ops.yaml step-11 accepted the first run after the Frank merge."}
  - {kind: finding, id: p1-r8, phase: 1, review_scope: in, title: "step-10 check is instantaneous; Test Plan row 10 requires an hour", body: "ops.yaml step-10 could pass seconds after the silence was deleted."}
  - {kind: finding, id: p1-r9, phase: 1, review_scope: in, title: "bundles cover only refs/heads: detached HEAD commits, stashes and local tags are dropped; stale bundles survive re-runs", body: "Agent worktrees are detached by convention."}
  - {kind: finding, id: p1-r10, phase: 1, review_scope: in, title: "three ops sub-checks pass vacuously when kubectl fails", body: "`! kubectl … | grep -q` and `test -z \"$(kubectl … | python3 …)\"` are true on error."}
  - {kind: finding, id: p1-r11, phase: 1, review_scope: in, title: "sweep-revisions syncs root without prune and its check ignores operationState.phase", body: "A failed sync at the right revision passed."}
  - {kind: finding, id: p1-r12, phase: 1, review_scope: in, title: "always-loaded rules wrong: FR_ISOLATION_TARGET bullet marked HISTORICAL though hermes still uses it; repo-workflows.md says both agent pods", body: "agents/rules/frank-gotchas.md, agents/rules/repo-workflows.md."}
  - {kind: finding, id: p1-r13, phase: 1, review_scope: in, title: "agents-github-app-provision and agents-clawdia-retire retired with an inaccurate reason, beyond the spec's list", body: "docs/runbooks/manual-operations.yaml."}
  - {kind: finding, id: p1-r14, phase: 1, review_scope: in, title: "script test never exercises --not --remotes against a real remote", body: "The bundle fixture had no remote."}
  - {kind: finding, id: p1-r15, phase: 1, review_scope: in, title: "stale comments in test_claude_autoupdater_disabled.py and test_vk_retired.py describe removed kali behaviour", body: "Comments only."}
  - {kind: finding, id: p1-r16, phase: 1, review_scope: in, title: "manual-op block and ops.yaml name different revision fields for the same sync check", body: "_prose.md said operation.sync.revision; ops.yaml reads syncResult.revision."}
  - kind: discovery
    id: p1-script-live-paths-unexercised
    phase: 1
    title: Three script paths cannot be exercised off the pod
    body: |
      GNU tar's exit-1 tolerance, sops decryption from /dev/stdin, and the FIFO digest over a real
      `kubectl exec` are covered only by stubs on macOS (bsdtar). Their first real run is the
      operator's `archive` / `key-fingerprint`, both read-only, so a failure there is safe and visible.
resolves:
  - {id: p1-r1, state: fixed, body: "archive and verify require gzip -t and tar -tzf to pass; the pod emits a sha256 per stream, compared locally and stored in REMOTE.sha256; bundles get a pack-trailer check. Tests: test_truncated_tarball_stream_fails_archive, test_verify_fails_on_a_truncated_tarball, test_verify_fails_on_a_truncated_bundle."}
  - {id: p1-r2, state: fixed, body: "git failures abort the run. Test: test_a_failing_rev_list_fails_the_run."}
  - {id: p1-r3, state: fixed, body: "Guard matches over a here-string with a wider pattern, exempting remote-control. Tests: test_session_guard_catches_herdr_tmux_node_and_versioned_claude, test_session_guard_survives_a_huge_listing."}
  - {id: p1-r4, state: fixed, body: "The deleted file is read from origin/main and decrypted through a pipe; absent in both places fails unless --old-file-gone-ok; empty values rejected. Tests: test_key_fingerprint_compares_the_deleted_file_from_origin_main, test_key_fingerprint_fails_when_the_old_file_cannot_be_found, test_key_fingerprint_rejects_empty_values."}
  - {id: p1-r5, state: fixed, body: "One CRED_NAMES list feeds the excludes and verify's member check. Test: test_credentials_are_excluded_at_depth_and_verify_rejects_them."}
  - {id: p1-r6, state: fixed, body: "Paths are probed first (SKIPPED.txt; verify fails on a skipped essential), sqlite -wal/-shm included, GNU tar exit 1 tolerated with a warning. Tests: test_missing_optional_path_is_skipped_but_essentials_fail_verify, test_sqlite_wal_and_shm_are_archived_when_present."}
  - {id: p1-r7, state: fixed, body: "step-11 now requires kali absent from agent-images main and takes the first run created after both the Frank merge and the kali-removal commit."}
  - {id: p1-r8, state: fixed, body: "sweep-silence-delete records its time; step-10 requires 3600 s to have elapsed."}
  - {id: p1-r9, state: fixed, body: "Candidate refs are heads, tags, stash and a detached HEAD; uncovered worktree HEADs go to DETACHED.txt as a warning; outputs are cleared per run. Tests: test_tags_stash_and_detached_work_are_covered, test_rerun_clears_stale_bundles."}
  - {id: p1-r10, state: fixed, body: "The three sub-checks capture kubectl output first and require it non-empty; the binding scan prints NONE explicitly."}
  - {id: p1-r11, state: fixed, body: "root's sync operation carries prune true; the check requires operationState.phase Succeeded and a non-empty revision."}
  - {id: p1-r12, state: fixed, body: "The FR_ISOLATION_TARGET bullet is present tense and hermes-only; the Recreate + RWO bullet is a retired incident with a live lesson; repo-workflows.md names hermes-agent-shell."}
  - {id: p1-r13, state: fixed, body: "Both operations restored to done and re-homed (tekton, bootstrap); only the pod-namespace command line is marked retired."}
  - {id: p1-r14, state: fixed, body: "The fixture has a bare remote. Test: test_bundle_excludes_pushed_branch_and_keeps_local_only."}
  - {id: p1-r15, state: fixed, body: "Both comments rewritten."}
  - {id: p1-r16, state: fixed, body: "The manual-op block now names operationState.phase and syncResult.revision, and the runbook was resynced."}

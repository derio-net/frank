journal:
  - kind: decision
    id: d-pod-end-state
    title: Archive then delete the pod
    body: The operator's interactive triage run is the only temporary use. Archive the files worth keeping, then delete the Application, namespace, PVC, LoadBalancers and cluster-admin binding.
  - kind: decision
    id: d-chorebot
    title: Let chorebot stop
    body: No migration. Its data in Notion and code in willikins allow later revival.
  - kind: decision
    id: d-images
    title: Stop builds, archive the fork, keep GHCR packages
    body: The agent-images legs are removed, derio-net/vibe-kanban is archived, and published packages are retained so old commits still resolve.
  - kind: decision
    id: d-shipping
    title: Two PRs with live checks
    body: vk-local stays until Phase 2 so Phase 1 never rolls the pod. Phase 2 is held until the triage run ends and the archive verifies.

journal:
  - {kind: decision, id: p2-smoke-layout, phase: 2, title: "Smoke declarations live at smoke/<cluster>/<app>.yaml",
     body: "Two Application names exist on both clusters (argocd, fluent-bit), so a flat smoke/<app>.yaml is ambiguous. The cluster is the directory and also a field; a test fails on any orphan or missing file. Checks are in-cluster Service URLs (the verifier runs inside the cluster); Hop public services check their PUBLIC URL, headplane and landing are mesh-only and say so."}
  - {kind: discovery, id: p2-facts-fixture, phase: 2, title: "Stateful and Rollout detection is a generated fixture plus an offline re-check",
     body: "scripts/tests/fixtures/life/app-facts.yaml (life_policy.py --emit-facts) records per app: stateful, rollout, charts, images, repo paths. Detection counts PersistentVolumeClaim, workload kinds carrying volumeClaimTemplates or a persistentVolumeClaim volume, and operator CRs (AWX, VMSingle, VLSingle). Tekton TriggerTemplates that merely mention a claim shape are not state. Longhorn is stateful by identity. A test re-detects git-resident sources offline so a stale fixture fails. 35 apps are stateful; the only Rollout app is litellm-extras. Regenerate with RENDER_CACHE set (about 3 min cold)."}
  - {kind: discovery, id: p2-renovate-matchers, phase: 2, title: "Renovate rules match by repo path and chart name, resolved by policy order",
     body: "Renovate cannot match an Application by name, so each policy rule is translated to matchFileNames (the app's manifests path, values files and root template) plus matchPackageNames (its charts). Later rules override earlier ones, so defaults come first, then per-app session rules, with groupName reset to null and labels replaced (path:<x>). A chart shared by apps of different paths (postgresql) takes the strictest. All 16 variants set automerge false and approval true only for session/operator-runbook. A test proves no stateful or Rollout app path appears in an auto-merge or batch rule."}
  - {kind: discovery, id: p2-renovate-validator-skipped, phase: 2, title: "renovate-config-validator not installed locally, test skipped",
     body: "The validator is an npm binary; the test skips with a reason when it is not on PATH (no global npm install allowed here). CI or the console phase should run it for real."}
  - {kind: discovery, id: p2-renovate-placeholders, phase: 2, title: "Renovate GitHub App ids and PEM are placeholders until the manual phase",
     body: "clustergenerator.yaml carries appID/installID PENDING-MANUAL-PHASE so the generator fails loudly rather than minting a wrong token; the PEM Secret github-app-renovate-key must be applied in namespace renovate (ESO resolves secretRef in the consumer namespace). The token secretKeyRef is optional so the sync never blocks. Phase 7 must fill both ids and apply the PEM. The renovate/renovate:44.198.3 image was verified on Docker Hub and the audit snapshot regenerated."}
  - {kind: discovery, id: p2-smoke-unverified-secrets, phase: 2, title: "Two functional smoke checks name secrets that were not read from a cluster",
     body: "litellm chat uses litellm-api-keys/LITELLM_MASTER_KEY (from the ExternalSecret) and the Grafana dashboards check assumes the chart-default admin secret victoria-metrics-grafana (admin-user/admin-password). The litellm check also depends on the GPU timeshare slot. Confirm both against the live cluster when the verifier is built."}

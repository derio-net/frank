journal:
  - {kind: discovery, id: p4-image-pins, phase: 4, title: "Console image is the tag v0.1.0; phase 7 must replace it with the published digest",
     body: "apps/cluster-update-fr/manifests/deployment.yaml pins ghcr.io/derio-net/cluster-update-fr:v0.1.0 because the first release is unpublished. PHASE 7: take the @sha256: digest from the v0.1.0 release notes and replace the tag (the console README says release tags are semver; verify whether the published tag carries the v prefix). runs-fr is chart v0.3.0 (git tag) with image ghcr.io/derio-net/runs-fr:0.3.0 in apps/runs-fr/values.yaml, also tag-pinned, digest not looked up. The runs-fr image is invisible to the render audit and to Renovate because the chart is remote (app-facts lists images: []); a version bump of runs-fr is therefore a manual edit of two lines (template targetRevision + values tag) until Renovate learns that file."}
  - {kind: discovery, id: p4-trust-config-empty, phase: 4, title: "Trust config is EMPTY, not a placeholder",
     body: "The console treats an unset RENOVATE_BOT_LOGIN / CONSOLE_BOT_LOGIN / SESSION_BOT_LOGIN / STATUS_CREATOR_LOGINS as trust nothing. A literal placeholder string would be a valid GitHub login that anyone could register and be trusted, so apps/cluster-update-fr/manifests/files/console.env leaves them empty and a test pins that. Branch prefixes are built into the console (the final README has no env for them); required_ci_contexts lives in update-policy.yaml (added: gitea-actions/*). The ClusterGenerators DO use PENDING-MANUAL-PHASE for appID/installID: that makes minting fail loudly, which is the safe direction."}
  - {kind: discovery, id: p4-upgrade-sessions-ns-dependency, phase: 4, title: "Roles in upgrade-sessions need the namespace from phase 5",
     body: "The console Role/RoleBinding (pods+secrets get/list/create/delete) and runs-fr's chart Role/RoleBinding (pods get/list/watch + pods/exec create) are namespaced to upgrade-sessions, which the upgrade-sessions app (phase 5) creates. Until it exists those objects cannot sync. Phases ship in one PR so the order resolves at merge; if phase 4 were ever applied alone, create the namespace first. The console's role deliberately has no watch, no patch/update, no rolebindings and no pods/exec; frank pre-binds the per-type session roles (phase 5)."}
  - {kind: discovery, id: p4-omni-sidecar-deferred, phase: 4, title: "Omni version sidecar is not deployed; OMNI_STATUS_FILE points at an empty dir",
     body: "The contract wants a Reader-role omnictl sidecar writing {\"version\": ...} to OMNI_STATUS_FILE (/var/run/omni-status/status.json, an emptyDir). The image known to carry omnictl is the upgrade-session image, whose tag phase 5 produces, so the sidecar is not in this phase; until it is added the file is absent and the console shows Omni's version as unknown (assumed from the README, not tested). Add the sidecar once SESSION_IMAGE is pinned (phase 5/7), or point the console at a different source."}
  - {kind: decision, id: p4-runs-fr-role-header, phase: 4, title: "runs-fr AUTH_ROLE_HEADER is X-authentik-meta-provider so a client cannot assert owner",
     body: "runs-fr gates node shells on role == owner read from a header the proxy must OVERWRITE. Traefik forwardAuth copies only authResponseHeaders onto the request, so the default X-Forwarded-Role would pass a client-supplied value straight through. Authentik sets no role, so the header is pointed at one the outpost always sets to the provider name; it can never equal owner and node shells stay off. A test requires the header to be in the middleware's authResponseHeaders. The Role in upgrade-sessions could not open node shells anyway."}
  - {kind: decision, id: p4-ingress-lockdown, phase: 4, title: "CiliumNetworkPolicy on the console and runs-fr; chart NetworkPolicy off; no siteMonitor tiles",
     body: "Console: 8080 from Traefik pods (traefik-system, app.kubernetes.io/name=traefik), 9090 from vmagent (monitoring, app.kubernetes.io/name=vmagent), 8081 from namespace upgrade-sessions; nothing else, no entities/CIDR. Metrics are scraped by a VMPodScrape because no Service exposes 9090. runs-fr: 8080 from Traefik only; the chart's own NetworkPolicy is left off so there is one statement of the rule. Because of this the smoke checks are exec-probes (an HTTP probe from the verifier would be refused) and the homepage tiles carry no siteMonitor. UNVERIFIED on a cluster: the vmagent and Traefik pod labels (assumed standard) and that kubelet probes still pass; if the console scrape is down after sync, check the vmagent labels first."}
  - {kind: discovery, id: p4-authentik-unverified, phase: 4, title: "Authentik JWT contract is unverified: client_id, signing key, groups claim",
     body: "The blueprint sets client_id: cluster-update-console, signing_key (the self-signed cert pair, so the JWT is RS256), and the openid/email/profile mappings on the console provider, and a policy binding of both applications to the group root-admins. The console config expects issuer https://auth.cluster.derio.net/application/o/updates-cluster/, JWKS .../jwks/, audience cluster-update-console, OPERATOR_GROUP root-admins. Not observed: whether Authentik honours an explicit client_id on a proxy provider, the exact iss, and whether `groups` is in the forwarded JWT. PHASE 7: after assigning the provider to the embedded outpost, decode one real X-authentik-jwt and compare."}
  - {kind: discovery, id: p4-phase7-manual-ops, phase: 4, title: "Phase 7 manual steps this phase creates",
     body: "1) Authentik: add BOTH providers (Cluster Update Console (cluster), Upgrade Sessions (cluster)) to the embedded outpost via the Django ORM step in agents/rules/frank-argocd.md. 2) GitHub Apps: renovate, console (contents/PRs/statuses/issues/webhooks write, metadata read), and the third SESSION App (contents+PRs write only, frank only); PEMs into ns cluster-update-fr as github-app-cluster-update-console-key and github-app-cluster-update-session-key (key `key`); replace PENDING-MANUAL-PHASE appID/installID in apps/cluster-update-fr/manifests/clustergenerators.yaml. 3) Fill RENOVATE_BOT_LOGIN, CONSOLE_BOT_LOGIN, SESSION_BOT_LOGIN and STATUS_CREATOR_LOGINS (the status bridge's GitHub identity, i.e. who github-status posts as) in console.env; SESSION_IMAGE when phase 5 publishes it. 4) Infisical keys: FRANK_UPDATER_TELEGRAM_BOT_TOKEN, FRANK_UPDATER_TELEGRAM_CHAT_ID, FRANK_UPDATER_TELEGRAM_SECURITY_THREAD_ID, FRANK_UPDATER_GITEA_TOKEN (key names chosen here, not found in Infisical). 5) Secrets applied out of band in ns cluster-update-fr: frank-updater-tailscale/authkey (the same reusable ephemeral tag:frank-updater key as hop-scan), hop-readonly-kubeconfig/config (its cluster entry needs `proxy-url: socks5://localhost:1055`; hop-scan instead uses HTTPS_PROXY), cluster-update-session-omni/key, -talos/talosconfig, -hop-talos/talosconfig, -hop-kube/config. 6) Mirror, trigger-first: this PR already puts derio-net/cluster-update-fr in the gitea-status-bridge allowlist, derio-net-main-sync/pr-sync, mirror-reconcile, ci-delivery-check and the derio-net mirror token generator; THEN create the Gitea mirror repo, make sure the derio-fr-automation App installation includes the repo, and create the GitHub push+pull_request webhook LAST (declared in apps/tekton/webhooks.yaml). 7) The branch ruleset on frank must cover cluster-update/batch-, cluster-update/revert- and cluster-update/session-<id>/."}
  - {kind: discovery, id: p4-mirror-surface, phase: 4, title: "Onboarding a derio-net mirror touches ten places, and a blanket replace hit a wrong one",
     body: "derio-net/cluster-update-fr was added next to runs-fr in: eventlistener.yaml (status bridge), eventlistener-github.yaml (derio-net-main-sync, derio-net-pr-sync), mirror-reconcile.yaml (2 stages x 2 lists), ci-delivery-check.yaml (2 lists), the derio-net mirror ClusterGenerator, ci-budget tiers + clustergenerators (tier github-preferred), webhooks.yaml, and two test lists. A first sed-style replace also rewrote the staging-gate-runs-fr repository_dispatch trigger (and its comment); test_webhook_delivery_paths caught it and it was reverted by hand."}
  - {kind: discovery, id: p4-console-approved-check, phase: 4, title: "Console contract: post cluster-update/approved on the head SHA right before merging",
     body: "The main ruleset (manual op life-main-ruleset, new step P7.T1.S5) requires a PR and a status check `cluster-update/approved` whose expected source is the CONSOLE App; bypass actors are the operator and the console App only. So the console must post `cluster-update/approved` (state success) on the PR head SHA immediately before it merges, or merge as a bypass actor. The session App and Renovate App can open PRs but cannot push to main or satisfy the check. RELAY to the cluster-update-fr repo. The ruleset also has to exist before the session App is installed (clustergenerators.yaml says so)."}
  - {kind: decision, id: p4-sec-1, phase: 4, title: "Session App comment corrected; main ruleset added to phase 7",
     body: "The old comment claimed the session App cannot merge; it holds contents:write and could push to main. The comment now names the real control (a GitHub ruleset, manual, phase 7) and 07.yaml has step P7.T1.S5 + manual-operation block life-main-ruleset in _prose.md. Not run live."}
  - {kind: decision, id: p4-sec-2, phase: 4, title: "ValidatingAdmissionPolicies bound to upgrade-sessions confine console-created pods",
     body: "admission-policy.yaml: for pods created/updated by the cluster-update-fr SA, only the five types, labels managed-by=cluster-update-fr + cluster-update.fr/type, serviceAccountName upgrade-session-<type> (default for hop-os), automountServiceAccountToken true except hop-os, image ghcr.io/derio-net/upgrade-session with a : or @sha256: delimiter, no ephemeral containers, host namespaces, hostPath, privileged or added capabilities (init containers included). A second policy denies pods/ephemeralcontainers for everyone outside system:masters and the OIDC group root-admins. failurePolicy Fail. Secrets/pods `list` kept for orphan reconciliation (documented in rbac.yaml). UNVERIFIED: the CEL was only checked structurally (no CEL engine offline); apply with a dry-run or a denied test pod in phase 7. If a console pod launch is refused, the message names the failed rule."}

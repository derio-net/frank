# blog-craft sync snapshot — GENERATED, DO NOT EDIT.
#
# The .blog-craft.yaml as of the last successful blog-craft sync (a bootstrap,
# or `tools/update.py --apply`). update.py renders THIS file — not your current,
# possibly-edited config — through the templates at `blog_craft_version`, to
# recover an honest 3-way-merge base.
#
# Rendering the base with the *current* config makes every config edit look like
# content blog-craft already shipped, so the merge reads your on-disk file as a
# deliberate deletion and keeps the deletion. See derio-net/blog-craft#60.
#
# COMMIT THIS FILE. Without it the updater falls back to the current config and
# says so. Delete it only to deliberately forget what was last synced.
version: 5
blog_craft_version: "v0.17.0"   # blog-craft RELEASE frank is synced to (was v0.16.1).
                                # update.py re-renders AT this tag to recover the
                                # 3-way merge base — a wrong value silently degrades
                                # every `merged` path to a baseless conflict. Bump
                                # AFTER an apply, never before.

# Hugo site lives under blog/; .blog-craft.yaml stays at the repo root.
# blog-craft's /blog-post scaffolding and /update path mapping read this (v4).
site_dir: blog

project:
  name: "Frank"                                   # slug: drives the read-tracker storage key
  title: "Frank, the Talos Cluster"               # display title (navbar / <title>)
  tagline: "Building, operating, and deciding: an AI-hybrid Kubernetes homelab with Talos Linux, Cilium, Longhorn, ArgoCD, and GPU compute"
  base_url: "https://derio-net.github.io/frank/"
  base_path: "/frank/"
  module_path: "derio-net.github.io/frank"
  repo_url: "https://github.com/derio-net/frank"  # adds a GitHub nav link

# Image-layer prose is authored so blog-craft's COMPOSED prompt text (per entry)
# matches frank's legacy generate-all-images.py output — proven by
# smoke-image-compose. frank's blog/prompt_for_images.yaml + static/images are
# preserved as content; this block governs FUTURE /blog-craft:media runs.
image:
  provider: gemini
  model: gemini-3-pro-image-preview
  api_key_env: GEMINI_API_KEY
  output_dir: static/images
  # Repo-root-relative: generate-images.py resolves this against the directory
  # holding .blog-craft.yaml (the repo root), while frank's Hugo site lives in
  # blog/. Without the prefix the generator finds zero entries and every
  # `--only <key>` fails with "unknown key". Matches the other repo-root-relative
  # paths here (content_types.papers.data_dir) and every entry's `output:`.
  prompts_file: blog/prompt_for_images.yaml
  reference_pool: .reference-pool
  # Character sheets (scripts/gen-character-sheet.py) draw their prose from
  # these layers — frank's character lives in base_character, not the default
  # persona/visual_constants vocabulary.
  character_sheet: { layers: [base_character] }
  curation: { count_default: 1, archive_cap: 30, contact_sheet: true }
  # Build-time WebP optimization (blog-craft #14). Hugo emits width-capped WebP +
  # srcset from the PNG masters (masters untouched). Banners live in assets/images/.
  optimize: { enabled: true, format: webp, quality: 82, max_width: 1600, banner_max_width: 2560 }
  # v5 (blog-craft #44): NAMED composition orders; entries pick via
  # composition.order (default hero). reference_guidance is a chunk map —
  # orders include exactly the chunks an image type needs.
  composition_orders:
    hero:
      - base_character
      - base_atmosphere
      - reference_guidance[anchor]
      - reference_guidance[character]
      - reference_guidance[single_hero]
      - reference_guidance[drawing_instructions]
      - clothing
      - mood
      - scene
    scenery:
      - base_atmosphere
      - reference_guidance[anchor]
      - reference_guidance[scenery_reference_image]
      - scene
    # Series header strips. Same as hero, plus banner_style — which explains the
    # 2nd/3rd attached images (existing banner = layout/palette authority,
    # lettering crop = typeface authority). Needed because the only model that
    # renders 8:1 garbles invented lettering; matching a crop is reliable.
    banner:
      - base_character
      - base_atmosphere
      - reference_guidance[anchor]
      - reference_guidance[character]
      - reference_guidance[banner_lettering]
      - reference_guidance[single_hero]
      - reference_guidance[drawing_instructions]
      - clothing
      - mood
      - scene
    # Widen an EXISTING banner 6:1 -> 8:1. Intentionally omits base_character and
    # drawing_instructions: those tell the model to redraw Frank and vary his pose,
    # which would destroy the artwork we are trying to preserve.
    banner_transform:
      - reference_guidance[banner_transform]
      - scene
  layers:
    base_character: |-
      Frank — a chibi-proportioned green Frankenstein monster. Uneven
      cartoon-green skin with brown / reddish-tan sewn-on patches across the
      cheek and jaw (horizontal stitch lines crossing each; brown against
      green, NOT mechanical implants). Each eye is a solid BLACK circle
      with a single small WHITE pupil-dot — no glow. No nose. Messy black
      flat-top hair with jagged spiky peaks. Thick raised brow ridge, no
      eyebrows. A horizontal stitched scar across the upper forehead with
      a small rectangular RED bandage over it above the right eye. Two
      symmetric RJ45-connector bolts on the temples, each sparking
      faint blue. Hands stitched onto the arms with visible scar lines
      around the wrists. Cartoon illustration, thick outlines, vibrant
      colours.
    base_atmosphere: |-
      Dark server-room aesthetic. Deep navy or near-black background;
      studio-style framing rather than a documentary photograph.
      Small flecks of bright white / electric-blue sparks scattered
      through the scene; faint blue glow on metal edges and from any
      small LED indicators in the frame.
      Lighting is a single warm overhead source unless the scene says
      otherwise; soft falloff into deep shadow rather than uniform fill.
    reference_guidance:
      anchor: The reference images attached to this request are ANCHORS, not subjects to render.
      scenery_reference_image: |-
        The FIRST reference image is only to be used as a guide for the scene's perspective, lighting, and composition.
      character: |-
        The FIRST reference image is the canonical character-design sheet. Use this to tune the hero's appearance
      single_hero: |-
        There is exactly ONE Frank in the final image, regardless of how many reference images show him.
      drawing_instructions: |-
        Redraw Frank from scratch in the scene's perspective and lighting; vary his pose, angle, head turn,
        and body language to fit the scene's action.
      banner_lettering: |-
        The SECOND reference image is a crop of the exact title lettering. The title text in
        your output must match it exactly in typeface, letter weight, spacing and blue glow —
        do not substitute a different font. Spell every word exactly as given, with correct,
        cleanly formed, unbroken letters.
      banner_transform: |-
        The FIRST reference image is this banner's existing finished artwork, at a 6:1 aspect
        ratio. Your task is a CANVAS WIDENING, not a redraw: reproduce that artwork at 8:1.
        Every existing element — the figure, its pose, outfit and expression, the title
        lettering, the icons, the colours, the glow, the lighting — must be preserved faithfully
        and must NOT be redrawn, restyled, recoloured, moved or resized relative to the image
        height. Widen the canvas by extending the existing background (circuit-board texture,
        PCB traces, lightning arcs, darkness) outward to the left and right so the composition
        fills the wider frame naturally and fades into darkness at both edges. Introduce no new
        subjects, no new props and no new text.
        The SECOND reference image, when attached, is a crop of the exact title lettering: the
        title in your output must match it exactly in typeface, letter weight, spacing and blue
        glow, with correct, cleanly formed, unbroken letters.
    clothing:
      generic:
        default: Frank's torso/body is exposed server hardware
      building:
        default: Frank's torso/body is exposed server hardware
        dirty: Frank wears dirty/patched work clothes.
        overalls: Frank wears overalls.
        overalls_lab: Frank wears overalls under a lab coat.
        apron: Frank wears a work apron with tools in the pockets.
      operating:
        lying_open_access: Frank's is lying on his back, torso has an open access panel exposing a device under maintenance
        hoodie_and_sunglasses: Frank wears a hoodie and sunglasses.
        tshirt_rolled_sleeves: Frank wears t-shirt with rolled-up sleeves.
        lab_coat: Frank wears an open white lab coat over a dark grey-teal t-shirt printed with an orange gear graphic, a brown leather tool belt with a wrench tucked into it, dark jeans and brown boots.
      papers:
        default: Frank wears a thin black necktie over a white button-down dress shirt, small senior reading glasses perched low on the nose.
        white_lab_coat: Frank wears a white lab coat over a white button-down dress shirt and thin black necktie, small senior reading glasses perched low on the nose.
        leather_overalls: Frank wears leather overalls over a white button-down dress shirt and thin black necktie, small senior reading glasses perched low on the nose.
    mood:
      curious: Frank's expression is curious — head tilted, brow lifted, eyes wide and attentive.
      weighing: Frank's expression is weighing — measured, slightly squinting, the look of someone judging an option.
      determined: Frank's expression is determined — jaw set, brow level, eyes forward and focused.
      worried: Frank's expression is worried — brow furrowed inward, mouth tightened, eyes slightly wider than usual.
      smirking: Frank's expression is smirking — one corner of the mouth pulled up, eyes narrowed in dry amusement.
      approving: Frank's expression is approving — a small contented smile, brow relaxed, eyes calm and pleased.
      skeptical: Frank's expression is skeptical — one brow raised higher than the other, mouth flat, eyes narrowed.
      satisfied: Frank's expression is satisfied — soft closed-mouth smile, brow at rest, eyes relaxed.
      cautious: Frank's expression is cautious — alert but not anxious; brow level, eyes scanning, mouth neutral.
      angry: Frank's expression is angry — brow pulled down, mouth tight, eyes narrowed and dark.
      alarmed: Frank's expression is alarmed — eyes wide, brow lifted high, mouth slightly open.
      focused: Frank's expression is focused — brow lowered in concentration, eyes locked on his work, mouth still.
      amused: Frank's expression is amused — small grin, brow relaxed, eyes bright.

# series.title drives the NAV menu names (frank's nav is the short form); the
# longer section/overview + homepage-card titles live in frank's preserved content.
series:
  - { key: building,  title: "Building",  description: "Assembling the cluster, layer by layer.", content_type: posts }
  - { key: operating, title: "Operating", description: "Running and maintaining the cluster.",     content_type: posts }
  - { key: papers,    title: "Papers",    description: "Vendor analysis + decision narratives.",   content_type: papers }

# Series-index registry — drives the card layer palette (blog/data/layer_palette.yaml,
# regenerated by blog/scripts/gen-layer-palette.py --config .blog-craft.yaml) AND the
# layer-name tag on each card. Codes are IN ORDER: the generator assigns each layer a
# hue by its registry index (permuted for max successive contrast), so REORDERING
# changes every colour. Names are the docs/layers.yaml display names.
series_index:
  style: cards
  layers:
    - { code: hw,      name: "Hardware & Nodes" }
    - { code: os,      name: "OS & Bootstrap" }
    - { code: net,     name: "Networking" }
    - { code: stor,    name: "Storage" }
    - { code: gpu,     name: "GPU Compute" }
    - { code: gitops,  name: "GitOps" }
    - { code: fun,     name: "Fun Stuff" }
    - { code: obs,     name: "Observability" }
    - { code: backup,  name: "Backup & DR" }
    - { code: secrets, name: "Secrets Management" }
    - { code: infer,   name: "Local Inference" }
    - { code: agents,  name: "Agentic Control Plane" }
    - { code: auth,    name: "Unified Auth" }
    - { code: tenant,  name: "Multi-tenancy" }
    - { code: orch,    name: "AI Agent Orchestrator" }
    - { code: media,   name: "Media Generation" }
    - { code: edge,    name: "Public Edge" }
    - { code: deploy,  name: "Progressive Delivery" }
    - { code: cicd,    name: "CI/CD Platform" }
    - { code: auto,    name: "Infrastructure Automation" }
    - { code: repo,    name: "Repository & Tooling" }

content_types:
  papers:
    enabled: true
    dossier_dir: docs/papers-dossiers
    dossier_base_url: "https://github.com/derio-net/frank/blob/main/docs/papers-dossiers"
    data_dir: blog/data/papers
    gate: { min_vendors: 3, min_sources: 5, min_source_types: 3,
            min_artefacts: 3, min_artefact_kinds: 2, min_gaps: 1, min_counterargs: 1 }
    source_types:   [vendor-docs, paper, postmortem, talk, benchmark]
    artefact_kinds: [grafana-screenshot, asciinema, yaml, commit, incident]
    shortcodes:     [landscape, capability-matrix, scar, pullquote, dossier-link, references-index]
    crosslink_fields: [related_building, related_operating]
    weight_offset: 1

features:
  series_overview_posts: true
  read_tracker: true
  banners:   { operator_generated: true }
  roadmap:   { enabled: true, data: data/roadmap.yaml }
  analytics: { provider: goatcounter, url: "https://counter.derio.net" }
  # blog.derio.net serves `script-src 'self'` with no 'unsafe-inline', which
  # drops Hextra's INLINE mermaid init. Diagrams still render (mermaid
  # self-starts) but freeze in the light theme and stop following the toggle —
  # silently, on all ~80 posts that use one. This materializes the external
  # replacement. Do NOT turn it off while the CSP is on; do NOT turn it on for a
  # blog without one (the theme's block would still run, racing two observers).
  # blog-craft #58 / CONFIG.md §10; frank first shipped this locally in #710.
  mermaid_csp_init: true
  # Mermaid palette is in custom.css (.content scoping = all docs posts).
  # css.mermaid_palette is not used because frank's theme applies global
  # SVG overrides via CSS nesting; the papers quadrant-chart selectors
  # remain scoped to .paper-post only.
  # Click-to-expand abbreviation definitions. An infra blog is abbreviation-dense
  # (338 unique candidates across 83 posts), so terms are marked POST BY POST via
  # /blog-craft:glossary, never in one blind sweep: a marker whose key is missing
  # from data/glossary.yaml FAILS the Hugo build, by design. The registry is
  # content-class, so /update never touches the definitions. No JS — the panel is
  # <button popovertarget> + CSS anchor positioning, which is why this is safe
  # under the same `script-src 'self'` CSP that forced mermaid_csp_init above.
  # blog-craft #48 / CONFIG.md §9.
  glossary:  { enabled: true, first_occurrence_only: true }

# Blog-craft quality gates.
#
# mermaid_syntax is OFF because turning it on would fail CI on content that
# already shipped, not on anything this branch changed. The gate rejects edges
# that target a subgraph id (`svc --> mySubgraph`), and frank's back catalogue
# has 50 of them across ~30 posts. That shape is legal Mermaid and renders
# today; the gate's objection is that it lays out unpredictably. Fixing one is
# not mechanical — you have to choose WHICH node inside the subgraph the edge
# should really point at, which is a per-diagram judgement call.
#
# This is the first time anything has measured that, because the workflow
# carrying this gate was never executed (see .github/workflows/blog-ci.yml).
# The step stays wired there, so flipping this to true is the only action
# needed once the diagrams are converted — no workflow edit.
#
# Two were converted here (operating/12, operating/13) as worked examples of
# the fix: point the edge at a representative node inside the subgraph.
quality:
  mermaid_syntax: false

voice: |
  Frank speaks as the cluster itself — conversational, technically precise,
  darkly self-aware. Teach through story; admit failures with the same weight
  as successes.

ci:
  validators: [frontmatter, dossier, mermaid, hugo_build]
  deploy: { kind: container_pages }
# How thick the persona frame is. (options: dry,balanced,rich)
voice_level: balanced

# Smoke declaration for hop/storage (spec R16/R17). The verifier runs these after every rollout.
app: storage
cluster: hop
checks:
- kind: exec-probe
  target: application/storage
  namespace: argocd
  expect:
    health: Healthy
    applied: true
  reason: 'config-only application: no workload of its own; proves the objects were applied and are healthy'

# Smoke declaration for frank/grafana-alerting (spec R16/R17). The verifier runs these after every rollout.
app: grafana-alerting
cluster: frank
checks:
- kind: exec-probe
  target: application/grafana-alerting
  namespace: argocd
  expect:
    health: Healthy
    applied: true
  reason: 'config-only application: no workload of its own; proves the objects were applied and are healthy'

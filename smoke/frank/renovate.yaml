# Smoke declaration for frank/renovate (spec R16/R17). The verifier runs these after every rollout.
app: renovate
cluster: frank
checks:
- kind: exec-probe
  target: cronjob/renovate
  namespace: renovate
  expect:
    last_job_succeeded: true
  reason: 'no network surface (controller/daemon/job): readiness of the workload is the only observable'

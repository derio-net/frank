# Smoke declaration for frank/argocd (spec R16/R17). The verifier runs these after every rollout.
app: argocd
cluster: frank
checks:
- kind: http
  target: http://argocd-server.argocd.svc.cluster.local:80/healthz
  expect:
    status: 200
- kind: functional
  name: application list is readable and non-empty
  target: k8s://argocd/applications.argoproj.io
  expect:
    min_items: 1
    none_unknown_health: true
  note: read-only list; "applied" is judged by operationState.sync.revision == merge SHA, never by Synced alone

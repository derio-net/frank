name: Build Speech Image

on:
  push:
    branches: [main]
    paths:
      - "apps/speech/docker/**"
      - ".github/workflows/build-speech.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/speech
  # Image tag. Bump together with the Deployment pin in
  # apps/speech/manifests/deployment.yaml (guarded by
  # scripts/tests/test_speech_image_build.py) so a rebuild redeploys.
  # Format: <speaches base>-ct2-<ctranslate2>-r<rev>
  SPEECH_REV: "0.9.0-rc.3-ct2-4.6.3-r2"
  CTRANSLATE2_VERSION: "4.6.3"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: apps/speech/docker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SPEECH_REV }}
          build-args: |
            CTRANSLATE2_VERSION=${{ env.CTRANSLATE2_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

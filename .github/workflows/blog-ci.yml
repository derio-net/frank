# Blog validation gates — the blog-craft surface, wired where GitHub can see it.
#
# HISTORY, because the shape of this file is otherwise puzzling. blog-craft used
# to materialize its CI under the Hugo site root — for frank,
# `blog/.github/workflows/blog-ci.yml`. GitHub Actions reads workflows ONLY from
# `.github/workflows/` at the REPOSITORY root, so that copy was inert from the
# day it arrived (#667): its papers, mermaid and image gates never ran once,
# while looking for all the world like they did. It could not have passed even
# if GitHub had run it, which is the tell that nobody ever did — it invoked
# `--config .blog-craft.yaml` and `docs/papers-dossiers/*` site-relative, and
# both live at the repo root here.
#
# FIXED UPSTREAM in blog-craft v0.17.0 (blog-craft#61): the manifest now declares
# a path ROOT per file, `.github/**` is repo-rooted, the shipped template renders
# site-relative paths from `site_dir`, and `/update` RELOCATES a stale copy
# instead of leaving two. So this is no longer a local deviation — the template
# and this file now agree on every validator, glob and working-directory.
#
# WHAT FRANK STILL ADDS, and why each is deliberate rather than drift:
#   - Setup Go — Hextra is a Hugo module, so the build needs a Go toolchain to
#     fetch it. The template has no such step. Deliberately no `hugo mod get`:
#     it resolves to latest and rewrites the theme pin in blog/go.mod, so CI
#     would test a different Hextra than the one committed.
#   - peaceiris/actions-hugo pinned by commit SHA rather than a tag.
#   - job name `blog-validate`, not `validate` — agent-config.yml already
#     publishes a check called `validate`, and two identically-named checks on
#     one PR are unreadable.
#   - `paths:` filters, so an infra-only PR does not run a Hugo build.
#   - `permissions: contents: read`.
#   - the upstream `deploy` job is NOT carried over: it is an echo stub, and
#     frank deploys via deploy-blog.yml. Two deploy paths for one site is a race.
#
# `scripts/tests/test_blog_ci_at_repo_root.py` guards the placement and the gate
# list. Its inert-copy check is now a regression guard rather than a live
# tripwire — v0.17.0 no longer re-adds the file.
name: blog

# The two path lists are duplicated on purpose: GitHub Actions' workflow parser
# does not resolve YAML anchors, so an `&anchor`/`*alias` pair here would not be
# the DRY version of this — it would be a parse error or a silently empty filter.
on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - ".blog-craft.yaml"
      - "docs/papers-dossiers/**"
      - ".github/workflows/blog-ci.yml"
  pull_request:
    paths:
      - "blog/**"
      - ".blog-craft.yaml"
      - "docs/papers-dossiers/**"
      - ".github/workflows/blog-ci.yml"

jobs:
  blog-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hextra is a Hugo module, so the build needs a Go toolchain to fetch it.
      # Note there is deliberately no `hugo mod get` here: it resolves modules to
      # latest and rewrites the theme pin in blog/go.mod, which would make CI
      # test a different Hextra than the one committed.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: "0.157.0"
          extended: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator deps
        run: pip install --quiet pyyaml

      # Papers: keep data/papers in step with the dossiers, then gate each
      # dossier and every post's frontmatter.
      - name: Validate papers
        run: |
          python3 blog/scripts/sync_dossier_to_data.py --config .blog-craft.yaml --check
          for d in docs/papers-dossiers/*/dossier.md; do
            python3 blog/scripts/validate_dossier.py --config .blog-craft.yaml "$d"
          done
          python3 blog/scripts/validate_papers.py --config .blog-craft.yaml blog/content/docs/papers/*/index.md

      # Abbreviation glossary gate: every abbr marker must have an entry in
      # blog/data/glossary.yaml. A marker with nothing behind it is a broken
      # promise to the reader — and it fails the Hugo build, so without this gate
      # the failure surfaces on push-to-main rather than on the PR that caused it.
      # Markers inside code fences are ignored, so a post documenting the
      # shortcode is not gated on its own example.
      - name: Validate glossary
        run: python3 blog/scripts/validate_glossary.py --config .blog-craft.yaml blog/content/docs/*/*/index.md

      # Mermaid syntax gate: lint every ```mermaid fence before render, so a
      # broken diagram fails CI instead of shipping dead.
      - name: Validate mermaid syntax
        run: python3 blog/scripts/validate_mermaid.py --config .blog-craft.yaml blog/content/docs/*/*/index.md

      # Image-entry gate: prompt_for_images.yaml entries stay generable — no
      # duplicate keys, no dead `references:` paths, no selector that silently
      # resolves to nothing (an out-of-range torso_variant would drop that layer
      # from every future regen).
      - name: Validate image entries
        run: python3 blog/scripts/validate_images.py --config .blog-craft.yaml

      - name: Hugo build
        working-directory: blog
        run: hugo --minify
